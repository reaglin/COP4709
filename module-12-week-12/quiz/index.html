  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_12_(Week_12)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.4754068-05:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is SQL injection?","Hint":null,"Feedback":"SQL injection occurs when attackers insert malicious SQL code into input fields that is then executed by the database. Example: entering \u0027 OR \u00271\u0027=\u00271 in a login field to bypass authentication. Can lead to data theft unauthorized access data modification or database destruction. Prevented by parameterized queries input validation and least privilege principles.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753889-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A method for backing up databases","OptionFeedback":""},{"Weight":100,"Text":"A code injection attack where malicious SQL statements are inserted into input fields to manipulate the database","OptionFeedback":""},{"Weight":0,"Text":"A technique for optimizing queries","OptionFeedback":""},{"Weight":0,"Text":"A database recovery method","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What is the most effective way to prevent SQL injection attacks?","Hint":null,"Feedback":"Parameterized queries separate SQL code from user data preventing injection. Example: SqlCommand with @Parameters instead of string concatenation. Parameters are typed and escaped automatically. Additional defenses: input validation whitelisting allowed characters stored procedures with parameters and least privilege accounts. Never concatenate user input directly into SQL strings.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753898-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use parameterized queries or prepared statements with bound parameters","OptionFeedback":""},{"Weight":0,"Text":"Disable all user input fields","OptionFeedback":""},{"Weight":0,"Text":"Use only stored procedures without parameters","OptionFeedback":""},{"Weight":0,"Text":"SQL injection cannot be prevented","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What does the principle of least privilege mean in database security?","Hint":null,"Feedback":"Least privilege means granting only required permissions: application user needs SELECT INSERT UPDATE on specific tables not db_owner web user needs EXECUTE on specific procedures not ALTER DATABASE. Limits damage from compromised accounts or SQL injection. Review permissions regularly revoke unnecessary access and use roles for management. Critical security principle.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.47539-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All users should have full database access","OptionFeedback":""},{"Weight":0,"Text":"Only administrators should access the database","OptionFeedback":""},{"Weight":100,"Text":"Users and applications should have only the minimum permissions necessary to perform their functions","OptionFeedback":""},{"Weight":0,"Text":"Privileges should be granted randomly","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What are the main types of SQL Server database encryption?","Hint":null,"Feedback":"Encryption types: TDE encrypts entire database at rest transparently Always Encrypted protects sensitive columns with client-side encryption Column-level encryption for specific data and SSL/TLS encrypts network traffic. TDE protects against media theft Always Encrypted protects against DBAs SSL protects network sniffing. Choose based on threat model and compliance requirements.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753902-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Only password encryption is available","OptionFeedback":""},{"Weight":100,"Text":"Transparent Data Encryption TDE for data at rest Always Encrypted for data in use and SSL/TLS for data in transit","OptionFeedback":""},{"Weight":0,"Text":"SQL Server does not support encryption","OptionFeedback":""},{"Weight":0,"Text":"Only backup encryption is supported","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What are the two primary authentication modes in SQL Server?","Hint":null,"Feedback":"Windows Authentication uses domain credentials providing centralized management SSO password policies and Kerberos encryption. SQL Server Authentication uses database-managed credentials useful for non-domain applications. Mixed Mode supports both. Windows Authentication preferred for security: no password storage in connection strings integrated domain policies. Use SQL Auth only when necessary secure passwords required.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753905-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Only Windows Authentication is available","OptionFeedback":""},{"Weight":0,"Text":"Biometric and password authentication","OptionFeedback":""},{"Weight":100,"Text":"Windows Authentication and SQL Server Authentication Mixed Mode","OptionFeedback":""},{"Weight":0,"Text":"Anonymous and authenticated modes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"What is row-level security RLS in SQL Server?","Hint":null,"Feedback":"Row-Level Security uses security predicates to filter rows automatically based on execution context. Example: salespeople see only their region\u0027s data. Implemented with security policy and predicate function: CREATE SECURITY POLICY ... ADD FILTER PREDICATE. Transparent to applications centrally managed and enforced at database level. Useful for multi-tenant applications data segregation compliance requirements.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753913-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A feature that restricts data access at the row level based on user identity or role","OptionFeedback":""},{"Weight":0,"Text":"A method for encrypting individual rows","OptionFeedback":""},{"Weight":0,"Text":"A backup strategy for important rows","OptionFeedback":""},{"Weight":0,"Text":"A performance optimization technique","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is dynamic data masking DDM?","Hint":null,"Feedback":"Dynamic Data Masking obfuscates sensitive data in query results: credit cards show XXXX-XXXX-XXXX-1234 emails show aXXX@XXXX.com. Data stored normally masked in results for users without UNMASK permission. Simple to implement: ALTER TABLE ADD CreditCard varchar(16) MASKED WITH (FUNCTION = \u0027partial(0,\\XXXX-XXXX-XXXX-\\,4)\u0027). Protects against casual exposure not determined attackers. Use with other controls.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753915-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Permanently encrypting sensitive data","OptionFeedback":""},{"Weight":0,"Text":"Deleting sensitive data automatically","OptionFeedback":""},{"Weight":100,"Text":"Obfuscating sensitive data in query results for non-privileged users without changing stored data","OptionFeedback":""},{"Weight":0,"Text":"Compressing data to save space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is the purpose of SQL Server Audit?","Hint":null,"Feedback":"SQL Server Audit tracks: login attempts data access schema changes permission changes and administrative actions. Write to file security log or application log. Example: audit all access to sensitive tables failed logins privilege escalations. Essential for: compliance (HIPAA PCI SOX) forensic investigation detecting breaches and accountability. Create server audit and database audit specifications. Monitor audit logs regularly.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753919-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To improve database performance","OptionFeedback":""},{"Weight":100,"Text":"To track and log database events for security monitoring compliance and forensics","OptionFeedback":""},{"Weight":0,"Text":"To automatically fix security vulnerabilities","OptionFeedback":""},{"Weight":0,"Text":"To backup the database","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What makes a strong database password policy?","Hint":null,"Feedback":"Strong password policy: minimum 12-15 characters complexity (upper lower numbers symbols) regular expiration (30-90 days) history preventing reuse and account lockout after failed attempts. SQL Server can enforce Windows password policies: CHECK_POLICY=ON. Also: no default/blank passwords unique per user never in code/scripts and consider multi-factor authentication for privileged accounts.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753921-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Minimum length complexity requirements expiration regular changes and no password reuse","OptionFeedback":""},{"Weight":0,"Text":"Short simple passwords that are easy to remember","OptionFeedback":""},{"Weight":0,"Text":"Using the same password for all accounts","OptionFeedback":""},{"Weight":0,"Text":"Never changing passwords","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What does Transparent Data Encryption TDE protect against?","Hint":null,"Feedback":"TDE encrypts database files preventing unauthorized access if physical media stolen or improperly disposed. Encrypts: data files log files backups and tempdb. Transparent to applications - no code changes. Setup: create master key certificate database encryption key enable encryption. Performance impact minimal (5-10%). Does NOT protect against: authorized database users SQL injection or memory dumps. Protects storage not access.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753925-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SQL injection attacks","OptionFeedback":""},{"Weight":100,"Text":"Unauthorized access to data files backups and database snapshots at rest","OptionFeedback":""},{"Weight":0,"Text":"Network packet sniffing","OptionFeedback":""},{"Weight":0,"Text":"Application-level attacks","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"Why should database servers be behind firewalls?","Hint":null,"Feedback":"Firewall protection: restrict access to database port (1433 for SQL Server) allow only specific IPs/networks block internet-facing access and use DMZ architecture. Defense in depth: network firewall Windows Firewall SQL Server connection restrictions. Database servers should never be directly internet-accessible. Additional: VPN for remote access network segmentation and connection encryption. Network security is first defense layer.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753927-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Firewalls improve query performance","OptionFeedback":""},{"Weight":0,"Text":"Firewalls are unnecessary for databases","OptionFeedback":""},{"Weight":100,"Text":"Firewalls restrict network access allowing only authorized sources to connect to database ports","OptionFeedback":""},{"Weight":0,"Text":"Firewalls automatically encrypt data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What is the benefit of using database roles for security management?","Hint":null,"Feedback":"Database roles group permissions: create role (e.g., SalesRole) grant permissions to role assign users to role. Benefits: consistent permissions easier management less error-prone and simplified auditing. Built-in roles: db_datareader db_datawriter db_owner. Custom roles for specific needs. Use roles not individual permissions. Example: all sales users in SalesRole with SELECT on sales tables. Modify role permissions once affects all members.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.475393-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Roles simplify permission management by grouping users with similar access needs","OptionFeedback":""},{"Weight":0,"Text":"Roles reduce database size","OptionFeedback":""},{"Weight":0,"Text":"Roles improve query performance","OptionFeedback":""},{"Weight":0,"Text":"Roles automatically backup data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is the recommended practice for the sa account?","Hint":null,"Feedback":"sa account best practices: disable if possible (DISABLE LOGIN) rename to non-obvious name strong complex password never use in applications or connection strings and monitor sa usage in audit logs. sa has unlimited privileges making it high-value target. Use Windows Authentication and named accounts for accountability. sa should only be emergency account with password in sealed envelope. Many attacks specifically target sa.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753932-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use sa for all database operations","OptionFeedback":""},{"Weight":0,"Text":"Share the sa password with all developers","OptionFeedback":""},{"Weight":100,"Text":"Disable sa or rename it use strong password and never use it for applications","OptionFeedback":""},{"Weight":0,"Text":"Delete the sa account completely","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"How does encrypting database connections improve security?","Hint":null,"Feedback":"Connection encryption using SSL/TLS protects: authentication credentials query text and result sets from network interception. Configure: enable Force Encryption in SQL Server install valid certificate use Encrypt=true in connection strings. Particularly critical: public networks cloud environments sensitive data. Performance impact minimal. Combined with certificate validation prevents man-in-the-middle attacks. Essential security control.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753934-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Encryption protects credentials and data from network sniffing and man-in-the-middle attacks","OptionFeedback":""},{"Weight":0,"Text":"Encryption makes queries run faster","OptionFeedback":""},{"Weight":0,"Text":"Encryption reduces storage requirements","OptionFeedback":""},{"Weight":0,"Text":"Encryption is not possible for connections","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"Why should database backups be secured?","Hint":null,"Feedback":"Backup security critical because: backups contain complete data copies often stored offsite/cloud less monitored than production and access control may be weaker. Protection measures: encrypt backups (WITH ENCRYPTION) secure storage locations access controls physical security and secure transmission. Backup theft common breach vector. Apply same security rigor to backups as production databases. Test restore procedures include security validation.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753936-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Backups do not contain sensitive data","OptionFeedback":""},{"Weight":100,"Text":"Backups contain complete copies of data and are often less protected than live databases","OptionFeedback":""},{"Weight":0,"Text":"Backup security is impossible","OptionFeedback":""},{"Weight":0,"Text":"Only live databases need security","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"Which code example is vulnerable to SQL injection?","Hint":null,"Feedback":"Vulnerable code concatenates user input into SQL: query = \\SELECT * FROM Users WHERE Username = \u0027\\ \u002B username \u002B \\\u0027\\. Attacker enters: \u0027 OR \u00271\u0027=\u00271 creating: SELECT * FROM Users WHERE Username = \u0027\u0027 OR \u00271\u0027=\u00271\u0027 returning all users. Safe code uses parameters: cmd.Parameters.Add(\\@Username\\ username). Parameters prevent injection by treating input as data not code. Always parameterize never concatenate.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753937-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SqlCommand cmd = new SqlCommand(\\SELECT * FROM Users WHERE ID = @UserID\\); cmd.Parameters.Add(\\@UserID\\, userId);","OptionFeedback":""},{"Weight":100,"Text":"string query = \\SELECT * FROM Users WHERE Username = \u0027\\ \u002B username \u002B \\\u0027\\; SqlCommand cmd = new SqlCommand(query);","OptionFeedback":""},{"Weight":0,"Text":"Using stored procedures with parameters","OptionFeedback":""},{"Weight":0,"Text":"All code is equally vulnerable","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What advantage does certificate-based authentication provide?","Hint":null,"Feedback":"Certificate authentication uses public/private key pairs: stronger than passwords no password transmission immune to dictionary attacks and supports mutual authentication. Use cases: service accounts application-to-database server-to-server. Configure: CREATE LOGIN FROM CERTIFICATE or Windows certificate mapping. Combines with connection encryption. Requires certificate management infrastructure. Recommended for high-security environments.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753939-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Stronger authentication using cryptographic keys instead of passwords eliminating password-based attacks","OptionFeedback":""},{"Weight":0,"Text":"Certificates reduce database size","OptionFeedback":""},{"Weight":0,"Text":"Certificates improve query performance","OptionFeedback":""},{"Weight":0,"Text":"Certificates automatically encrypt data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"Why should database security assessments be performed regularly?","Hint":null,"Feedback":"Regular security assessments find: weak passwords excessive permissions SQL injection vulnerabilities missing patches misconfigurations and compliance violations. Methods: SQL Server security assessment built-in tools third-party scanners penetration testing and configuration reviews. Schedule quarterly minimum after changes or continuously. Address findings promptly. Security is ongoing process not one-time event. Threats evolve configurations drift.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753981-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Security assessments are only needed once","OptionFeedback":""},{"Weight":100,"Text":"Regular assessments identify new vulnerabilities misconfigurations and ensure compliance with security policies","OptionFeedback":""},{"Weight":0,"Text":"Assessments slow down the database","OptionFeedback":""},{"Weight":0,"Text":"Databases have no security vulnerabilities","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Why should default permissions be reviewed and minimized?","Hint":null,"Feedback":"Default permission risks: guest account may be enabled public role has permissions default schemas accessible and built-in accounts over-privileged. Hardening steps: disable guest REVOKE unnecessary public permissions review built-in role memberships and remove default/sample databases. Apply least privilege from installation. Example: public shouldn\u0027t have VIEW ANY DATABASE. Review with: database security baseline tools. Secure defaults prevent privilege creep.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753984-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Default permissions often grant excessive access increasing risk of unauthorized data access","OptionFeedback":""},{"Weight":0,"Text":"Default permissions are always secure","OptionFeedback":""},{"Weight":0,"Text":"Permissions cannot be changed","OptionFeedback":""},{"Weight":0,"Text":"Default permissions improve performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"How does multi-factor authentication MFA improve database security?","Hint":null,"Feedback":"Multi-factor authentication requires: something you know (password) something you have (token device) something you are (biometric). Implementation: Azure AD with MFA for Azure SQL smart cards for Windows Auth or third-party solutions. Protects against: password theft phishing credential stuffing. Critical for: privileged accounts remote access administrative access. MFA dramatically reduces account compromise risk. Industry best practice for sensitive access.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753986-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"MFA is only for web applications","OptionFeedback":""},{"Weight":0,"Text":"MFA slows down database access","OptionFeedback":""},{"Weight":100,"Text":"MFA requires multiple authentication factors reducing risk from stolen passwords","OptionFeedback":""},{"Weight":0,"Text":"MFA eliminates all security risks","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is the difference between server-level and database-level permissions?","Hint":null,"Feedback":"Server-level: control SQL Server instance logins server roles backup/restore create databases. Database-level: control specific database access users database roles object permissions. Example: server login with db_datareader role in SalesDB but no access to HrDB. Hierarchy: server login \u2192 database user \u2192 permissions. Use server roles sparingly grant database permissions specifically. Separation limits scope of compromise.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753989-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Server-level permissions control instance-wide operations while database-level permissions control access within specific databases","OptionFeedback":""},{"Weight":0,"Text":"They are identical and interchangeable","OptionFeedback":""},{"Weight":0,"Text":"Only server-level permissions matter","OptionFeedback":""},{"Weight":0,"Text":"Database-level permissions override all server permissions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"What is data classification and why is it important for security?","Hint":null,"Feedback":"Data classification categories: public internal confidential restricted/sensitive. Identify PII PHI financial data intellectual property. Benefits: focused security controls compliance (GDPR HIPAA) encryption prioritization and access restrictions. SQL Server supports: sensitivity labels data discovery tools classification metadata. Process: discover classify protect monitor. Apply stronger controls to more sensitive classifications. Foundation of risk-based security approach.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753992-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Identifying and labeling sensitive data to apply appropriate protection controls","OptionFeedback":""},{"Weight":0,"Text":"Organizing data alphabetically","OptionFeedback":""},{"Weight":0,"Text":"Backing up important tables","OptionFeedback":""},{"Weight":0,"Text":"Indexing data for performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"How do stored procedures enhance database security?","Hint":null,"Feedback":"Stored procedure security benefits: prevent SQL injection via parameterization ownership chaining (users don\u0027t need table permissions) controlled data access hide schema details and audit trail of what procedures executed. Grant EXECUTE on procedures not direct table access. Still must: parameterize dynamic SQL within procedures validate inputs and follow least privilege. Procedures are security control not complete solution but important layer.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753994-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Stored procedures have no security benefits","OptionFeedback":""},{"Weight":100,"Text":"Stored procedures prevent SQL injection enable permission encapsulation and hide implementation details","OptionFeedback":""},{"Weight":0,"Text":"Stored procedures automatically encrypt data","OptionFeedback":""},{"Weight":0,"Text":"Stored procedures eliminate all vulnerabilities","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What should be audited regarding database logins?","Hint":null,"Feedback":"Login auditing tracks: failed login attempts (brute force detection) successful logins unusual access times source IP addresses and account lockouts. Configure: SQL Server Audit login trigger or Extended Events. Alert on: multiple failures from same IP multiple failures for same account or successful login after many failures. Essential for: detecting attacks accountability forensics and compliance. Review logs regularly automate alerts. Failed logins often precede breach.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753997-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Nothing needs to be audited","OptionFeedback":""},{"Weight":0,"Text":"Only successful logins","OptionFeedback":""},{"Weight":100,"Text":"Both successful and failed login attempts with timestamps source IP and username","OptionFeedback":""},{"Weight":0,"Text":"Only administrator logins","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"How does schema separation improve security?","Hint":null,"Feedback":"Schema-based security: organize by function (Sales HR Finance) grant permissions at schema level users get access to entire schema. Example: CREATE SCHEMA Sales; GRANT SELECT ON SCHEMA::Sales TO SalesRole. Benefits: cleaner permissions fewer grants easier management and logical organization. Separate sensitive data to restricted schemas. Avoid putting everything in dbo. Schema ownership affects permissions. Well-designed schema structure simplifies security administration.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4753999-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Schemas provide namespace separation enabling granular permissions and access control","OptionFeedback":""},{"Weight":0,"Text":"Schemas only affect performance","OptionFeedback":""},{"Weight":0,"Text":"Schemas are cosmetic with no security value","OptionFeedback":""},{"Weight":0,"Text":"All objects should be in dbo schema","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What does SQL Server Vulnerability Assessment tool detect?","Hint":null,"Feedback":"Vulnerability Assessment scans for: weak passwords excessive permissions exposed sensitive data missing encryption disabled auditing and misconfigurations against best practices. Available in SSMS for Azure SQL and SQL Server. Generates reports with remediation steps. Schedule regular scans track findings over time. Complements: penetration testing code reviews security audits. Proactive security tool helps maintain secure baseline.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754001-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Only performance issues","OptionFeedback":""},{"Weight":100,"Text":"Security vulnerabilities misconfigurations weak passwords and deviations from best practices","OptionFeedback":""},{"Weight":0,"Text":"Hardware problems","OptionFeedback":""},{"Weight":0,"Text":"Network speed issues","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What are best practices for SQL Server service accounts?","Hint":null,"Feedback":"Service account best practices: dedicated account per service managed service accounts (gMSA/MSA) minimum OS privileges not in local administrators and strong unique passwords. Avoid: Local System domain admin shared accounts. Grant only: specific file/folder access network permissions required privileges. If compromised attacker gets service privileges. SQL Server services don\u0027t need admin rights. Use SQL Server Configuration Manager to set accounts correctly.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754004-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use Local System account for all services","OptionFeedback":""},{"Weight":100,"Text":"Use domain managed service accounts with minimum privileges not in administrators group","OptionFeedback":""},{"Weight":0,"Text":"Use the same account for all services","OptionFeedback":""},{"Weight":0,"Text":"Service account security doesn\u0027t matter","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"What is unique about Always Encrypted compared to other encryption methods?","Hint":null,"Feedback":"Always Encrypted: client-side encryption data encrypted in database memory and during processing only client app has keys. Protects against: privileged database users (DBAs) cloud provider access breach. Limitations: limited query capabilities (no range queries on encrypted data) application changes required. Use cases: highly sensitive data multi-party scenarios compliance. Different from TDE: TDE protects storage Always Encrypted protects usage.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754006-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Data remains encrypted in memory and during query processing protecting against privileged user access","OptionFeedback":""},{"Weight":0,"Text":"Always Encrypted is slower than other methods","OptionFeedback":""},{"Weight":0,"Text":"Always Encrypted only works with backups","OptionFeedback":""},{"Weight":0,"Text":"Always Encrypted is the same as TDE","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"Why is timely application of security patches critical?","Hint":null,"Feedback":"Patch management importance: fix known security vulnerabilities prevent exploitation maintain compliance reduce attack surface. Process: monitor security bulletins test patches schedule maintenance windows deploy promptly and verify application. Attackers exploit known vulnerabilities rapidly - WannaCry exploited unpatched SQL Server. Balance: security urgency vs testing thoroughness. Critical patches deploy within days. Have patching schedule and emergency process.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754008-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Patches fix known vulnerabilities that attackers actively exploit leaving unpatched systems vulnerable","OptionFeedback":""},{"Weight":0,"Text":"Patches only improve performance","OptionFeedback":""},{"Weight":0,"Text":"Patches are optional","OptionFeedback":""},{"Weight":0,"Text":"Patches always break functionality","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"What is a Privileged Access Workstation PAW and why is it important?","Hint":null,"Feedback":"Privileged Access Workstation: dedicated locked-down machine for admin tasks no email/web/office limited software only admin tools and multi-factor authentication. Prevents: admin credential theft on compromised workstations malware infections phishing attacks. Best practice: separate admin tasks from daily work use PAW for database administration jump boxes for server access. Critical for: production access privileged accounts high-security environments. Reduces risk of admin account compromise.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.475401-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"PAW is another name for database server","OptionFeedback":""},{"Weight":100,"Text":"A secured hardened workstation used exclusively for administrative tasks reducing attack surface","OptionFeedback":""},{"Weight":0,"Text":"PAW refers to database backup systems","OptionFeedback":""},{"Weight":0,"Text":"PAW is a type of firewall","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What security risk does cross-database ownership chaining present?","Hint":null,"Feedback":"Cross-database ownership chaining: when objects span databases ownership chain can bypass permissions. Risk: user with access to view in DB1 might access table in DB2 without direct permission. Disabled by default (TRUSTWORTHY OFF). Enable only when necessary understand implications review object ownership. Example: stored procedure in DB1 accessing DB2 table - permissions not checked if same owner. Use explicit grants instead. Keep TRUSTWORTHY OFF unless required.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754012-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"No security risk exists","OptionFeedback":""},{"Weight":100,"Text":"Can allow unintended access to objects in other databases bypassing normal security checks","OptionFeedback":""},{"Weight":0,"Text":"Improves security by sharing permissions","OptionFeedback":""},{"Weight":0,"Text":"Only affects performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"Why should detailed database error messages not be exposed to users?","Hint":null,"Feedback":"Detailed errors expose: table/column names database structure SQL code security mechanisms and system information. Example: \u0027Invalid column ProductPrice in table Products\u0027 reveals schema. Best practice: log detailed errors server-side show generic messages to users (\u0027An error occurred\u0027) validate inputs before database and use custom error pages. Balance: help legitimate users debug vs information disclosure to attackers. Don\u0027t help attackers map your database.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754014-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Error messages can reveal database structure table names column names and security vulnerabilities","OptionFeedback":""},{"Weight":0,"Text":"Error messages improve security","OptionFeedback":""},{"Weight":0,"Text":"Users need detailed error information","OptionFeedback":""},{"Weight":0,"Text":"Error messages have no security impact","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"What is Database Activity Monitoring DAM?","Hint":null,"Feedback":"Database Activity Monitoring: real-time traffic analysis detect anomalies alert on policy violations and audit database access. Detects: unusual access patterns privilege escalation data exfiltration SQL injection attempts. Solutions: built-in Extended Events third-party DAM tools SIEM integration. Provides: real-time alerts behavioral analysis compliance reporting. Complements auditing with active detection. Essential for high-security environments.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754016-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A backup scheduling tool","OptionFeedback":""},{"Weight":100,"Text":"Real-time monitoring and alerting on database access patterns to detect suspicious activity and policy violations","OptionFeedback":""},{"Weight":0,"Text":"A performance tuning tool","OptionFeedback":""},{"Weight":0,"Text":"A data replication method","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"What should database secure coding standards include?","Hint":null,"Feedback":"Secure coding standards: always use parameterized queries validate all inputs use least privilege accounts implement proper error handling avoid dynamic SQL when possible and code review process. Additional: no hardcoded credentials secure connection strings proper exception handling and security testing. Document standards train developers enforce in code review. Consistent application prevents SQL injection and other vulnerabilities. Development security critical.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754018-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Parameterized queries input validation least privilege error handling and code review requirements","OptionFeedback":""},{"Weight":0,"Text":"No standards are needed for database code","OptionFeedback":""},{"Weight":0,"Text":"Only performance optimization guidelines","OptionFeedback":""},{"Weight":0,"Text":"Coding standards don\u0027t affect security","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"Why are secure data retention and disposal policies important?","Hint":null,"Feedback":"Data lifecycle security: retain only as long as needed comply with regulations securely delete when no longer required and prevent recovery of deleted data. Risks of over-retention: larger breach surface compliance violations and storage costs. Secure disposal: overwrite don\u0027t just DELETE encrypt before disposal or use secure file deletion for backups. Document retention schedules automate purging. GDPR right to deletion requires secure disposal processes.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754021-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Old data should never be deleted","OptionFeedback":""},{"Weight":100,"Text":"Retaining data longer than needed increases risk exposure and disposal prevents unauthorized recovery","OptionFeedback":""},{"Weight":0,"Text":"Data disposal is not a security concern","OptionFeedback":""},{"Weight":0,"Text":"Deletion automatically secures data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"What is separation of duties in database security?","Hint":null,"Feedback":"Separation of duties: different people for development production administration backup/restore and security management. Prevents: single point of compromise fraud insider threats unauthorized changes. Example: developers can\u0027t access production DBAs can\u0027t modify code. Use separate accounts for different roles require multiple approvals for sensitive changes and audit cross-role activities. Critical control especially for financial and healthcare data.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754023-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"One person should have all database access","OptionFeedback":""},{"Weight":100,"Text":"Different individuals perform different security functions preventing any single person from compromising security","OptionFeedback":""},{"Weight":0,"Text":"Duties should be combined for efficiency","OptionFeedback":""},{"Weight":0,"Text":"Only applies to development not production","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"What is the purpose of honeypot or canary tables in database security?","Hint":null,"Feedback":"Honeypot tables contain: fake but realistic data clear naming (Customers_Backup SSN_Archive) auditing on all access. Benefits: breach detection early warning indicate compromise extent. Example: table named CreditCards with fake data any access triggers alert. Complement other controls provide trip wire indicate attacker presence. Low-cost detection mechanism. Place strategically audit actively respond to alerts quickly.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754025-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To improve query performance","OptionFeedback":""},{"Weight":100,"Text":"Decoy tables with fake sensitive data that trigger alerts when accessed to detect breaches","OptionFeedback":""},{"Weight":0,"Text":"To store backup data","OptionFeedback":""},{"Weight":0,"Text":"Honeypots have no security purpose","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"Why should applications use application-specific database accounts?","Hint":null,"Feedback":"Application-specific accounts: separate account per application or application tier specific permissions per account audit by application and independent security boundaries. Benefits: track which app accessed what limit breach scope disable one app without affecting others. Avoid: shared accounts user impersonation generic accounts. Use connection pooling with application accounts. Set context with application name property. Accountability requires identifiable accounts.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754027-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Enables tracking of application actions provides granular permissions and improves accountability","OptionFeedback":""},{"Weight":0,"Text":"All applications should share one account","OptionFeedback":""},{"Weight":0,"Text":"Applications don\u0027t need database accounts","OptionFeedback":""},{"Weight":0,"Text":"Application accounts reduce security","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"What are common compliance standards affecting database security?","Hint":null,"Feedback":"Compliance standards: HIPAA (healthcare PHI) PCI DSS (payment card data) GDPR (EU personal data) SOX (financial reporting) FISMA (federal systems). Requirements vary but include: encryption access controls audit logging data retention breach notification. Non-compliance: fines legal liability reputation damage. Understand applicable standards implement required controls document compliance and audit regularly. Compliance frameworks guide security implementation.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.475403-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"No compliance standards exist for databases","OptionFeedback":""},{"Weight":100,"Text":"HIPAA for healthcare PCI DSS for payment cards GDPR for personal data and SOX for financial data","OptionFeedback":""},{"Weight":0,"Text":"Only government databases need compliance","OptionFeedback":""},{"Weight":0,"Text":"Compliance standards are optional","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"How does integrating security into the development lifecycle improve database security?","Hint":null,"Feedback":"Secure SDLC phases: requirements (security requirements) design (threat modeling) development (secure coding) testing (security testing) deployment (secure configuration) maintenance (patching monitoring). Benefits: prevent vulnerabilities early cheaper to fix in design security by design and cultural shift. Activities: code review static analysis penetration testing security training. Finding SQL injection in design costs less than in production. Security integral not afterthought.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754032-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Security should only be considered in production","OptionFeedback":""},{"Weight":100,"Text":"Early security integration prevents vulnerabilities reduces costs and ensures security by design","OptionFeedback":""},{"Weight":0,"Text":"Development and security are unrelated","OptionFeedback":""},{"Weight":0,"Text":"Security slows down development","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q041","Type":"MC","Title":"Question 41","QuestionText":"Why should third-party access to databases be carefully controlled?","Hint":null,"Feedback":"Third-party risks: weaker security controls supply chain attacks credential sharing data exfiltration. Controls needed: separate accounts time-limited access audit all activity minimum necessary data and contractual security requirements. Examples: vendors consultants managed service providers. Require: background checks security training compliance with your policies. Major breaches often involve third-party compromise. Treat external access as high risk.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754034-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Third parties extend your attack surface and may have weaker security practices","OptionFeedback":""},{"Weight":0,"Text":"Third parties should have unlimited access","OptionFeedback":""},{"Weight":0,"Text":"Third-party access has no security implications","OptionFeedback":""},{"Weight":0,"Text":"Third parties are always more secure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q042","Type":"MC","Title":"Question 42","QuestionText":"Why is security awareness training important for database security?","Hint":null,"Feedback":"Training topics: phishing awareness password security social engineering recognizing attacks incident reporting and secure development practices. Target audiences: all employees developers database administrators. Benefits: reduced incidents improved security culture quicker threat detection. Human factors cause most breaches: credentials compromised via phishing configuration errors sharing passwords. Technical controls \u002B trained users = defense in depth. Regular training required security awareness ongoing process.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754036-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Training is unnecessary technical controls are sufficient","OptionFeedback":""},{"Weight":100,"Text":"Users are often the weakest link training reduces human error and security incidents","OptionFeedback":""},{"Weight":0,"Text":"Only security staff need training","OptionFeedback":""},{"Weight":0,"Text":"Training has no impact on security","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q043","Type":"MC","Title":"Question 43","QuestionText":"What is the purpose of database penetration testing?","Hint":null,"Feedback":"Penetration testing: authorized simulated attacks identify exploitable vulnerabilities test detection capabilities and validate security controls. Scope: SQL injection authentication bypass privilege escalation data access. Benefits: find vulnerabilities before attackers validate security investments and compliance requirements. Frequency: annually after major changes or continuous. Use qualified ethical hackers follow rules of engagement remediate findings. Don\u0027t rely solely on automated scans manual testing critical.","TopicTitle":"Quiz 10 - Security","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4754038-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To damage the database","OptionFeedback":""},{"Weight":100,"Text":"To simulate real attacks identifying vulnerabilities before attackers exploit them","OptionFeedback":""},{"Weight":0,"Text":"To improve database performance","OptionFeedback":""},{"Weight":0,"Text":"Penetration testing is only for networks","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q044","Type":"MC","Title":"Question 44","QuestionText":"Why is a database security incident response plan necessary?","Hint":null,"Feedback":"Incident response plan includes: detection procedures escalation paths containment steps investigation process recovery procedures and notification requirements (legal compliance). Practice with tabletop exercises document procedures define roles test backups. Incidents will occur: preparation reduces impact response time and damage. Include: who to contact what to preserve how to investigate communication plans. Review and update regularly. Fast effective response limits breach impact.","TopicT
