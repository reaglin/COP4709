  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_9_(Week_9)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.3484133-05:00","NextQuestionNumber":41,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What does the COUNT aggregate function return?","Hint":null,"Feedback":"COUNT returns the number of rows. COUNT(*) counts all rows including those with NULL values. COUNT(ColumnName) counts only rows where ColumnName is NOT NULL. COUNT(DISTINCT ColumnName) counts unique non-NULL values. Example: SELECT COUNT(*) FROM Orders returns total orders; SELECT COUNT(ShippedDate) returns only shipped orders.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483811-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The sum of all values in a column","OptionFeedback":""},{"Weight":100,"Text":"The number of rows that match the query criteria or have non-NULL values in a specified column","OptionFeedback":""},{"Weight":0,"Text":"The average of numeric values","OptionFeedback":""},{"Weight":0,"Text":"The first value in a result set","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What does the SUM aggregate function do?","Hint":null,"Feedback":"SUM adds all numeric values in a column. NULL values are ignored. Example: SELECT SUM(OrderTotal) FROM Orders returns the total of all order amounts. SUM only works with numeric data types. Returns NULL if no rows match or all values are NULL. Use with GROUP BY to sum by categories.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483838-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Calculates the total of all numeric values in a column ignoring NULL values","OptionFeedback":""},{"Weight":0,"Text":"Counts the number of rows in a table","OptionFeedback":""},{"Weight":0,"Text":"Finds the maximum value in a column","OptionFeedback":""},{"Weight":0,"Text":"Concatenates string values together","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"How does the AVG function calculate the average?","Hint":null,"Feedback":"AVG calculates the mean by summing non-NULL values and dividing by the count of non-NULL values. NULL values are excluded from both calculations. Example: SELECT AVG(Salary) FROM Employees. If you have values 100, 200, NULL, the average is (100\u002B200)/2 = 150, not (100\u002B200)/3. To include NULLs as zero use AVG(ISNULL(Salary,0)).","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483848-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Divides the sum by the total number of rows in the table","OptionFeedback":""},{"Weight":100,"Text":"Divides the sum of non-NULL values by the count of non-NULL values","OptionFeedback":""},{"Weight":0,"Text":"Always includes NULL values as zero in the calculation","OptionFeedback":""},{"Weight":0,"Text":"Returns the median value of the dataset","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What do the MIN and MAX aggregate functions return?","Hint":null,"Feedback":"MIN returns the smallest value and MAX returns the largest value. Work with numeric, date, and string data. NULL values ignored. Examples: SELECT MIN(OrderDate) returns earliest order; SELECT MAX(Price) returns highest price; SELECT MIN(CustomerName) returns alphabetically first name. Useful for finding ranges and extremes.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483857-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"MIN returns the smallest value and MAX returns the largest value in a column","OptionFeedback":""},{"Weight":0,"Text":"MIN returns the first row and MAX returns the last row","OptionFeedback":""},{"Weight":0,"Text":"MIN and MAX only work with numeric data","OptionFeedback":""},{"Weight":0,"Text":"MIN and MAX count the number of values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What is the purpose of the GROUP BY clause?","Hint":null,"Feedback":"GROUP BY divides rows into groups based on column values then applies aggregate functions to each group. Example: SELECT CategoryID COUNT(*) FROM Products GROUP BY CategoryID returns product count per category. Each unique CategoryID value creates a group. All non-aggregated columns in SELECT must appear in GROUP BY.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483865-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To sort the result set in ascending order","OptionFeedback":""},{"Weight":0,"Text":"To filter rows based on conditions","OptionFeedback":""},{"Weight":100,"Text":"To divide rows into groups for applying aggregate functions to each group separately","OptionFeedback":""},{"Weight":0,"Text":"To join multiple tables together","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"How does the HAVING clause differ from the WHERE clause?","Hint":null,"Feedback":"WHERE filters rows before grouping and aggregation; HAVING filters groups after aggregation. Example: SELECT CategoryID COUNT(*) FROM Products WHERE Price \u003E 10 GROUP BY CategoryID HAVING COUNT(*) \u003E 5. WHERE eliminates cheap products first; HAVING then filters categories with few products. Use WHERE for row-level conditions HAVING for aggregate conditions.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483895-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"HAVING filters groups after aggregation while WHERE filters individual rows before aggregation","OptionFeedback":""},{"Weight":0,"Text":"HAVING and WHERE are identical and interchangeable","OptionFeedback":""},{"Weight":0,"Text":"HAVING is faster than WHERE","OptionFeedback":""},{"Weight":0,"Text":"WHERE can use aggregate functions but HAVING cannot","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is the difference between COUNT(*) and COUNT(ColumnName)?","Hint":null,"Feedback":"COUNT(*) counts all rows regardless of NULL values. COUNT(ColumnName) counts only rows where ColumnName is NOT NULL. Example: table with 100 rows where ShippedDate is NULL in 20 rows: COUNT(*) returns 100; COUNT(ShippedDate) returns 80. Use COUNT(*) for total rows COUNT(column) to exclude NULLs.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483905-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are identical and return the same result","OptionFeedback":""},{"Weight":100,"Text":"COUNT(*) counts all rows while COUNT(ColumnName) counts only non-NULL values in that column","OptionFeedback":""},{"Weight":0,"Text":"COUNT(*) is slower than COUNT(ColumnName)","OptionFeedback":""},{"Weight":0,"Text":"COUNT(ColumnName) counts unique values only","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"Can you use multiple aggregate functions in a single SELECT statement?","Hint":null,"Feedback":"Multiple aggregates work together in one query. Example: SELECT COUNT(*) AS TotalOrders SUM(OrderTotal) AS Revenue AVG(OrderTotal) AS AvgOrder MIN(OrderDate) AS FirstOrder MAX(OrderDate) AS LastOrder FROM Orders. Each aggregate operates independently on the result set. With GROUP BY each group gets all aggregates calculated.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483912-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Yes multiple aggregates can be used together in the same query","OptionFeedback":""},{"Weight":0,"Text":"No only one aggregate function is allowed per query","OptionFeedback":""},{"Weight":0,"Text":"Yes but only if they are the same function","OptionFeedback":""},{"Weight":0,"Text":"Multiple aggregates require UNION","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What does COUNT(DISTINCT ColumnName) do?","Hint":null,"Feedback":"COUNT(DISTINCT column) counts unique values. Example: if CustomerID appears 100 times but only 25 unique customers COUNT(DISTINCT CustomerID) returns 25. Works with other aggregates: SUM(DISTINCT Amount) adds each unique amount once. Useful for counting unique entities. Performance note: DISTINCT operations can be expensive on large datasets.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483914-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Counts the number of unique non-NULL values in the column","OptionFeedback":""},{"Weight":0,"Text":"Counts all values including duplicates","OptionFeedback":""},{"Weight":0,"Text":"Returns only distinct values without counting","OptionFeedback":""},{"Weight":0,"Text":"DISTINCT cannot be used with COUNT","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"How do aggregate functions handle NULL values?","Hint":null,"Feedback":"Aggregates ignore NULL: SUM AVG MIN MAX COUNT(column) skip NULL values. COUNT(*) includes rows with NULL. Example: SUM(Price) where values are 10 20 NULL returns 30 not NULL. If all values are NULL aggregates return NULL except COUNT which returns 0. To include NULL as zero: SUM(ISNULL(Price,0)) or SUM(COALESCE(Price,0)).","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483918-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Aggregate functions treat NULL as zero","OptionFeedback":""},{"Weight":100,"Text":"Most aggregate functions ignore NULL values except COUNT(*)","OptionFeedback":""},{"Weight":0,"Text":"Aggregate functions convert NULL to empty string","OptionFeedback":""},{"Weight":0,"Text":"NULL values cause aggregate functions to return errors","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What happens when you GROUP BY multiple columns?","Hint":null,"Feedback":"GROUP BY multiple columns creates groups for each unique combination. Example: SELECT CustomerID ProductID COUNT(*) FROM Orders GROUP BY CustomerID ProductID groups by each customer-product pair. If Customer 1 bought Products A and B you get two groups: (1,A) and (1,B). Useful for multi-dimensional analysis.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.348392-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Creates groups based on unique combinations of all specified columns","OptionFeedback":""},{"Weight":0,"Text":"Only the first column is used for grouping","OptionFeedback":""},{"Weight":0,"Text":"Multiple columns cannot be used in GROUP BY","OptionFeedback":""},{"Weight":0,"Text":"Creates separate groups for each column independently","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What happens when you use aggregate functions without GROUP BY?","Hint":null,"Feedback":"Without GROUP BY all rows form one group and aggregates return single values. Example: SELECT COUNT(*) SUM(Total) AVG(Total) FROM Orders returns one row with three aggregate values. Cannot mix aggregate functions with non-aggregated columns without GROUP BY. SELECT CustomerID COUNT(*) FROM Orders without GROUP BY causes error.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483924-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The query returns an error","OptionFeedback":""},{"Weight":100,"Text":"The aggregate function operates on all rows returning a single result","OptionFeedback":""},{"Weight":0,"Text":"Each row is treated as a separate group","OptionFeedback":""},{"Weight":0,"Text":"GROUP BY is automatically added","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"Can you use ORDER BY with aggregate functions?","Hint":null,"Feedback":"ORDER BY works with aggregates. Example: SELECT CategoryID COUNT(*) AS ProductCount FROM Products GROUP BY CategoryID ORDER BY COUNT(*) DESC orders by count descending. Can also use alias: ORDER BY ProductCount DESC. Common pattern: find top N by ordering aggregates with TOP or LIMIT. Sorting happens after aggregation.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483926-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Yes you can order results by aggregated values or column aliases","OptionFeedback":""},{"Weight":0,"Text":"No ORDER BY cannot be used with aggregates","OptionFeedback":""},{"Weight":0,"Text":"ORDER BY only works with non-aggregated columns","OptionFeedback":""},{"Weight":0,"Text":"Aggregates automatically sort results","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"Can you nest aggregate functions like SUM(COUNT(*))?","Hint":null,"Feedback":"Cannot nest aggregates directly: SUM(COUNT(*)) causes error. Solution: use subquery or CTE. Example: SELECT SUM(ProductCount) FROM (SELECT CategoryID COUNT(*) AS ProductCount FROM Products GROUP BY CategoryID) AS Subquery. Inner query counts per category outer query sums those counts. Window functions can also solve some nested aggregate scenarios.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483929-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Yes nested aggregates work in all cases","OptionFeedback":""},{"Weight":100,"Text":"No you cannot nest aggregate functions directly but can use subqueries or CTEs","OptionFeedback":""},{"Weight":0,"Text":"Only two levels of nesting are allowed","OptionFeedback":""},{"Weight":0,"Text":"Nesting works only with COUNT","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What rule must be followed when using GROUP BY with SELECT?","Hint":null,"Feedback":"Every non-aggregated column in SELECT must be in GROUP BY. Example: SELECT CategoryID ProductName COUNT(*) FROM Products GROUP BY CategoryID causes error - ProductName not in GROUP BY. Correct: GROUP BY CategoryID ProductName. Aggregated columns (COUNT SUM etc.) don\u0027t need to be in GROUP BY. This ensures each group has single values for non-aggregated columns.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483964-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All columns must be aggregated","OptionFeedback":""},{"Weight":100,"Text":"Every non-aggregated column in SELECT must appear in GROUP BY","OptionFeedback":""},{"Weight":0,"Text":"GROUP BY must include all table columns","OptionFeedback":""},{"Weight":0,"Text":"No rules apply to GROUP BY and SELECT","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What does the ROLLUP operator do in GROUP BY?","Hint":null,"Feedback":"ROLLUP generates subtotals and grand totals. Example: SELECT Year Quarter SUM(Sales) FROM Orders GROUP BY ROLLUP(Year Quarter) produces: yearly totals per quarter yearly totals (Quarter=NULL) and grand total (Year=NULL Quarter=NULL). Creates hierarchy right-to-left. Useful for reports with subtotals. NULL indicates summary row.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483968-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Creates subtotal rows and a grand total row showing hierarchical aggregation levels","OptionFeedback":""},{"Weight":0,"Text":"Removes duplicate rows from the result set","OptionFeedback":""},{"Weight":0,"Text":"Sorts the results in ascending order","OptionFeedback":""},{"Weight":0,"Text":"Combines multiple queries with UNION","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"How does CUBE differ from ROLLUP in GROUP BY?","Hint":null,"Feedback":"CUBE creates all possible grouping combinations. Example: GROUP BY CUBE(Year Quarter) generates: (Year Quarter) (Year NULL) (NULL Quarter) and (NULL NULL). ROLLUP only creates (Year Quarter) (Year NULL) (NULL NULL) - hierarchical. CUBE useful for multidimensional analysis. More combinations than ROLLUP potentially many rows. SQL Server supports both.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483971-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"CUBE and ROLLUP are identical","OptionFeedback":""},{"Weight":100,"Text":"CUBE creates all possible combinations of subtotals while ROLLUP creates hierarchical subtotals","OptionFeedback":""},{"Weight":0,"Text":"CUBE is faster than ROLLUP","OptionFeedback":""},{"Weight":0,"Text":"CUBE only works with two columns","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is the purpose of GROUPING SETS?","Hint":null,"Feedback":"GROUPING SETS specifies exact grouping combinations without generating all possible combinations. Example: GROUP BY GROUPING SETS ((Year) (Quarter) ()) creates three groupings: by Year by Quarter and grand total. Equivalent to UNION of three queries but more efficient. Useful for custom subtotal requirements. More flexible than ROLLUP/CUBE.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483974-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To limit the number of groups returned","OptionFeedback":""},{"Weight":100,"Text":"To specify multiple grouping combinations in a single query replacing multiple UNION queries","OptionFeedback":""},{"Weight":0,"Text":"To sort groups in a specific order","OptionFeedback":""},{"Weight":0,"Text":"To filter groups based on conditions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Can HAVING clause use multiple conditions?","Hint":null,"Feedback":"HAVING supports multiple conditions with logical operators. Example: SELECT CategoryID COUNT(*) AS Cnt AVG(Price) AS AvgPrice FROM Products GROUP BY CategoryID HAVING COUNT(*) \u003E 5 AND AVG(Price) \u003C 100. Filters groups with more than 5 products AND average price under 100. Can use OR NOT and parentheses for complex logic.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483977-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Yes HAVING supports multiple conditions with AND OR and NOT operators","OptionFeedback":""},{"Weight":0,"Text":"No HAVING allows only one condition","OptionFeedback":""},{"Weight":0,"Text":"Multiple conditions require multiple HAVING clauses","OptionFeedback":""},{"Weight":0,"Text":"HAVING cannot use logical operators","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What impacts the performance of aggregate queries?","Hint":null,"Feedback":"Performance factors: table size (more rows = slower) indexes on GROUP BY/WHERE columns filtering before aggregation (WHERE reduces data) DISTINCT operations (expensive) and number of groups. Optimization: index GROUP BY columns use WHERE to filter early avoid unnecessary DISTINCT and consider materialized views or summary tables for frequently-used aggregations.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483979-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Aggregate queries always have the same performance","OptionFeedback":""},{"Weight":100,"Text":"Table size indexes on GROUP BY columns and WHERE clause filtering significantly affect performance","OptionFeedback":""},{"Weight":0,"Text":"Using more aggregate functions improves performance","OptionFeedback":""},{"Weight":0,"Text":"Performance is unaffected by query design","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"How can you concatenate strings from multiple rows into a single value?","Hint":null,"Feedback":"String aggregation methods: STRING_AGG(column separator) in SQL Server 2017\u002B: SELECT CustomerID STRING_AGG(ProductName \u0027, \u0027) FROM Orders GROUP BY CustomerID. Earlier versions use FOR XML PATH: STUFF((SELECT \u0027, \u0027 \u002B ProductName FROM Orders WHERE...) FOR XML PATH(\u0027\u0027)) 1 2 \u0027\u0027). GROUP_CONCAT in MySQL LISTAGG in Oracle.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483981-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use SUM function on strings","OptionFeedback":""},{"Weight":100,"Text":"Use STRING_AGG (SQL Server 2017\u002B) or FOR XML PATH for earlier versions","OptionFeedback":""},{"Weight":0,"Text":"String aggregation is not possible in SQL","OptionFeedback":""},{"Weight":0,"Text":"Use COUNT to combine strings","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"How do window functions differ from GROUP BY aggregates?","Hint":null,"Feedback":"GROUP BY collapses rows into groups; window functions keep all rows while adding aggregate columns. Example: GROUP BY: SELECT CategoryID AVG(Price) FROM Products GROUP BY CategoryID returns one row per category. Window function: SELECT ProductID CategoryID Price AVG(Price) OVER (PARTITION BY CategoryID) FROM Products returns all products with category average. Window functions enable per-row calculations with group context.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483984-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Window functions compute aggregates without collapsing rows while GROUP BY combines rows into groups","OptionFeedback":""},{"Weight":0,"Text":"Window functions and GROUP BY produce identical results","OptionFeedback":""},{"Weight":0,"Text":"Window functions are slower than GROUP BY","OptionFeedback":""},{"Weight":0,"Text":"Window functions cannot perform aggregation","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"How can you apply different filters to different aggregates in the same query?","Hint":null,"Feedback":"Filter individual aggregates with CASE: SELECT COUNT(*) AS Total COUNT(CASE WHEN Status=\u0027Shipped\u0027 THEN 1 END) AS Shipped COUNT(CASE WHEN Status=\u0027Pending\u0027 THEN 1 END) AS Pending FROM Orders. PostgreSQL supports FILTER: COUNT(*) FILTER (WHERE Status=\u0027Shipped\u0027). Enables multiple conditional aggregates in one query without UNION.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483986-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use CASE expressions inside aggregate functions or FILTER clause where supported","OptionFeedback":""},{"Weight":0,"Text":"Different filters require separate queries","OptionFeedback":""},{"Weight":0,"Text":"Aggregates cannot have individual filters","OptionFeedback":""},{"Weight":0,"Text":"Use multiple HAVING clauses","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What statistical aggregate functions does SQL Server provide?","Hint":null,"Feedback":"Statistical aggregates: STDEV/STDEV_POP (standard deviation sample/population) VAR/VAR_POP (variance) in SQL Server. Example: SELECT AVG(Salary) STDEV(Salary) FROM Employees. STDEV measures spread around mean. Some databases offer additional functions like MEDIAN PERCENTILE_CONT. Useful for data analysis and reporting.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483988-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SQL Server only provides basic aggregates","OptionFeedback":""},{"Weight":100,"Text":"SQL Server provides STDEV STDEVP VAR VARP for standard deviation and variance","OptionFeedback":""},{"Weight":0,"Text":"Statistical functions require external libraries","OptionFeedback":""},{"Weight":0,"Text":"Only mean calculations are supported","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"How do indexes affect aggregate query performance?","Hint":null,"Feedback":"Indexes help aggregates by: covering GROUP BY columns (enables index scan) supporting WHERE filters (reduces rows before aggregation) and enabling index-only access (covering indexes). Example: CREATE INDEX idx_Category_Price ON Products(CategoryID Price) for SELECT CategoryID AVG(Price) FROM Products GROUP BY CategoryID. Index allows efficient category grouping without full table scan.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483991-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Indexes on GROUP BY and WHERE columns can dramatically improve aggregate query performance","OptionFeedback":""},{"Weight":0,"Text":"Indexes have no effect on aggregate queries","OptionFeedback":""},{"Weight":0,"Text":"Indexes slow down aggregate queries","OptionFeedback":""},{"Weight":0,"Text":"Only clustered indexes help aggregates","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What is the GROUPING function used for with ROLLUP or CUBE?","Hint":null,"Feedback":"GROUPING returns 1 if column is aggregated (subtotal row) 0 if actual group value. Example: SELECT Year GROUPING(Year) AS IsYearTotal Quarter SUM(Sales) FROM Orders GROUP BY ROLLUP(Year Quarter). When Year is NULL due to grand total GROUPING(Year)=1. Distinguishes real NULL values from aggregation NULLs. Use in CASE for custom subtotal labels.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483993-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"GROUPING creates new groups in the result","OptionFeedback":""},{"Weight":100,"Text":"GROUPING identifies which rows are subtotals by returning 1 for aggregated NULL values","OptionFeedback":""},{"Weight":0,"Text":"GROUPING sorts the results","OptionFeedback":""},{"Weight":0,"Text":"GROUPING filters groups","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What affects memory usage in aggregate queries?","Hint":null,"Feedback":"Memory factors: number of distinct groups (more groups = more memory) DISTINCT operations (requires tracking unique values) sorting for GROUP BY and intermediate result storage. Large GROUP BY on high-cardinality columns can exceed memory causing disk spills. Solutions: add WHERE filters index GROUP BY columns or use summary tables. Monitor with execution plans.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483995-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Aggregates use no memory","OptionFeedback":""},{"Weight":100,"Text":"Number of groups and DISTINCT operations significantly impact memory usage","OptionFeedback":""},{"Weight":0,"Text":"All aggregate queries use the same memory","OptionFeedback":""},{"Weight":0,"Text":"Memory usage only depends on table size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"Can WHERE and HAVING be used together in the same query?","Hint":null,"Feedback":"WHERE and HAVING work together: WHERE filters before aggregation HAVING filters after. Example: SELECT CategoryID COUNT(*) FROM Products WHERE Price \u003E 10 GROUP BY CategoryID HAVING COUNT(*) \u003E 5. WHERE removes products under $10 first (row-level) then HAVING removes categories with \u22645 products (group-level). Combining both optimizes performance and provides precise filtering.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3483998-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Yes WHERE filters rows before grouping and HAVING filters groups after aggregation","OptionFeedback":""},{"Weight":0,"Text":"No only one can be used per query","OptionFeedback":""},{"Weight":0,"Text":"They are redundant when used together","OptionFeedback":""},{"Weight":0,"Text":"Using both causes errors","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"How does GROUP BY handle NULL values?","Hint":null,"Feedback":"GROUP BY treats all NULL values as equal forming one group. Example: if CategoryID has three NULL rows GROUP BY CategoryID creates one NULL group with count 3. Different from aggregate functions which ignore NULL. Use COALESCE to handle: GROUP BY COALESCE(CategoryID 0) treats NULL as 0. Important for accurate grouping when columns may contain NULL.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484009-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"NULL values are ignored in GROUP BY","OptionFeedback":""},{"Weight":100,"Text":"All NULL values are grouped together as a single group","OptionFeedback":""},{"Weight":0,"Text":"Each NULL creates a separate group","OptionFeedback":""},{"Weight":0,"Text":"NULL values cause errors in GROUP BY","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"How can you get the top N records per group?","Hint":null,"Feedback":"Top N per group using window function: SELECT * FROM (SELECT ProductID CategoryID Price ROW_NUMBER() OVER (PARTITION BY CategoryID ORDER BY Price DESC) AS RowNum FROM Products) AS Ranked WHERE RowNum \u003C= 3. Returns top 3 products per category. Alternative: correlated subquery with TOP. Common pattern for per-group analysis.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484052-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use GROUP BY with TOP","OptionFeedback":""},{"Weight":100,"Text":"Use window functions like ROW_NUMBER with PARTITION BY or correlated subqueries","OptionFeedback":""},{"Weight":0,"Text":"TOP N per group is not possible in SQL","OptionFeedback":""},{"Weight":0,"Text":"Use HAVING with COUNT","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What happens to precision when using AVG or SUM on decimal values?","Hint":null,"Feedback":"Aggregate results follow type precedence rules. SUM/AVG of INT returns INT (truncates decimals). SUM of DECIMAL(10 2) may return DECIMAL(38 2) risking overflow. AVG may increase precision. Best practice: explicitly cast when needed: AVG(CAST(IntColumn AS DECIMAL(10 2))). Monitor for overflow errors in large aggregations. Choose appropriate data types for aggregated values.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484078-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Precision is always reduced to integer","OptionFeedback":""},{"Weight":100,"Text":"Result precision follows SQL Server data type rules potentially causing overflow or precision loss","OptionFeedback":""},{"Weight":0,"Text":"Precision is unlimited for aggregates","OptionFeedback":""},{"Weight":0,"Text":"All decimals become floating point","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"What is the best strategy for optimizing slow aggregate queries?","Hint":null,"Feedback":"Optimization strategies: 1) Index GROUP BY columns 2) Filter early with WHERE 3) Use covering indexes 4) Reduce group cardinality 5) Create indexed views or summary tables 6) Avoid DISTINCT when possible 7) Use incremental aggregation. Example: for monthly sales summary create MonthySales table updated by triggers. Balance real-time needs with performance.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484082-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Add indexes filter with WHERE reduce groups use covering indexes or create summary tables","OptionFeedback":""},{"Weight":0,"Text":"Remove all indexes for faster aggregation","OptionFeedback":""},{"Weight":0,"Text":"Use more aggregate functions","OptionFeedback":""},{"Weight":0,"Text":"Aggregates cannot be optimized","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"How do you calculate running totals in SQL?","Hint":null,"Feedback":"Running total with window function: SELECT OrderDate Amount SUM(Amount) OVER (ORDER BY OrderDate ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS RunningTotal FROM Orders. ROWS BETWEEN specifies cumulative frame. Alternative: SUM(Amount) OVER (ORDER BY OrderDate) defaults to cumulative. Older versions use correlated subquery. Window functions more efficient.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484084-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Running totals require application code","OptionFeedback":""},{"Weight":100,"Text":"Use window functions with cumulative frame specification or correlated subqueries","OptionFeedback":""},{"Weight":0,"Text":"GROUP BY automatically creates running totals","OptionFeedback":""},{"Weight":0,"Text":"Running totals are not possible in SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"In what order are aggregate query clauses executed?","Hint":null,"Feedback":"Logical execution order: 1) FROM/JOIN 2) WHERE (filter rows) 3) GROUP BY (create groups) 4) Aggregate functions 5) HAVING (filter groups) 6) SELECT 7) DISTINCT 8) ORDER BY 9) TOP/LIMIT. This explains why: WHERE cannot use aliases HAVING can use aggregates and ORDER BY can use SELECT aliases. Understanding order helps write correct queries.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484088-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"WHERE then GROUP BY then HAVING then SELECT then ORDER BY","OptionFeedback":""},{"Weight":0,"Text":"SELECT then WHERE then GROUP BY then HAVING","OptionFeedback":""},{"Weight":0,"Text":"All clauses execute simultaneously","OptionFeedback":""},{"Weight":0,"Text":"ORDER BY then WHERE then GROUP BY","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What are indexed views and how do they help aggregate queries?","Hint":null,"Feedback":"Indexed views (materialized views) physically store and index query results. For aggregates: CREATE VIEW vw_CategorySales WITH SCHEMABINDING AS SELECT CategoryID SUM(Amount) AS Total COUNT_BIG(*) AS Cnt FROM dbo.Sales GROUP BY CategoryID; CREATE UNIQUE CLUSTERED INDEX idx ON vw_CategorySales(CategoryID). SQL Server maintains view automatically. Dramatically speeds repeated aggregate queries. Trade-off: maintenance overhead on base table updates.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.348409-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Indexed views are the same as regular views","OptionFeedback":""},{"Weight":100,"Text":"Indexed views physically store aggregated results improving query performance for frequently-used aggregations","OptionFeedback":""},{"Weight":0,"Text":"Indexed views only work with non-aggregated data","OptionFeedback":""},{"Weight":0,"Text":"Indexed views slow down queries","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"What happens when aggregate functions encounter data type errors?","Hint":null,"Feedback":"Aggregate errors occur from: wrong data type (SUM on string) arithmetic overflow (SUM exceeds data type limit) or division by zero (AVG with special conditions). Example: SUM of large BIGINT values may overflow. Handle with TRY_CONVERT for mixed types CAST to larger types for overflow or SET ARITHABORT OFF cautiously. Test aggregates with representative data volumes.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484092-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Errors are silently ignored","OptionFeedback":""},{"Weight":100,"Text":"Aggregate functions raise errors for invalid data types or arithmetic overflow","OptionFeedback":""},{"Weight":0,"Text":"Invalid values are converted to NULL","OptionFeedback":""},{"Weight":0,"Text":"Aggregates never produce errors","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"How does the PIVOT operator use aggregate functions?","Hint":null,"Feedback":"PIVOT uses aggregates to rotate data: SELECT * FROM (SELECT Year Quarter Sales FROM OrderData) AS SourceTable PIVOT (SUM(Sales) FOR Quarter IN ([Q1] [Q2] [Q3] [Q4])) AS PivotTable. Transforms quarters from rows to columns summing sales. Any aggregate works: AVG COUNT MAX. Useful for crosstab reports. UNPIVOT reverses the operation.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484095-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"PIVOT does not use aggregate functions","OptionFeedback":""},{"Weight":100,"Text":"PIVOT requires an aggregate function to transform rows into columns","OptionFeedback":""},{"Weight":0,"Text":"PIVOT only works with COUNT","OptionFeedback":""},{"Weight":0,"Text":"Aggregates are optional with PIVOT","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"How do you count rows that meet specific conditions within a group?","Hint":null,"Feedback":"Conditional counts: COUNT(CASE WHEN Status=\u0027Active\u0027 THEN 1 END) or SUM(CASE WHEN Status=\u0027Active\u0027 THEN 1 ELSE 0 END). Example: SELECT CategoryID COUNT(*) AS Total COUNT(CASE WHEN Price\u003E100 THEN 1 END) AS Expensive COUNT(CASE WHEN Price\u003C=100 THEN 1 END) AS Affordable FROM Products GROUP BY CategoryID. Single query multiple conditional counts per group.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484098-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use COUNT with CASE expression or SUM with CASE for conditional counts","OptionFeedback":""},{"Weight":0,"Text":"Use multiple GROUP BY statements","OptionFeedback":""},{"Weight":0,"Text":"Conditional counting is not possible","OptionFeedback":""},{"Weight":0,"Text":"Use WHERE for each condition separately","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"What is a best practice when writing aggregate queries?","Hint":null,"Feedback":"Best practices: 1) Filter with WHERE before GROUP BY 2) Index GROUP BY columns 3) Choose appropriate aggregates (COUNT vs SUM) 4) Handle NULL appropriately 5) Use meaningful column aliases 6) Consider HAVING for group filters 7) Test with representative data 8) Monitor performance 9) Document complex aggregations. Well-designed aggregate queries are both performant and maintainable.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.34841-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use SELECT * with aggregates","OptionFeedback":""},{"Weight":100,"Text":"Use appropriate WHERE filters index GROUP BY columns and choose correct aggregate functions for the analysis","OptionFeedback":""},{"Weight":0,"Text":"Avoid using indexes with aggregates","OptionFeedback":""},{"Weight":0,"Text":"Always use ROLLUP and CUBE","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"What are common limitations of aggregate functions?","Hint":null,"Feedback":"Aggregate limitations: 1) No direct nesting (use subqueries) 2) Type compatibility required 3) All SELECT non-aggregates must be in GROUP BY 4) Cannot use aggregates in WHERE (use HAVING) 5) Scope limited to current query level 6) Performance impacts with large groups/DISTINCT. Understanding limitations helps avoid errors and design better queries.","TopicTitle":"Quiz 8 - Aggregation","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.3484102-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Cannot nest directly must use with compatible data types and cannot reference correlated columns outside their scope","OptionFeedback":""},{"Weight":0,"Text":"Aggregate functions have no limitations","OptionFeedback":""},{"Weight":0,"Text":"Aggregates can only process 1000 rows","OptionFeedback":""},{"Weight":0,"Text":"Only one aggregate per query is allowed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
