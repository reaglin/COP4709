  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_2_(Week_2)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:08.9029253-05:00","NextQuestionNumber":36,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What does ETL stand for in the context of data management?","Hint":null,"Feedback":"ETL stands for Extract Transform and Load. It is a data integration process that extracts data from various sources transforms it into a suitable format and loads it into a target database or data warehouse. This process is fundamental to data warehousing and business intelligence.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029062-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Encrypt Transfer and Load","OptionFeedback":""},{"Weight":100,"Text":"Extract Transform and Load","OptionFeedback":""},{"Weight":0,"Text":"Evaluate Test and Launch","OptionFeedback":""},{"Weight":0,"Text":"Export Translate and Link","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What is a primary advantage of using CSV files for data import?","Hint":null,"Feedback":"CSV (Comma-Separated Values) files are simple text-based formats that are universally supported by databases spreadsheets and programming languages. They are easy to create edit and import though they lack features like data typing nested structures or built-in validation.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029079-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"CSV files are encrypted by default for security","OptionFeedback":""},{"Weight":0,"Text":"CSV files can store complex nested data structures","OptionFeedback":""},{"Weight":100,"Text":"CSV files are simple text-based and widely supported across platforms","OptionFeedback":""},{"Weight":0,"Text":"CSV files automatically validate data types during import","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"In the ETL process what is the primary purpose of the Transform step?","Hint":null,"Feedback":"The Transform step cleanses validates and converts data from source formats to match the target system\u0027s requirements. This includes data type conversions handling nulls removing duplicates standardizing formats applying business rules and enriching data. Transformation ensures data quality and consistency.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029082-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To clean validate convert and standardize data to match the target schema","OptionFeedback":""},{"Weight":0,"Text":"To compress data to reduce storage requirements","OptionFeedback":""},{"Weight":0,"Text":"To create backup copies of the original data","OptionFeedback":""},{"Weight":0,"Text":"To encrypt sensitive data before loading","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What is the advantage of bulk loading data compared to row-by-row insertion?","Hint":null,"Feedback":"Bulk loading inserts large amounts of data in a single operation rather than individual row-by-row inserts. This dramatically improves performance by reducing transaction overhead network round-trips and index maintenance during the load. Tools like LOAD DATA INFILE or COPY commands enable bulk loading.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029085-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Bulk loading provides better error handling for individual records","OptionFeedback":""},{"Weight":0,"Text":"Bulk loading uses less storage space in the database","OptionFeedback":""},{"Weight":100,"Text":"Bulk loading is significantly faster and reduces transaction overhead","OptionFeedback":""},{"Weight":0,"Text":"Bulk loading automatically validates all data before insertion","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What makes JSON a popular format for importing data into modern databases?","Hint":null,"Feedback":"JSON (JavaScript Object Notation) is widely used because it supports nested structures is human-readable and is the native format for web APIs and document databases like MongoDB. Many relational databases now support JSON columns making it versatile for modern data integration.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029087-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"JSON files are always smaller than other data formats","OptionFeedback":""},{"Weight":100,"Text":"JSON supports nested structures and is native to web APIs and document databases","OptionFeedback":""},{"Weight":0,"Text":"JSON automatically enforces data type validation","OptionFeedback":""},{"Weight":0,"Text":"JSON can only be used with NoSQL databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"Why is data validation important during the import process?","Hint":null,"Feedback":"Data validation during import ensures that only clean accurate data enters the database. It checks for data type correctness format compliance required fields range validation and business rule adherence. Catching errors early prevents data quality issues and downstream problems.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029096-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To ensure data quality and prevent invalid or corrupt data from entering the database","OptionFeedback":""},{"Weight":0,"Text":"To automatically convert all data to uppercase","OptionFeedback":""},{"Weight":0,"Text":"To reduce the file size of imported data","OptionFeedback":""},{"Weight":0,"Text":"To speed up the import process","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is an advantage of using APIs as data sources for database imports?","Hint":null,"Feedback":"APIs (Application Programming Interfaces) enable programmatic access to data from external systems in real-time or near-real-time. They are ideal for integrating live data from web services third-party platforms or other databases allowing automated scheduled imports without manual file exchanges.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029099-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"APIs always provide data faster than file-based imports","OptionFeedback":""},{"Weight":0,"Text":"APIs eliminate the need for data transformation","OptionFeedback":""},{"Weight":100,"Text":"APIs provide real-time or near-real-time access to current data from external systems","OptionFeedback":""},{"Weight":0,"Text":"APIs are the only way to import large datasets","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"Which of the following is a data cleansing activity?","Hint":null,"Feedback":"Data cleansing (or data cleaning) involves identifying and correcting errors and inconsistencies in data. Common activities include removing duplicates correcting spelling errors standardizing formats handling missing values and validating data against business rules to improve overall data quality.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029101-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Encrypting all sensitive fields in the database","OptionFeedback":""},{"Weight":100,"Text":"Removing duplicate records and correcting misspelled values","OptionFeedback":""},{"Weight":0,"Text":"Creating indexes on frequently queried columns","OptionFeedback":""},{"Weight":0,"Text":"Backing up the database before loading new data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"How does ELT (Extract Load Transform) differ from traditional ETL?","Hint":null,"Feedback":"ELT loads raw data into the target system first then performs transformations using the target database\u0027s processing power. This approach leverages modern cloud data warehouses\u0027 computational capabilities and allows for more flexible transformations. ETL transforms data before loading it into the target system.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029103-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"ELT is faster than ETL for all types of data","OptionFeedback":""},{"Weight":0,"Text":"ELT cannot handle complex transformations","OptionFeedback":""},{"Weight":100,"Text":"ELT loads raw data first and performs transformations within the target database","OptionFeedback":""},{"Weight":0,"Text":"ELT is only used for NoSQL databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What characteristic of XML makes it suitable for complex hierarchical data imports?","Hint":null,"Feedback":"XML (eXtensible Markup Language) uses nested tags to represent hierarchical data structures making it ideal for complex relationships. It supports attributes metadata and namespaces. While more verbose than JSON XML is still widely used for enterprise data exchange configuration files and document-oriented data.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029107-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"XML supports nested elements and attributes for representing hierarchical structures","OptionFeedback":""},{"Weight":0,"Text":"XML files are always smaller than equivalent JSON files","OptionFeedback":""},{"Weight":0,"Text":"XML automatically validates data during the import process","OptionFeedback":""},{"Weight":0,"Text":"XML can only be imported into relational databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What is an incremental data load?","Hint":null,"Feedback":"Incremental loading imports only new or modified data since the last load reducing processing time and resource usage. This is achieved by tracking timestamps change flags or using Change Data Capture (CDC). It contrasts with full loads which reload all data every time.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029109-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Loading data one record at a time for better error control","OptionFeedback":""},{"Weight":100,"Text":"Loading only new or changed data since the last load operation","OptionFeedback":""},{"Weight":0,"Text":"Gradually increasing the batch size during import for optimization","OptionFeedback":""},{"Weight":0,"Text":"Loading data in alphabetical order by primary key","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What is a data pipeline?","Hint":null,"Feedback":"A data pipeline is an automated series of processes that extracts data from sources transforms it as needed and loads it into destinations. Pipelines can include multiple stages validation error handling and scheduling. Modern tools like Apache Airflow and AWS Glue help build and manage data pipelines.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029111-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A physical cable connecting databases to data sources","OptionFeedback":""},{"Weight":0,"Text":"A backup mechanism for protecting data during transfer","OptionFeedback":""},{"Weight":100,"Text":"An automated workflow that moves and transforms data from sources to destinations","OptionFeedback":""},{"Weight":0,"Text":"A graphical tool for visualizing data flows","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is Change Data Capture (CDC)?","Hint":null,"Feedback":"Change Data Capture identifies and captures only the data that has changed (inserts updates deletes) in source systems. This enables efficient real-time or near-real-time data replication without full table scans. CDC can use database logs triggers or timestamps to detect changes.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029113-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A technique to identify and capture only data changes from a source system for efficient synchronization","OptionFeedback":""},{"Weight":0,"Text":"A backup strategy that captures database snapshots at regular intervals","OptionFeedback":""},{"Weight":0,"Text":"A security measure that logs all changes for audit purposes","OptionFeedback":""},{"Weight":0,"Text":"A compression algorithm that reduces data size during transfer","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What is data mapping in the context of data import?","Hint":null,"Feedback":"Data mapping defines the relationships between source data fields and target database columns. It specifies which source field maps to which destination column including any necessary transformations. Accurate mapping is essential for successful data integration and ensures data lands in the correct locations.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029116-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Creating visual diagrams of database relationships","OptionFeedback":""},{"Weight":100,"Text":"Defining how fields from source data correspond to columns in the target database","OptionFeedback":""},{"Weight":0,"Text":"Determining the geographic location where data is stored","OptionFeedback":""},{"Weight":0,"Text":"Organizing data files in folders for easy access","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What characterizes batch data processing for imports?","Hint":null,"Feedback":"Batch processing imports and processes data in groups at scheduled intervals (hourly daily weekly) rather than continuously. This approach is efficient for large volumes of data that don\u0027t require real-time updates. Batch jobs typically run during off-peak hours to minimize system impact.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029118-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Processing data continuously in real-time as it arrives","OptionFeedback":""},{"Weight":100,"Text":"Processing accumulated data in groups at scheduled intervals","OptionFeedback":""},{"Weight":0,"Text":"Processing only the most recent record from each source","OptionFeedback":""},{"Weight":0,"Text":"Processing data in alphabetical order","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"How does streaming data import differ from batch import?","Hint":null,"Feedback":"Streaming imports process data continuously in real-time or near-real-time as events occur. Technologies like Apache Kafka and AWS Kinesis enable streaming. This approach provides immediate data availability for time-sensitive applications but is more complex than batch processing.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.902912-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Streaming processes data continuously as it arrives rather than in scheduled batches","OptionFeedback":""},{"Weight":0,"Text":"Streaming can only handle small amounts of data","OptionFeedback":""},{"Weight":0,"Text":"Streaming is always slower than batch processing","OptionFeedback":""},{"Weight":0,"Text":"Streaming cannot perform data transformations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What is the purpose of database migration tools?","Hint":null,"Feedback":"Database migration tools help transfer data schema and objects from one database system to another (e.g. Oracle to PostgreSQL). They handle schema conversion data type mapping and data transfer automating much of the complex migration process and reducing errors and downtime.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029122-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To encrypt data during network transmission","OptionFeedback":""},{"Weight":0,"Text":"To create backup copies of production databases","OptionFeedback":""},{"Weight":100,"Text":"To facilitate moving data and schema from one database system to another","OptionFeedback":""},{"Weight":0,"Text":"To optimize query performance in existing databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"Which of the following is a common data quality issue during import?","Hint":null,"Feedback":"Inconsistent formatting is a common data quality issue. Different sources may use different date formats number representations or text encodings. Other common issues include missing values duplicate records invalid data types and constraint violations. Addressing these during import prevents downstream problems.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029125-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Inconsistent date formats across different source files","OptionFeedback":""},{"Weight":0,"Text":"Data arriving too quickly for processing","OptionFeedback":""},{"Weight":0,"Text":"Database having too much available storage space","OptionFeedback":""},{"Weight":0,"Text":"Network connection being too fast","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"What is the purpose of a staging area in data import processes?","Hint":null,"Feedback":"A staging area is a temporary storage location where raw extracted data is held before transformation and loading. It allows for data validation quality checks and transformation without impacting source systems or the target database. Staging areas facilitate troubleshooting and enable recovery from failed imports.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029128-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To permanently archive all imported data","OptionFeedback":""},{"Weight":100,"Text":"To temporarily store raw data before transformation and loading into the target database","OptionFeedback":""},{"Weight":0,"Text":"To display data visualizations for users","OptionFeedback":""},{"Weight":0,"Text":"To compress data for long-term storage","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What is data deduplication in the context of imports?","Hint":null,"Feedback":"Data deduplication identifies and removes duplicate records based on matching keys or field combinations. This is crucial during imports to prevent data redundancy ensure referential integrity and maintain accurate counts. Deduplication strategies include exact matching fuzzy matching and probabilistic algorithms.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.902913-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Splitting large files into smaller chunks for import","OptionFeedback":""},{"Weight":0,"Text":"Creating backup copies of data before import","OptionFeedback":""},{"Weight":100,"Text":"Identifying and removing duplicate records to ensure data uniqueness","OptionFeedback":""},{"Weight":0,"Text":"Encrypting data multiple times for enhanced security","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is the primary use of the COPY command in PostgreSQL?","Hint":null,"Feedback":"PostgreSQL\u0027s COPY command efficiently imports data from CSV or text files directly into tables. It is much faster than individual INSERT statements for large datasets and supports various options for delimiters null values and data formats. COPY is ideal for bulk data loading.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029132-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To efficiently import large amounts of data from files into tables","OptionFeedback":""},{"Weight":0,"Text":"To create duplicate copies of existing tables","OptionFeedback":""},{"Weight":0,"Text":"To copy data between different PostgreSQL databases","OptionFeedback":""},{"Weight":0,"Text":"To backup the entire database to a file","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"Why is data type conversion often necessary during data import?","Hint":null,"Feedback":"Data type conversion is necessary because source data types may not match target database column types. For example dates might be stored as strings numeric values might need precision adjustments or boolean values might need conversion from text. Proper conversion prevents import errors and ensures data integrity.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029135-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To make data files smaller and faster to transfer","OptionFeedback":""},{"Weight":100,"Text":"To ensure source data matches the target database column data types","OptionFeedback":""},{"Weight":0,"Text":"To encrypt sensitive data automatically","OptionFeedback":""},{"Weight":0,"Text":"To sort data in the correct order","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is a best practice for handling errors during data import?","Hint":null,"Feedback":"Best practice involves logging errors with details (row number error type values) allowing the process to continue and setting error thresholds. This approach enables analysis of error patterns recovery of failed records and prevents single errors from failing entire imports. Error logs should be reviewed and addressed.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029137-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Immediately stop the entire import process at the first error","OptionFeedback":""},{"Weight":0,"Text":"Ignore all errors and import whatever data is valid","OptionFeedback":""},{"Weight":100,"Text":"Log errors to a separate file and continue processing with configurable error thresholds","OptionFeedback":""},{"Weight":0,"Text":"Automatically delete any records that cause errors","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What advantage does the Parquet file format offer for data imports?","Hint":null,"Feedback":"Parquet is a columnar storage format that stores data by columns rather than rows. This enables excellent compression ratios and fast querying for analytical workloads. Parquet is widely used with big data tools like Apache Spark and is efficient for importing large datasets into data warehouses.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029139-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Parquet files are human-readable text files","OptionFeedback":""},{"Weight":100,"Text":"Parquet is a columnar format that offers efficient compression and fast query performance","OptionFeedback":""},{"Weight":0,"Text":"Parquet files can only be used with specific database types","OptionFeedback":""},{"Weight":0,"Text":"Parquet automatically validates all data during import","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"How should database constraints be handled during large data imports?","Hint":null,"Feedback":"For large imports temporarily disabling constraints (foreign keys checks triggers) can significantly improve performance. After import constraints should be re-enabled and data validated to ensure integrity. This approach balances speed with data quality though it requires careful validation afterward.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029141-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Temporarily disable constraints during import then re-enable and validate after completion","OptionFeedback":""},{"Weight":0,"Text":"Always keep all constraints enabled regardless of import size","OptionFeedback":""},{"Weight":0,"Text":"Permanently remove constraints before importing data","OptionFeedback":""},{"Weight":0,"Text":"Constraints are automatically disabled during imports","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What is an important consideration when using web scraping as a data source?","Hint":null,"Feedback":"Web scraping must be done ethically and legally. Important considerations include respecting robots.txt files adhering to website terms of service implementing rate limiting to avoid overloading servers and checking for API alternatives. Scraped data structure may change when websites are updated requiring maintenance.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029143-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Web scraping always provides more accurate data than APIs","OptionFeedback":""},{"Weight":0,"Text":"Web scraping is faster than all other data collection methods","OptionFeedback":""},{"Weight":100,"Text":"Web scraping must respect website terms of service and robots.txt files","OptionFeedback":""},{"Weight":0,"Text":"Web scraping only works with static HTML pages","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"Why is scheduling important for automated data imports?","Hint":null,"Feedback":"Scheduling ensures imports run at appropriate times (off-peak hours for batch jobs specific intervals for updates) maintains data freshness through regular updates coordinates dependent processes and optimizes resource usage. Tools like cron jobs Apache Airflow and cloud schedulers enable reliable automated imports.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029154-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Scheduling makes imports run faster","OptionFeedback":""},{"Weight":100,"Text":"Scheduling ensures imports run at optimal times and maintains regular data freshness","OptionFeedback":""},{"Weight":0,"Text":"Scheduling eliminates the need for error handling","OptionFeedback":""},{"Weight":0,"Text":"Scheduling automatically validates all imported data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"What is data enrichment in the context of ETL?","Hint":null,"Feedback":"Data enrichment enhances imported data by adding information from external sources lookups or calculations. Examples include appending geographic coordinates from addresses adding demographic data or calculating derived metrics. Enrichment increases data value for analysis and decision-making.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029157-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Adding additional information to imported data from other sources or through calculations","OptionFeedback":""},{"Weight":0,"Text":"Removing unnecessary columns to simplify the data","OptionFeedback":""},{"Weight":0,"Text":"Encrypting data to enhance security","OptionFeedback":""},{"Weight":0,"Text":"Compressing data to save storage space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is the purpose of MySQL\u0027s LOAD DATA INFILE command?","Hint":null,"Feedback":"LOAD DATA INFILE is MySQL\u0027s high-performance bulk loading command for importing data from CSV or text files. It is significantly faster than INSERT statements for large datasets supporting various formatting options field terminators and data handling modes. It is the preferred method for large-scale data imports.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029166-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To export data from MySQL to external files","OptionFeedback":""},{"Weight":100,"Text":"To quickly import large amounts of data from text files into MySQL tables","OptionFeedback":""},{"Weight":0,"Text":"To load MySQL server configuration from a file","OptionFeedback":""},{"Weight":0,"Text":"To restore database backups","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"What is data lineage in data import processes?","Hint":null,"Feedback":"Data lineage documents the complete lifecycle of data including its origin transformations applied during ETL systems it passes through and final destinations. It is essential for compliance troubleshooting impact analysis and understanding data quality issues. Good lineage tracking improves data governance and trust.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029169-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The physical path data travels through network cables","OptionFeedback":""},{"Weight":0,"Text":"The alphabetical ordering of data fields","OptionFeedback":""},{"Weight":100,"Text":"Documentation of data origins transformations and movement through systems","OptionFeedback":""},{"Weight":0,"Text":"The chronological order in which data was collected","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What is Apache Airflow used for in data import workflows?","Hint":null,"Feedback":"Apache Airflow is an open-source platform for authoring scheduling and monitoring data pipelines. It uses DAGs (Directed Acyclic Graphs) to define workflow dependencies enables complex ETL orchestration provides monitoring and alerting and supports retries and error handling. It is widely used for managing data import processes.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029172-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Orchestrating and scheduling complex data pipelines and ETL workflows","OptionFeedback":""},{"Weight":0,"Text":"Compressing data files before import","OptionFeedback":""},{"Weight":0,"Text":"Encrypting data during transmission","OptionFeedback":""},{"Weight":0,"Text":"Visualizing data in dashboards","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"What is schema evolution in the context of data imports?","Hint":null,"Feedback":"Schema evolution manages changes to database structure (adding columns modifying types renaming fields) while maintaining backward compatibility with existing data imports and queries. Good schema evolution practices include versioning backward-compatible changes and careful migration planning to prevent breaking existing processes.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029182-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The process of optimizing database performance over time","OptionFeedback":""},{"Weight":100,"Text":"Managing changes to data structure while maintaining compatibility with existing data and processes","OptionFeedback":""},{"Weight":0,"Text":"Converting databases from one type to another","OptionFeedback":""},{"Weight":0,"Text":"Backing up database schemas before imports","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"Why is having a rollback strategy important for data imports?","Hint":null,"Feedback":"A rollback strategy allows reverting to the pre-import state if problems occur. This might involve using database transactions savepoints backup restoration or keeping audit trails of changes. Rollback capability is essential for maintaining data integrity and minimizing downtime when imports fail or produce unexpected results.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029185-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Rollback improves import performance","OptionFeedback":""},{"Weight":0,"Text":"Rollback eliminates the need for data validation","OptionFeedback":""},{"Weight":100,"Text":"Rollback enables recovery to the previous state if an import fails or causes problems","OptionFeedback":""},{"Weight":0,"Text":"Rollback automatically fixes data quality issues","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"What is an upsert operation in database imports?","Hint":null,"Feedback":"Upsert (a portmanteau of update and insert) is an operation that inserts a record if it does not exist or updates it if it does based on a key match. This is useful for imports where you want to add new records while updating existing ones. SQL implementations include INSERT ON DUPLICATE KEY UPDATE or MERGE statements.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029188-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"An operation that inserts new records or updates existing ones based on a key match","OptionFeedback":""},{"Weight":0,"Text":"An operation that only inserts data and skips duplicates","OptionFeedback":""},{"Weight":0,"Text":"An operation that deletes old records before inserting new ones","OptionFeedback":""},{"Weight":0,"Text":"An operation that sorts data before insertion","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What should be monitored during large-scale data import operations?","Hint":null,"Feedback":"Effective monitoring tracks multiple metrics including import progress (rows processed) error counts and types system resources (CPU memory disk I/O) processing speed data quality indicators and completion status. Monitoring enables early detection of issues performance optimization and provides visibility into long-running import operations.","TopicTitle":"Quiz 2 - Import and ETL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9029192-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Only the final completion status","OptionFeedback":""},{"Weight":100,"Text":"Progress metrics error rates system resources and data quality indicators","OptionFeedback":""},{"Weight":0,"Text":"Only database storage space","OptionFeedback":""},{"Weight":0,"Text":"Only network bandwidth usage","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
