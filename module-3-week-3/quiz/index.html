  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_3_(Week_3)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:08.9699412-05:00","NextQuestionNumber":36,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a stored procedure in SQL Server?","Hint":null,"Feedback":"A stored procedure is a precompiled set of one or more T-SQL statements stored in the database. It can accept parameters perform operations and return results. Stored procedures improve performance through reuse reduce network traffic and centralize business logic in the database.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.969929-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A precompiled collection of T-SQL statements stored in the database that can be executed as a unit","OptionFeedback":""},{"Weight":0,"Text":"A temporary table that stores intermediate query results","OptionFeedback":""},{"Weight":0,"Text":"A log file that records all database transactions","OptionFeedback":""},{"Weight":0,"Text":"A backup mechanism that saves database state","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"Which T-SQL statement is used to create a new stored procedure?","Hint":null,"Feedback":"The CREATE PROCEDURE statement (or its abbreviation CREATE PROC) is used to create a new stored procedure in SQL Server. Example: CREATE PROCEDURE GetCustomers AS SELECT * FROM Customers. The procedure is stored in the database and can be executed multiple times.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699304-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"MAKE PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"NEW PROCEDURE","OptionFeedback":""},{"Weight":100,"Text":"CREATE PROCEDURE or CREATE PROC","OptionFeedback":""},{"Weight":0,"Text":"BUILD PROCEDURE","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What T-SQL statement is used to modify an existing stored procedure without dropping it?","Hint":null,"Feedback":"ALTER PROCEDURE (or ALTER PROC) modifies an existing stored procedure while preserving permissions and dependencies. Example: ALTER PROCEDURE GetCustomers AS SELECT * FROM Customers WHERE Active = 1. This is preferred over dropping and recreating as it maintains object references.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699307-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"UPDATE PROCEDURE","OptionFeedback":""},{"Weight":100,"Text":"ALTER PROCEDURE or ALTER PROC","OptionFeedback":""},{"Weight":0,"Text":"MODIFY PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"CHANGE PROCEDURE","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"Which T-SQL commands can be used to execute a stored procedure?","Hint":null,"Feedback":"SQL Server stored procedures can be executed using EXECUTE (or EXEC): EXEC GetCustomers or EXECUTE GetCustomers. If the procedure is the first statement in a batch you can call it by name alone: GetCustomers. The EXEC keyword is required when not the first statement.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699311-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"RUN or START only","OptionFeedback":""},{"Weight":0,"Text":"CALL only","OptionFeedback":""},{"Weight":100,"Text":"EXECUTE EXEC or just the procedure name","OptionFeedback":""},{"Weight":0,"Text":"INVOKE or TRIGGER","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"How do you define an input parameter in a SQL Server stored procedure?","Hint":null,"Feedback":"Input parameters are defined using @ParameterName DataType in the procedure definition. Example: CREATE PROCEDURE GetCustomerByID @CustomerID INT AS SELECT * FROM Customers WHERE CustomerID = @CustomerID. Parameters make procedures reusable with different values.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699313-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use @ symbol followed by parameter name and data type in the procedure definition","OptionFeedback":""},{"Weight":0,"Text":"Use $ symbol followed by parameter name","OptionFeedback":""},{"Weight":0,"Text":"Use # symbol followed by parameter name","OptionFeedback":""},{"Weight":0,"Text":"Parameters are automatically detected and do not need declaration","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"How do you specify an output parameter in a T-SQL stored procedure?","Hint":null,"Feedback":"Output parameters are defined by adding OUTPUT (or OUT) after the parameter data type. Example: CREATE PROCEDURE GetTotal @Total INT OUTPUT AS SELECT @Total = SUM(Amount) FROM Orders. When calling the procedure you must also specify OUTPUT: EXEC GetTotal @Result OUTPUT.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.969932-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Add RETURN keyword after the parameter name","OptionFeedback":""},{"Weight":0,"Text":"Add OUT keyword after the parameter name","OptionFeedback":""},{"Weight":100,"Text":"Add OUTPUT or OUT keyword after the parameter data type","OptionFeedback":""},{"Weight":0,"Text":"Use a different symbol like \u0026 before the parameter name","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is a primary benefit of using stored procedures?","Hint":null,"Feedback":"Stored procedures offer multiple benefits: precompilation improves performance reduced network traffic (sending procedure name vs. full SQL) code reusability centralized business logic enhanced security through permission control and easier maintenance. They are executed on the server reducing client-server roundtrips.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699323-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Stored procedures eliminate the need for database indexes","OptionFeedback":""},{"Weight":100,"Text":"Stored procedures improve performance through precompilation and reduced network traffic","OptionFeedback":""},{"Weight":0,"Text":"Stored procedures automatically backup your data","OptionFeedback":""},{"Weight":0,"Text":"Stored procedures prevent all SQL injection attacks","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"How do you specify a default value for a stored procedure parameter in T-SQL?","Hint":null,"Feedback":"Default values are specified using = after the data type: CREATE PROCEDURE GetOrders @Status VARCHAR(20) = \u0027Active\u0027 AS SELECT * FROM Orders WHERE Status = @Status. If no value is provided when calling the procedure the default is used making parameters optional.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699326-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use equals sign after the data type: @Parameter INT = 10","OptionFeedback":""},{"Weight":0,"Text":"Use DEFAULT keyword before parameter name","OptionFeedback":""},{"Weight":0,"Text":"Use SET statement inside the procedure","OptionFeedback":""},{"Weight":0,"Text":"Default values cannot be specified for parameters","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What does the RETURN statement do in a SQL Server stored procedure?","Hint":null,"Feedback":"RETURN exits the procedure immediately and can optionally return a single integer value (typically 0 for success negative for errors). Example: IF @CustomerID IS NULL RETURN -1. For multiple values use OUTPUT parameters. Result sets are returned via SELECT statements not RETURN.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699328-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Returns a result set to the caller","OptionFeedback":""},{"Weight":0,"Text":"Returns multiple values through output parameters","OptionFeedback":""},{"Weight":100,"Text":"Exits the procedure immediately and optionally returns an integer status code","OptionFeedback":""},{"Weight":0,"Text":"Returns the number of rows affected by the procedure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What T-SQL construct is used for error handling in stored procedures?","Hint":null,"Feedback":"TRY...CATCH blocks handle errors in stored procedures. Code in the TRY block is executed and if an error occurs control transfers to the CATCH block. Example: BEGIN TRY...statements...END TRY BEGIN CATCH...error handling...END CATCH. Use ERROR_MESSAGE() and ERROR_NUMBER() functions in CATCH.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699331-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"ON ERROR statement","OptionFeedback":""},{"Weight":100,"Text":"TRY...CATCH blocks","OptionFeedback":""},{"Weight":0,"Text":"IF ERROR THEN statement","OptionFeedback":""},{"Weight":0,"Text":"ERROR HANDLER declaration","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What statement removes a stored procedure from the database?","Hint":null,"Feedback":"DROP PROCEDURE (or DROP PROC) removes a stored procedure from the database. Example: DROP PROCEDURE GetCustomers. In SQL Server 2016\u002B you can use DROP PROCEDURE IF EXISTS to avoid errors if the procedure does not exist. Dropping removes all permissions and dependencies.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699333-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"DROP PROCEDURE or DROP PROC","OptionFeedback":""},{"Weight":0,"Text":"DELETE PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"REMOVE PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"DESTROY PROCEDURE","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What prefix identifies system stored procedures in SQL Server?","Hint":null,"Feedback":"System stored procedures use the sp_ prefix such as sp_help sp_who and sp_executesql. They are stored in the master database but can be executed from any database context. Note: Avoid using sp_ prefix for user procedures as SQL Server checks the master database first causing performance overhead.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699336-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"sys_","OptionFeedback":""},{"Weight":0,"Text":"system_","OptionFeedback":""},{"Weight":100,"Text":"sp_","OptionFeedback":""},{"Weight":0,"Text":"sproc_","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What does the WITH RECOMPILE option do when creating or executing a stored procedure?","Hint":null,"Feedback":"WITH RECOMPILE forces SQL Server to create a fresh execution plan each time the procedure executes instead of using a cached plan. Use it when: CREATE PROCEDURE GetData WITH RECOMPILE or EXEC GetData WITH RECOMPILE. Useful for procedures with highly variable parameters but reduces performance benefits of plan reuse.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699338-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It permanently deletes the cached execution plan","OptionFeedback":""},{"Weight":100,"Text":"It forces the procedure to create a new execution plan each time it runs","OptionFeedback":""},{"Weight":0,"Text":"It compiles the procedure in a separate thread","OptionFeedback":""},{"Weight":0,"Text":"It optimizes the procedure for faster execution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"How do you create a temporary stored procedure in SQL Server?","Hint":null,"Feedback":"Temporary procedures use # for local (session-specific) or ## for global (visible to all sessions). Example: CREATE PROCEDURE #TempProc AS SELECT * FROM Table. Local temp procedures exist only for the creating session and are automatically dropped. They are stored in tempdb.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.969934-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use # prefix for local temp or ## for global temp procedures","OptionFeedback":""},{"Weight":0,"Text":"Use TEMP keyword before PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"Use CREATE TEMPORARY PROCEDURE statement","OptionFeedback":""},{"Weight":0,"Text":"Store it in the tempdb database explicitly","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"How do you pass parameters by name when executing a stored procedure?","Hint":null,"Feedback":"Pass parameters by name using @ParameterName = Value syntax: EXEC GetCustomer @CustomerID = 100 @IncludeOrders = 1. This allows passing parameters in any order and skipping optional parameters with defaults. Positional parameters can also be used but require correct order.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699343-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use NAME keyword before each parameter","OptionFeedback":""},{"Weight":100,"Text":"Use @ParameterName = Value syntax","OptionFeedback":""},{"Weight":0,"Text":"Use ParameterName: Value syntax","OptionFeedback":""},{"Weight":0,"Text":"Named parameters are not supported in SQL Server","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"Why is SET NOCOUNT ON commonly used at the beginning of stored procedures?","Hint":null,"Feedback":"SET NOCOUNT ON prevents SQL Server from sending \u0027rows affected\u0027 messages after each statement. Example: CREATE PROCEDURE UpdateData AS SET NOCOUNT ON...statements. This reduces network traffic and improves performance especially in procedures with many statements. It is a best practice for stored procedures.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699345-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It prevents the procedure from returning any results","OptionFeedback":""},{"Weight":0,"Text":"It disables error messages","OptionFeedback":""},{"Weight":100,"Text":"It suppresses row count messages improving performance and reducing network traffic","OptionFeedback":""},{"Weight":0,"Text":"It prevents the procedure from modifying data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What is the best practice for checking if a stored procedure exists before creating it?","Hint":null,"Feedback":"In SQL Server 2016\u002B: DROP PROCEDURE IF EXISTS ProcName; CREATE PROCEDURE ProcName. In earlier versions: IF EXISTS (SELECT * FROM sys.objects WHERE type = \u0027P\u0027 AND name = \u0027ProcName\u0027) DROP PROCEDURE ProcName. This pattern ensures clean procedure creation in deployment scripts.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699348-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use DROP PROCEDURE IF EXISTS in SQL Server 2016\u002B or check sys.objects in earlier versions","OptionFeedback":""},{"Weight":0,"Text":"Use EXISTS clause in CREATE PROCEDURE statement","OptionFeedback":""},{"Weight":0,"Text":"Use TRY...CATCH around CREATE PROCEDURE","OptionFeedback":""},{"Weight":0,"Text":"SQL Server automatically handles existing procedures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What system stored procedure displays the definition of a stored procedure?","Hint":null,"Feedback":"sp_helptext displays the definition of a stored procedure: EXEC sp_helptext \u0027ProcedureName\u0027. Alternatively use OBJECT_DEFINITION(OBJECT_ID(\u0027ProcedureName\u0027)) or query sys.sql_modules. The definition shows the CREATE statement including all parameters and T-SQL code unless the procedure was created WITH ENCRYPTION.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699351-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"sp_show","OptionFeedback":""},{"Weight":100,"Text":"sp_helptext","OptionFeedback":""},{"Weight":0,"Text":"sp_viewproc","OptionFeedback":""},{"Weight":0,"Text":"sp_definition","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"What permission is required to execute a stored procedure?","Hint":null,"Feedback":"Users need EXECUTE permission on the procedure: GRANT EXECUTE ON ProcedureName TO UserName. Users do NOT need permissions on underlying tables if ownership chaining is intact. This is a security advantage - users can execute procedures without direct table access hiding complexity and enforcing business rules.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699354-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Users always have permission to execute any procedure","OptionFeedback":""},{"Weight":0,"Text":"SELECT permission on all tables used in the procedure","OptionFeedback":""},{"Weight":100,"Text":"EXECUTE permission on the specific procedure","OptionFeedback":""},{"Weight":0,"Text":"db_owner role membership","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What does the WITH ENCRYPTION option do when creating a stored procedure?","Hint":null,"Feedback":"WITH ENCRYPTION obfuscates the procedure definition in system tables: CREATE PROCEDURE GetData WITH ENCRYPTION AS... This prevents viewing the source code via sp_helptext or sys.sql_modules protecting intellectual property. However it also prevents you from viewing your own code so maintain source files separately.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699357-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"It obfuscates the procedure text making it unreadable in system catalogs","OptionFeedback":""},{"Weight":0,"Text":"It encrypts data returned by the procedure","OptionFeedback":""},{"Weight":0,"Text":"It requires encrypted connections to execute the procedure","OptionFeedback":""},{"Weight":0,"Text":"It compresses the procedure code to save space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What can cause a stored procedure execution plan to be recompiled?","Hint":null,"Feedback":"Recompilation occurs when: schema changes are made to objects the procedure references statistics are updated significantly WITH RECOMPILE is used or the plan is aged out of cache. Recompilation ensures optimal execution plans but can impact performance. SQL Server automatically recompiles when necessary.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699359-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Executing the procedure multiple times in succession","OptionFeedback":""},{"Weight":100,"Text":"Schema changes to underlying tables or statistics updates","OptionFeedback":""},{"Weight":0,"Text":"Using different parameter values","OptionFeedback":""},{"Weight":0,"Text":"Executing the procedure from different client applications","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"Can a stored procedure call another stored procedure in SQL Server?","Hint":null,"Feedback":"Stored procedures can call other procedures up to 32 nesting levels. Example: CREATE PROCEDURE Proc1 AS EXEC Proc2. Use @@NESTLEVEL to check current nesting depth. Nesting enables modular code reuse but excessive nesting can complicate debugging and maintenance.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699361-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"No procedures cannot call other procedures","OptionFeedback":""},{"Weight":100,"Text":"Yes procedures can be nested up to 32 levels deep","OptionFeedback":""},{"Weight":0,"Text":"Yes but only one level of nesting is allowed","OptionFeedback":""},{"Weight":0,"Text":"Yes but only system procedures can call user procedures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"How should transactions be managed within stored procedures?","Hint":null,"Feedback":"Manage transactions explicitly: BEGIN TRANSACTION...statements...COMMIT or ROLLBACK in CATCH. Check @@TRANCOUNT at procedure start to handle nested transactions properly. Use XACT_ABORT ON to automatically rollback on errors. Proper transaction management ensures data consistency and handles errors correctly.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699364-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Transactions are automatically created for every procedure","OptionFeedback":""},{"Weight":100,"Text":"Use BEGIN TRANSACTION COMMIT and ROLLBACK explicitly with proper error handling","OptionFeedback":""},{"Weight":0,"Text":"Transactions cannot be used within stored procedures","OptionFeedback":""},{"Weight":0,"Text":"Use AUTO_TRANSACTION option when creating the procedure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What is the purpose of RAISERROR in stored procedures?","Hint":null,"Feedback":"RAISERROR generates custom error messages: RAISERROR(\u0027Invalid customer ID\u0027 16 1). The severity (16) and state (1) parameters control error handling. Use THROW (SQL Server 2012\u002B) for simpler syntax: THROW 50000 \u0027Error message\u0027 1. These allow meaningful error messages to applications.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699367-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To generate custom error messages and return them to the calling application","OptionFeedback":""},{"Weight":0,"Text":"To automatically rollback all transactions","OptionFeedback":""},{"Weight":0,"Text":"To log errors to the Windows event log only","OptionFeedback":""},{"Weight":0,"Text":"To terminate the SQL Server service","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What is a best practice for improving stored procedure performance?","Hint":null,"Feedback":"Performance best practices include: use specific column lists instead of SELECT * create appropriate indexes avoid cursors when set-based operations work minimize network roundtrips use SET NOCOUNT ON and optimize queries within procedures. Monitor execution plans and use SQL Server Profiler to identify bottlenecks.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699369-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Add WITH RECOMPILE to every procedure","OptionFeedback":""},{"Weight":0,"Text":"Avoid using indexes on tables accessed by procedures","OptionFeedback":""},{"Weight":100,"Text":"Use appropriate indexes and avoid unnecessary operations like SELECT *","OptionFeedback":""},{"Weight":0,"Text":"Always use temporary tables instead of table variables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"How can the OUTPUT clause be used in stored procedures?","Hint":null,"Feedback":"The OUTPUT clause captures inserted deleted or updated rows: INSERT INTO Table OUTPUT INSERTED.* INTO @Results VALUES(...). This is useful for retrieving identity values capturing audit data or returning affected rows. Works with INSERT UPDATE DELETE and MERGE statements within procedures.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699371-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To capture affected rows from INSERT UPDATE or DELETE statements into table variables","OptionFeedback":""},{"Weight":0,"Text":"To define output parameters","OptionFeedback":""},{"Weight":0,"Text":"To print messages to the client","OptionFeedback":""},{"Weight":0,"Text":"To create procedure results sets","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What are table-valued parameters in SQL Server stored procedures?","Hint":null,"Feedback":"Table-valued parameters (TVPs) pass multiple rows to procedures. First create a table type: CREATE TYPE CustomerTableType AS TABLE (ID INT Name VARCHAR(50)). Then use it: CREATE PROCEDURE BulkInsert @Customers CustomerTableType READONLY. TVPs are read-only and efficient for bulk operations.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699373-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Parameters that return tables as results","OptionFeedback":""},{"Weight":100,"Text":"Parameters that accept table data types allowing multiple rows to be passed to a procedure","OptionFeedback":""},{"Weight":0,"Text":"Parameters stored in temporary tables","OptionFeedback":""},{"Weight":0,"Text":"Parameters that reference existing database tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"How can you view which objects a stored procedure depends on?","Hint":null,"Feedback":"View dependencies using: sys.dm_sql_referenced_entities(OBJECT_ID(\u0027ProcName\u0027) \u0027OBJECT\u0027) for objects referenced by the procedure or sys.dm_sql_referencing_entities(OBJECT_ID(\u0027TableName\u0027) \u0027OBJECT\u0027) for procedures using a table. sp_depends is deprecated. Dependencies help impact analysis during schema changes.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699376-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use sys.sql_dependencies or sys.dm_sql_referenced_entities","OptionFeedback":""},{"Weight":0,"Text":"Use sp_depends only","OptionFeedback":""},{"Weight":0,"Text":"Dependencies are not tracked for stored procedures","OptionFeedback":""},{"Weight":0,"Text":"Use SHOW DEPENDENCIES command","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is the purpose of the EXECUTE AS clause in stored procedure definitions?","Hint":null,"Feedback":"EXECUTE AS specifies the security context: CREATE PROCEDURE GetData WITH EXECUTE AS \u0027UserName\u0027 AS... Options include CALLER (default uses caller\u0027s permissions) SELF OWNER or a specific user. This enables controlled privilege elevation and consistent permissions regardless of who calls the procedure.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699378-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To specify which server to execute the procedure on","OptionFeedback":""},{"Weight":100,"Text":"To define the security context under which the procedure executes","OptionFeedback":""},{"Weight":0,"Text":"To determine the execution priority","OptionFeedback":""},{"Weight":0,"Text":"To specify the transaction isolation level","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"What is the primary risk of using dynamic SQL in stored procedures?","Hint":null,"Feedback":"Dynamic SQL constructed with string concatenation is vulnerable to SQL injection: EXEC(\u0027SELECT * FROM Users WHERE ID = \u0027 \u002B @ID) is dangerous. Always use sp_executesql with parameters: EXEC sp_executesql N\u0027SELECT * FROM Users WHERE ID = @ID\u0027 N\u0027@ID INT\u0027 @ID. Parameterization prevents injection attacks.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.969938-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Dynamic SQL is slower than static SQL","OptionFeedback":""},{"Weight":0,"Text":"Dynamic SQL cannot use parameters","OptionFeedback":""},{"Weight":100,"Text":"Dynamic SQL can introduce SQL injection vulnerabilities if not parameterized properly","OptionFeedback":""},{"Weight":0,"Text":"Dynamic SQL cannot access temporary tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"How can you view the execution plan for a stored procedure?","Hint":null,"Feedback":"View execution plans using: SET SHOWPLAN_XML ON before executing SET STATISTICS XML ON for actual plans or use SSMS Include Actual Execution Plan option. Query sys.dm_exec_query_plan and sys.dm_exec_procedure_stats for cached plans. Execution plans help optimize procedure performance.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699383-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use SET SHOWPLAN_XML ON or view actual execution plan in SSMS","OptionFeedback":""},{"Weight":0,"Text":"Use sp_showplan system procedure","OptionFeedback":""},{"Weight":0,"Text":"Execution plans are not available for stored procedures","OptionFeedback":""},{"Weight":0,"Text":"Use DISPLAY PLAN command","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"How do you capture the integer return value from a stored procedure?","Hint":null,"Feedback":"Capture return values by assigning EXEC to a variable: DECLARE @ReturnValue INT; EXEC @ReturnValue = MyProcedure; SELECT @ReturnValue. The procedure must use RETURN to send a value. Return values are limited to integers; use OUTPUT parameters for other data types or multiple values.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699386-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use OUTPUT parameter","OptionFeedback":""},{"Weight":100,"Text":"Assign the EXEC statement to a variable: DECLARE @Return INT; EXEC @Return = ProcName","OptionFeedback":""},{"Weight":0,"Text":"Use SELECT statement in the procedure","OptionFeedback":""},{"Weight":0,"Text":"Return values cannot be captured","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"When is it appropriate to use cursors in stored procedures?","Hint":null,"Feedback":"Cursors should be avoided when possible as they are slower than set-based operations. Use them only when: row-by-row processing is required complex iterative logic is needed or calling external procedures per row. First attempt set-based solutions. If cursors are necessary use FAST_FORWARD cursors for better performance.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699388-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use cursors for better performance","OptionFeedback":""},{"Weight":0,"Text":"Never use cursors under any circumstances","OptionFeedback":""},{"Weight":100,"Text":"Use cursors only when row-by-row processing is truly necessary and set-based operations won\u0027t work","OptionFeedback":""},{"Weight":0,"Text":"Use cursors for all SELECT statements","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"Why is it recommended to use schema-qualified object names in stored procedures?","Hint":null,"Feedback":"Always use schema-qualified names: SELECT * FROM dbo.Customers not SELECT * FROM Customers. This eliminates ambiguity improves plan cache efficiency (different schemas can have same table name) and slightly improves performance by skipping schema resolution. It is a T-SQL best practice.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699391-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To avoid plan cache pollution and ambiguity in object resolution","OptionFeedback":""},{"Weight":0,"Text":"To make procedures execute faster","OptionFeedback":""},{"Weight":0,"Text":"To reduce memory usage","OptionFeedback":""},{"Weight":0,"Text":"Schema qualification is not necessary in procedures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What does the @@ROWCOUNT function return in a stored procedure?","Hint":null,"Feedback":"@@ROWCOUNT returns rows affected by the last statement: UPDATE Table SET...; IF @@ROWCOUNT = 0 RAISERROR(\u0027No rows updated\u0027). It is reset after each statement so capture it immediately if needed: DECLARE @Rows INT = @@ROWCOUNT. Useful for validation and conditional logic based on operation results.","TopicTitle":"Quiz 3 - Stored Procedures","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.9699393-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The total number of rows in the table being queried","OptionFeedback":""},{"Weight":100,"Text":"The number of rows affected by the last T-SQL statement","OptionFeedback":""},{"Weight":0,"Text":"The number of times the procedure has been executed","OptionFeedback":""},{"Weight":0,"Text":"The number of parameters passed to the procedure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
