  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_5_(Week_5)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.0780063-05:00","NextQuestionNumber":35,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a database transaction?","Hint":null,"Feedback":"A transaction is a sequence of one or more SQL operations treated as a single unit. All operations must succeed (COMMIT) or all fail (ROLLBACK) ensuring data consistency. Example: transferring money requires debiting one account and crediting another - both must succeed or neither should occur.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.077992-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A backup operation that saves database state","OptionFeedback":""},{"Weight":100,"Text":"A logical unit of work containing one or more operations that must execute completely or not at all","OptionFeedback":""},{"Weight":0,"Text":"A stored procedure that modifies data","OptionFeedback":""},{"Weight":0,"Text":"A query that retrieves data from multiple tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What does the Atomicity property of ACID guarantee?","Hint":null,"Feedback":"Atomicity ensures transactions are indivisible units. Either all operations complete (COMMIT) or none do (ROLLBACK). If a transaction to transfer $100 debits Account A but fails before crediting Account B atomicity ensures the debit is rolled back preventing data inconsistency.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779932-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"All operations in a transaction complete successfully or none of them do","OptionFeedback":""},{"Weight":0,"Text":"Multiple users can access data simultaneously","OptionFeedback":""},{"Weight":0,"Text":"Data remains consistent across all database copies","OptionFeedback":""},{"Weight":0,"Text":"Committed changes survive system failures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What is the purpose of the BEGIN TRANSACTION statement in T-SQL?","Hint":null,"Feedback":"BEGIN TRANSACTION (or BEGIN TRAN) starts an explicit transaction. Example: BEGIN TRANSACTION UPDATE Accounts SET Balance = Balance - 100 WHERE ID = 1 UPDATE Accounts SET Balance = Balance \u002B 100 WHERE ID = 2 COMMIT TRANSACTION. Without explicit BEGIN SQL Server uses implicit transactions for each statement.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779934-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To automatically commit all changes","OptionFeedback":""},{"Weight":0,"Text":"To create a backup of the database","OptionFeedback":""},{"Weight":100,"Text":"To mark the starting point of an explicit transaction","OptionFeedback":""},{"Weight":0,"Text":"To lock all tables in the database","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What is the difference between COMMIT and ROLLBACK?","Hint":null,"Feedback":"COMMIT makes transaction changes permanent in the database. ROLLBACK undoes all changes since BEGIN TRANSACTION returning data to its previous state. Example: BEGIN TRAN UPDATE...IF @@ERROR \u003C\u003E 0 ROLLBACK ELSE COMMIT. Use COMMIT when operations succeed ROLLBACK when errors occur or validation fails.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779936-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"COMMIT cancels changes while ROLLBACK saves them","OptionFeedback":""},{"Weight":0,"Text":"Both perform the same operation","OptionFeedback":""},{"Weight":100,"Text":"COMMIT permanently saves transaction changes while ROLLBACK undoes them","OptionFeedback":""},{"Weight":0,"Text":"COMMIT creates a savepoint while ROLLBACK deletes it","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What does the Consistency property of ACID ensure?","Hint":null,"Feedback":"Consistency ensures transactions maintain all integrity constraints foreign keys check constraints triggers and business rules. The database must be in a valid state before and after the transaction. Example: a transaction violating a foreign key constraint will be rolled back maintaining consistency.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779938-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All database replicas have identical data","OptionFeedback":""},{"Weight":100,"Text":"Transactions move the database from one valid state to another maintaining all defined rules and constraints","OptionFeedback":""},{"Weight":0,"Text":"Data is distributed evenly across all tables","OptionFeedback":""},{"Weight":0,"Text":"Query results are always the same","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"What do transaction isolation levels control?","Hint":null,"Feedback":"Isolation levels determine how transactions see changes made by concurrent transactions balancing consistency and concurrency. Levels include: READ UNCOMMITTED (lowest isolation) READ COMMITTED (default) REPEATABLE READ and SERIALIZABLE (highest isolation). Higher isolation prevents anomalies but reduces concurrency.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779942-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"How concurrent transactions interact and what data anomalies are prevented","OptionFeedback":""},{"Weight":0,"Text":"How fast transactions execute","OptionFeedback":""},{"Weight":0,"Text":"How much memory transactions use","OptionFeedback":""},{"Weight":0,"Text":"Whether transactions can be rolled back","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What does the Durability property of ACID guarantee?","Hint":null,"Feedback":"Durability ensures committed transaction changes survive system failures. SQL Server achieves this through the transaction log which writes changes to disk before COMMIT completes. If the system crashes after COMMIT recovery processes use the log to restore committed changes ensuring no data loss.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779944-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Transactions execute quickly","OptionFeedback":""},{"Weight":0,"Text":"Data is never corrupted during transactions","OptionFeedback":""},{"Weight":100,"Text":"Once a transaction is committed changes persist even if the system crashes","OptionFeedback":""},{"Weight":0,"Text":"Transactions can always be rolled back","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is a risk of using READ UNCOMMITTED isolation level?","Hint":null,"Feedback":"READ UNCOMMITTED allows dirty reads - reading uncommitted changes from other transactions. Example: Transaction A updates a balance to 1000 Transaction B reads 1000 then Transaction A rolls back. Transaction B saw data that never existed. Use only when approximate results are acceptable like dashboards or reports.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779946-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Transactions will execute slower than other isolation levels","OptionFeedback":""},{"Weight":0,"Text":"Changes cannot be committed","OptionFeedback":""},{"Weight":100,"Text":"Dirty reads can occur where you read uncommitted data that might be rolled back","OptionFeedback":""},{"Weight":0,"Text":"All other transactions are blocked until completion","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What is the purpose of a shared lock (S lock)?","Hint":null,"Feedback":"Shared locks are acquired when reading data. Multiple transactions can hold shared locks simultaneously enabling concurrent reads. However shared locks prevent exclusive locks (modifications) until released. Example: SELECT statements acquire shared locks. With READ COMMITTED locks are released immediately after reading each row.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779948-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To allow multiple transactions to read data concurrently while preventing modifications","OptionFeedback":""},{"Weight":0,"Text":"To prevent any other transactions from accessing the data","OptionFeedback":""},{"Weight":0,"Text":"To allow one transaction to modify data","OptionFeedback":""},{"Weight":0,"Text":"To automatically commit transactions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What does an exclusive lock (X lock) prevent?","Hint":null,"Feedback":"Exclusive locks are acquired during UPDATE INSERT DELETE operations. They prevent other transactions from acquiring any locks (shared or exclusive) on the resource ensuring complete isolation during modifications. Exclusive locks are held until the transaction commits or rolls back.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779951-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It prevents only write operations by other transactions","OptionFeedback":""},{"Weight":0,"Text":"It prevents only read operations by other transactions","OptionFeedback":""},{"Weight":100,"Text":"It prevents both read and write operations by other transactions","OptionFeedback":""},{"Weight":0,"Text":"It prevents the transaction from committing","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What is a deadlock in database transactions?","Hint":null,"Feedback":"A deadlock occurs when transactions block each other. Example: Transaction 1 locks Table A then needs Table B. Transaction 2 locks Table B then needs Table A. Neither can proceed. SQL Server detects deadlocks chooses a victim (based on cost) and rolls it back raising error 1205. Minimize by accessing objects in consistent order.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779953-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"When a transaction takes too long to complete","OptionFeedback":""},{"Weight":100,"Text":"When two or more transactions are waiting for each other to release locks creating a circular dependency","OptionFeedback":""},{"Weight":0,"Text":"When all database connections are used","OptionFeedback":""},{"Weight":0,"Text":"When a transaction runs out of memory","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What does SET XACT_ABORT ON accomplish?","Hint":null,"Feedback":"SET XACT_ABORT ON causes SQL Server to automatically rollback the entire transaction on runtime errors. Example: BEGIN TRAN SET XACT_ABORT ON UPDATE...--if error occurs transaction auto-rolls back. Without it only the failing statement rolls back and transaction continues. Recommended for most applications to ensure consistency.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779955-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Automatically rolls back the entire transaction when a runtime error occurs","OptionFeedback":""},{"Weight":0,"Text":"Prevents transactions from being created","OptionFeedback":""},{"Weight":0,"Text":"Commits the transaction immediately on any error","OptionFeedback":""},{"Weight":0,"Text":"Disables error messages during transactions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What does the @@TRANCOUNT function return?","Hint":null,"Feedback":"@@TRANCOUNT returns the number of active BEGIN TRANSACTION statements. Starts at 0 increments with each BEGIN TRANSACTION decrements with COMMIT. Example: IF @@TRANCOUNT \u003E 0 ROLLBACK checks if a transaction is active. Useful in stored procedures to handle nested transactions and avoid committing outer transactions.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779957-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The number of rows affected by the transaction","OptionFeedback":""},{"Weight":100,"Text":"The nesting level of active transactions for the current connection","OptionFeedback":""},{"Weight":0,"Text":"The total number of transactions in the database","OptionFeedback":""},{"Weight":0,"Text":"The number of locks held by the current transaction","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What does SERIALIZABLE isolation level guarantee?","Hint":null,"Feedback":"SERIALIZABLE provides complete isolation by holding range locks preventing all concurrency anomalies including phantom reads. Example: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE BEGIN TRAN SELECT...no other transaction can insert/update/delete rows that would affect the query. Highest consistency but lowest concurrency and increased deadlock risk.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779958-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Fastest transaction execution","OptionFeedback":""},{"Weight":0,"Text":"Lowest memory usage","OptionFeedback":""},{"Weight":100,"Text":"Highest isolation preventing dirty reads non-repeatable reads and phantom reads","OptionFeedback":""},{"Weight":0,"Text":"Automatic deadlock prevention","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What is the purpose of SAVE TRANSACTION in T-SQL?","Hint":null,"Feedback":"SAVE TRANSACTION creates a savepoint: BEGIN TRAN UPDATE Table1... SAVE TRANSACTION SavePoint1 UPDATE Table2... IF @@ERROR \u003C\u003E 0 ROLLBACK TRANSACTION SavePoint1--rolls back only to savepoint COMMIT. This allows partial rollback without losing all work. Useful for complex transactions with multiple logical steps.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.077996-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To create a savepoint allowing partial rollback within a transaction","OptionFeedback":""},{"Weight":0,"Text":"To commit part of a transaction","OptionFeedback":""},{"Weight":0,"Text":"To backup the database during a transaction","OptionFeedback":""},{"Weight":0,"Text":"To increase transaction priority","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What is lock escalation?","Hint":null,"Feedback":"Lock escalation occurs when SQL Server converts many row or page locks into a table lock to reduce memory overhead. Typically happens at 5000 locks on a single table. Example: updating 10000 rows might escalate to a table lock. Can cause blocking but reduces lock management overhead. Use ROWLOCK hint or disable with ALTER TABLE to prevent.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779962-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"When locks are released automatically","OptionFeedback":""},{"Weight":100,"Text":"When SQL Server converts many fine-grained locks into fewer coarser-grained locks to reduce overhead","OptionFeedback":""},{"Weight":0,"Text":"When exclusive locks are converted to shared locks","OptionFeedback":""},{"Weight":0,"Text":"When transactions are prioritized based on importance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What does READ COMMITTED isolation level prevent?","Hint":null,"Feedback":"READ COMMITTED (default level) prevents dirty reads by only reading committed data. Shared locks are acquired but released immediately after reading. Allows non-repeatable reads (data can change between reads in same transaction) and phantom reads (new rows can appear). Balances consistency and concurrency for most applications.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779965-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Dirty reads by only allowing reads of committed data","OptionFeedback":""},{"Weight":0,"Text":"Non-repeatable reads and phantom reads","OptionFeedback":""},{"Weight":0,"Text":"All concurrency issues","OptionFeedback":""},{"Weight":0,"Text":"Lock escalation","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is the primary purpose of the transaction log?","Hint":null,"Feedback":"The transaction log records all database modifications in sequential order before they are applied to data files. Enables: crash recovery (replaying committed transactions) transaction rollback (undoing changes) database backup/restore and replication. SQL Server writes to the log before modifying data (write-ahead logging) ensuring durability.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779967-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To store backup copies of all data","OptionFeedback":""},{"Weight":0,"Text":"To improve query performance","OptionFeedback":""},{"Weight":100,"Text":"To record all transactions enabling recovery and ensuring durability","OptionFeedback":""},{"Weight":0,"Text":"To track user login activities","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"How does optimistic concurrency control differ from pessimistic locking?","Hint":null,"Feedback":"Pessimistic locking acquires locks early (during reads) preventing conflicts. Optimistic concurrency assumes conflicts are rare uses row versions or timestamps and checks for changes at update time. Example: read data with version check before update if version changed raise error. Optimistic better for low-conflict scenarios; pessimistic for high-conflict.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779969-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Optimistic locking is faster in all scenarios","OptionFeedback":""},{"Weight":100,"Text":"Optimistic assumes conflicts are rare and checks at update time while pessimistic locks resources preventively","OptionFeedback":""},{"Weight":0,"Text":"Optimistic requires more locks than pessimistic","OptionFeedback":""},{"Weight":0,"Text":"They are the same approach with different names","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What does REPEATABLE READ isolation level guarantee?","Hint":null,"Feedback":"REPEATABLE READ holds shared locks until transaction end ensuring repeated reads return the same values. Prevents dirty and non-repeatable reads but allows phantom reads (new rows can appear). Example: SET TRANSACTION ISOLATION LEVEL REPEATABLE READ BEGIN TRAN SELECT...--same query returns same rows even if others modify data. More restrictive than READ COMMITTED.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779971-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Prevents dirty reads and non-repeatable reads by holding shared locks until transaction ends","OptionFeedback":""},{"Weight":0,"Text":"Prevents only dirty reads","OptionFeedback":""},{"Weight":0,"Text":"Prevents all concurrency anomalies including phantom reads","OptionFeedback":""},{"Weight":0,"Text":"Allows unlimited concurrent access","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is the purpose of an update lock (U lock)?","Hint":null,"Feedback":"Update locks prevent conversion deadlocks. When reading data for update SQL Server acquires update lock (compatible with shared locks but not other update locks) then promotes to exclusive lock for modification. Prevents deadlock scenario where two transactions hold shared locks and both try to promote to exclusive. Only one transaction can hold an update lock.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779972-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To allow multiple transactions to update the same data","OptionFeedback":""},{"Weight":100,"Text":"To prevent deadlocks by transitioning between shared and exclusive locks during updates","OptionFeedback":""},{"Weight":0,"Text":"To improve update performance","OptionFeedback":""},{"Weight":0,"Text":"To validate data before updates","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"What is a best practice for transaction scope?","Hint":null,"Feedback":"Keep transactions short and focused. Long transactions hold locks longer causing blocking and increasing deadlock risk. Best practices: perform validation before BEGIN TRAN avoid user interaction within transactions minimize operations include only necessary statements and commit/rollback quickly. Example: do NOT BEGIN TRAN...wait for user input...COMMIT.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779974-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Make transactions as large as possible to reduce overhead","OptionFeedback":""},{"Weight":100,"Text":"Keep transactions as short as possible to minimize lock duration and blocking","OptionFeedback":""},{"Weight":0,"Text":"Always use SERIALIZABLE isolation for all transactions","OptionFeedback":""},{"Weight":0,"Text":"Never use explicit transactions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is a phantom read?","Hint":null,"Feedback":"Phantom reads occur when a query executed twice in a transaction returns different row sets because another transaction inserted/deleted rows. Example: SELECT COUNT(*) returns 100 another transaction inserts rows SELECT COUNT(*) returns 105. Prevented by SERIALIZABLE isolation using range locks. Lower isolation levels allow phantoms.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779976-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Reading data that has been deleted","OptionFeedback":""},{"Weight":0,"Text":"Reading uncommitted data from another transaction","OptionFeedback":""},{"Weight":100,"Text":"A transaction re-executes a query and finds new rows that meet the criteria","OptionFeedback":""},{"Weight":0,"Text":"Reading different values from the same row","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What is the difference between implicit and explicit transactions?","Hint":null,"Feedback":"SQL Server default mode is implicit (autocommit): each statement is automatically wrapped in a transaction. Explicit transactions use BEGIN TRANSACTION for manual control. Example: UPDATE Table...--implicit auto-commits vs BEGIN TRAN UPDATE Table... COMMIT--explicit. SET IMPLICIT_TRANSACTIONS ON changes to implicit mode like Oracle requiring explicit COMMIT.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779978-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Implicit transactions start automatically while explicit transactions require BEGIN TRANSACTION","OptionFeedback":""},{"Weight":0,"Text":"Implicit transactions cannot be rolled back","OptionFeedback":""},{"Weight":0,"Text":"Explicit transactions are faster than implicit","OptionFeedback":""},{"Weight":0,"Text":"They are the same","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What is a non-repeatable read?","Hint":null,"Feedback":"Non-repeatable reads occur when a transaction reads a row twice and gets different values because another transaction modified and committed the change between reads. Example: read balance as 100 another transaction updates to 200 read again as 200. Prevented by REPEATABLE READ or SERIALIZABLE isolation.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.077998-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A query that returns no results","OptionFeedback":""},{"Weight":100,"Text":"Reading the same row twice in a transaction and getting different values because another transaction modified it","OptionFeedback":""},{"Weight":0,"Text":"A query that cannot be executed","OptionFeedback":""},{"Weight":0,"Text":"Reading uncommitted data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What does the WITH (NOLOCK) table hint do?","Hint":null,"Feedback":"WITH (NOLOCK) or WITH (READUNCOMMITTED) allows dirty reads: SELECT * FROM Orders WITH (NOLOCK). Does not acquire shared locks and ignores exclusive locks reading uncommitted data. Can see rolled-back changes duplicates or missing rows. Use only for non-critical queries like reports where approximate data is acceptable.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779982-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Equivalent to READ UNCOMMITTED allowing dirty reads without acquiring shared locks","OptionFeedback":""},{"Weight":0,"Text":"Prevents all locks on the table","OptionFeedback":""},{"Weight":0,"Text":"Improves performance with no side effects","OptionFeedback":""},{"Weight":0,"Text":"Makes queries wait for locks to be released","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What is a distributed transaction?","Hint":null,"Feedback":"Distributed transactions span multiple databases or servers coordinated by the Distributed Transaction Coordinator (MSDTC). Uses two-phase commit: prepare phase (all participants ready) then commit phase (all commit together). Example: BEGIN DISTRIBUTED TRANSACTION UPDATE DB1.Table... UPDATE DB2.Table... COMMIT. More complex and slower than local transactions.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779984-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A transaction spread across multiple stored procedures","OptionFeedback":""},{"Weight":100,"Text":"A transaction that spans multiple databases or servers requiring two-phase commit","OptionFeedback":""},{"Weight":0,"Text":"A transaction with multiple BEGIN statements","OptionFeedback":""},{"Weight":0,"Text":"A transaction that uses parallel processing","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"What does SET LOCK_TIMEOUT control?","Hint":null,"Feedback":"SET LOCK_TIMEOUT specifies milliseconds to wait for locks: SET LOCK_TIMEOUT 5000--wait 5 seconds. If lock is not acquired raises error 1222. Default -1 means wait indefinitely. Useful to prevent applications from hanging on blocked queries. Example: SET LOCK_TIMEOUT 2000 SELECT...--returns error if blocked \u003E 2 seconds.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779986-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"How long locks are held by a transaction","OptionFeedback":""},{"Weight":100,"Text":"How long a statement waits for a lock before raising an error","OptionFeedback":""},{"Weight":0,"Text":"When lock escalation occurs","OptionFeedback":""},{"Weight":0,"Text":"The maximum transaction duration","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"How do you set the transaction isolation level in T-SQL?","Hint":null,"Feedback":"Set isolation level using: SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED/READ COMMITTED/REPEATABLE READ/SERIALIZABLE/SNAPSHOT. Applies to all subsequent transactions in the session until changed. Example: SET TRANSACTION ISOLATION LEVEL SERIALIZABLE BEGIN TRAN... Can also use table hints: SELECT * FROM Table WITH (READUNCOMMITTED).","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779987-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use SET TRANSACTION ISOLATION LEVEL followed by the level name","OptionFeedback":""},{"Weight":0,"Text":"Use ALTER TRANSACTION ISOLATION","OptionFeedback":""},{"Weight":0,"Text":"Use BEGIN TRANSACTION WITH ISOLATION","OptionFeedback":""},{"Weight":0,"Text":"Isolation level cannot be changed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"Which strategy helps prevent deadlocks?","Hint":null,"Feedback":"Deadlock prevention strategies: access tables in consistent order keep transactions short use appropriate isolation levels use ROWLOCK hints avoid user interaction in transactions and use TRY-CATCH to retry deadlock victims. Example: always access Customers then Orders never Orders then Customers. Consistent ordering prevents circular wait conditions.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779989-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Use SERIALIZABLE isolation for all transactions","OptionFeedback":""},{"Weight":0,"Text":"Hold locks as long as possible","OptionFeedback":""},{"Weight":100,"Text":"Access objects in the same order across all transactions","OptionFeedback":""},{"Weight":0,"Text":"Disable all constraints","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"How does SNAPSHOT isolation level work?","Hint":null,"Feedback":"SNAPSHOT isolation uses row versioning. Each transaction sees a consistent snapshot of data as it existed at transaction start. Versions stored in tempdb. No shared locks acquired reducing blocking. Must be enabled: ALTER DATABASE SET ALLOW_SNAPSHOT_ISOLATION ON. Writers do not block readers readers do not block writers. Increases tempdb usage.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779991-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It takes a backup of the database before each transaction","OptionFeedback":""},{"Weight":100,"Text":"It uses row versioning in tempdb to provide consistent reads without blocking","OptionFeedback":""},{"Weight":0,"Text":"It prevents all modifications during reads","OptionFeedback":""},{"Weight":0,"Text":"It is the same as READ UNCOMMITTED","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"Which locks are compatible with each other?","Hint":null,"Feedback":"Lock compatibility: Shared (S) locks are compatible with other shared locks allowing concurrent reads. Shared locks are NOT compatible with exclusive (X) or update (U) locks. Exclusive locks are incompatible with all lock types. Update locks prevent other update locks but allow shared locks. This enables concurrent reads while preventing conflicting writes.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779993-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Shared locks are compatible with other shared locks","OptionFeedback":""},{"Weight":0,"Text":"Exclusive locks are compatible with shared locks","OptionFeedback":""},{"Weight":0,"Text":"Exclusive locks are compatible with other exclusive locks","OptionFeedback":""},{"Weight":0,"Text":"Update locks are compatible with exclusive locks","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"What is the recommended error handling pattern for transactions?","Hint":null,"Feedback":"Best practice: BEGIN TRY BEGIN TRANSACTION...operations...COMMIT END TRY BEGIN CATCH IF @@TRANCOUNT \u003E 0 ROLLBACK TRANSACTION--error handling END CATCH. Always check @@TRANCOUNT before rollback to handle nested transactions. Use THROW to re-raise errors. This ensures proper cleanup and prevents orphaned transactions.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779995-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Never use error handling in transactions","OptionFeedback":""},{"Weight":100,"Text":"Use TRY-CATCH with ROLLBACK in CATCH and check @@TRANCOUNT","OptionFeedback":""},{"Weight":0,"Text":"Let errors automatically rollback transactions","OptionFeedback":""},{"Weight":0,"Text":"Use RAISERROR instead of ROLLBACK","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"How does READ COMMITTED SNAPSHOT isolation differ from standard READ COMMITTED?","Hint":null,"Feedback":"READ COMMITTED SNAPSHOT (RCSI) uses row versioning instead of shared locks. Enabled with: ALTER DATABASE SET READ_COMMITTED_SNAPSHOT ON. Provides same consistency as READ COMMITTED but with better concurrency - readers do not block writers and vice versa.","TopicTitle":"Quiz 5 - Transactions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0779998-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"It uses row versioning instead of shared locks providing better concurrency","OptionFeedback":""},{"Weight":0,"Text":"It provides lower isolation than READ COMMITTED","OptionFeedback":""},{"Weight":0,"Text":"It requires explicit BEGIN TRANSACTION statements","OptionFeedback":""},{"Weight":0,"Text":"It prevents all concurrency anomalies","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
