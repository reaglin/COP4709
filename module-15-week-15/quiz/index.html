  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_15_(Week_15)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.6127856-05:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a Common Table Expression (CTE) in SQL?","Hint":null,"Feedback":"A CTE (Common Table Expression) is a temporary named result set defined with the WITH clause. Example: WITH SalesCTE AS (SELECT * FROM Sales WHERE Year = 2024) SELECT * FROM SalesCTE. Benefits: improves readability enables recursion simplifies complex queries and can be referenced multiple times. Exists only during query execution. More readable than nested subqueries.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127688-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A permanent table stored in the database","OptionFeedback":""},{"Weight":100,"Text":"A temporary named result set defined using WITH clause that exists only for the duration of a query","OptionFeedback":""},{"Weight":0,"Text":"A type of stored procedure","OptionFeedback":""},{"Weight":0,"Text":"A database backup mechanism","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What does the ROW_NUMBER() window function do?","Hint":null,"Feedback":"ROW_NUMBER() assigns unique sequential numbers starting at 1. Example: ROW_NUMBER() OVER (PARTITION BY CategoryID ORDER BY Price DESC) numbers products within each category by price. Always unique even with ties. Use for: pagination top N per group removing duplicates. Differs from RANK (gaps with ties) and DENSE_RANK (no gaps). Essential for ranking and ordering tasks.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127698-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Assigns a unique sequential integer to each row within a partition","OptionFeedback":""},{"Weight":0,"Text":"Counts the total number of rows in the table","OptionFeedback":""},{"Weight":0,"Text":"Returns the primary key value","OptionFeedback":""},{"Weight":0,"Text":"Calculates the sum of a column","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"How does RANK() differ from DENSE_RANK()?","Hint":null,"Feedback":"RANK() leaves gaps after ties: 1 2 2 4 5. DENSE_RANK() has no gaps: 1 2 2 3 4. Example: three students tie for 2nd place. RANK: 1 2 2 2 5. DENSE_RANK: 1 2 2 2 3. Use RANK for: traditional ranking (Olympics). Use DENSE_RANK for: continuous ranking grade levels. Both handle ties identically but differ in subsequent numbering. Choose based on desired ranking behavior.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127704-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are identical functions","OptionFeedback":""},{"Weight":100,"Text":"RANK() skips numbers after ties while DENSE_RANK() continues sequentially without gaps","OptionFeedback":""},{"Weight":0,"Text":"RANK() is faster than DENSE_RANK()","OptionFeedback":""},{"Weight":0,"Text":"DENSE_RANK() only works with numeric data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What does the LEAD() window function do?","Hint":null,"Feedback":"LEAD() accesses subsequent rows. Example: LEAD(Price, 1) OVER (ORDER BY Date) gets next row\u0027s price. Parameters: column offset (default 1) default value. Use for: comparing consecutive rows calculating differences trend analysis. Compare current month to next month: LEAD(Sales, 1) - Sales. Eliminates self-joins for sequential comparisons. Paired with LAG() which looks backward.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127707-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Returns the first row in the result set","OptionFeedback":""},{"Weight":100,"Text":"Accesses data from the next row in the result set without a self-join","OptionFeedback":""},{"Weight":0,"Text":"Sorts the data in descending order","OptionFeedback":""},{"Weight":0,"Text":"Calculates the average of following rows","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What is the LAG() function used for?","Hint":null,"Feedback":"LAG() accesses previous rows without self-joins. Example: LAG(Sales, 1, 0) OVER (ORDER BY Month) gets prior month\u0027s sales defaulting to 0 if none. Use for: month-over-month comparison calculating deltas previous values. Calculate change: Sales - LAG(Sales, 1) OVER (ORDER BY Date). Parameters: column offset default. Essential for: time-series analysis trend calculations sequential comparisons. Opposite of LEAD().","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127709-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Accessing data from a previous row in the result set","OptionFeedback":""},{"Weight":0,"Text":"Delaying query execution","OptionFeedback":""},{"Weight":0,"Text":"Creating database backups","OptionFeedback":""},{"Weight":0,"Text":"Sorting data alphabetically","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"What makes a CTE recursive?","Hint":null,"Feedback":"Recursive CTE has anchor member (base case) and recursive member (self-reference). Example: WITH EmployeeHierarchy AS (SELECT * FROM Employees WHERE ManagerID IS NULL UNION ALL SELECT e.* FROM Employees e JOIN EmployeeHierarchy eh ON e.ManagerID = eh.EmployeeID) SELECT * FROM EmployeeHierarchy. Use for: organizational charts bill of materials path finding hierarchies. Must have termination condition. Powerful for tree/graph structures.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127721-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"CTEs are never recursive","OptionFeedback":""},{"Weight":100,"Text":"The CTE references itself enabling hierarchical queries like organizational charts","OptionFeedback":""},{"Weight":0,"Text":"It uses multiple WITH clauses","OptionFeedback":""},{"Weight":0,"Text":"It contains a loop statement","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What does the PARTITION BY clause do in window functions?","Hint":null,"Feedback":"PARTITION BY divides data into groups for window function calculations. Example: SUM(Sales) OVER (PARTITION BY Region) calculates regional totals while showing all rows. Without PARTITION BY: function applies to entire result set. With PARTITION BY: resets for each partition. Use for: per-group calculations subtotals ranking within categories. Compare to GROUP BY: window functions keep all rows GROUP BY collapses them.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127723-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Divides the result set into partitions where window functions operate independently","OptionFeedback":""},{"Weight":0,"Text":"Physically splits the table into separate files","OptionFeedback":""},{"Weight":0,"Text":"Creates database partitions for performance","OptionFeedback":""},{"Weight":0,"Text":"Filters rows from the result set","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What does the NTILE() function do?","Hint":null,"Feedback":"NTILE(n) distributes rows into n groups. Example: NTILE(4) OVER (ORDER BY Sales) divides customers into quartiles. Groups numbered 1 to n. If rows don\u0027t divide evenly first groups get extra row. Use for: quartiles deciles ABC analysis customer segmentation. NTILE(100) creates percentiles. NTILE(4) with 100 rows creates groups of 25. Useful for: statistical analysis performance tiers portfolio allocation.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127727-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Counts the number of NULL values","OptionFeedback":""},{"Weight":100,"Text":"Divides rows into a specified number of roughly equal groups or buckets","OptionFeedback":""},{"Weight":0,"Text":"Calculates percentages","OptionFeedback":""},{"Weight":0,"Text":"Removes duplicate rows","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What do FIRST_VALUE() and LAST_VALUE() functions return?","Hint":null,"Feedback":"FIRST_VALUE() returns first value in window. LAST_VALUE() returns last value. Example: FIRST_VALUE(Price) OVER (PARTITION BY Product ORDER BY Date) shows initial price. Important: define frame with ROWS BETWEEN or get unexpected results. Default frame: RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. Use for: comparing to baseline showing original values tracking changes. Often need: ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING for LAST_VALUE.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127729-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The first and last values within a window frame respectively","OptionFeedback":""},{"Weight":0,"Text":"The minimum and maximum values","OptionFeedback":""},{"Weight":0,"Text":"The oldest and newest timestamps","OptionFeedback":""},{"Weight":0,"Text":"Primary and foreign key values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What is a window frame in SQL window functions?","Hint":null,"Feedback":"Window frame specifies subset of partition rows for function. Defined with ROWS or RANGE: ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING (3-row window) UNBOUNDED PRECEDING (all rows before) CURRENT ROW. Example: AVG(Sales) OVER (ORDER BY Date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) calculates 3-day moving average. Default varies by function. Critical for: running totals moving averages cumulative calculations. Understanding frames essential for correct window function results.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127732-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A graphical user interface element","OptionFeedback":""},{"Weight":100,"Text":"A subset of rows within a partition that the window function operates on","OptionFeedback":""},{"Weight":0,"Text":"A type of database index","OptionFeedback":""},{"Weight":0,"Text":"A transaction boundary","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What does the MERGE statement do?","Hint":null,"Feedback":"MERGE performs conditional DML operations (INSERT/UPDATE/DELETE) based on match conditions. Example: MERGE INTO Target USING Source ON Target.ID = Source.ID WHEN MATCHED THEN UPDATE WHEN NOT MATCHED THEN INSERT. Use for: synchronizing tables ETL operations data warehousing. Benefits: atomic operation single pass efficient. Alternative to: IF EXISTS UPDATE ELSE INSERT pattern. Essential for: maintaining dimension tables data integration. Also called UPSERT.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127734-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Performs INSERT UPDATE or DELETE operations in a single statement based on conditions","OptionFeedback":""},{"Weight":0,"Text":"Combines two tables into one permanently","OptionFeedback":""},{"Weight":0,"Text":"Creates database backups","OptionFeedback":""},{"Weight":0,"Text":"Joins tables for queries","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What does the PIVOT operator do?","Hint":null,"Feedback":"PIVOT rotates rows to columns. Example: SELECT * FROM (SELECT Product Quarter Sales FROM Sales) AS SourceTable PIVOT (SUM(Sales) FOR Quarter IN ([Q1], [Q2], [Q3], [Q4])) AS PivotTable. Transforms vertical data to horizontal. Use for: crosstab reports matrix displays comparing across categories. Requires: aggregate function column list. Opposite: UNPIVOT. Excel-like pivot tables in SQL. Useful for: reporting dashboards multi-dimensional analysis.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127737-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Rotates the database physically","OptionFeedback":""},{"Weight":100,"Text":"Transforms rows into columns creating a crosstab report","OptionFeedback":""},{"Weight":0,"Text":"Sorts data in ascending order","OptionFeedback":""},{"Weight":0,"Text":"Deletes duplicate records","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is the purpose of the UNPIVOT operator?","Hint":null,"Feedback":"UNPIVOT transforms columns to rows. Example: table with Jan Feb Mar columns becomes Month Value rows. Syntax: UNPIVOT (Sales FOR Month IN ([Jan], [Feb], [Mar])). Use for: normalizing data importing spreadsheets denormalizing wide tables. Opposite of PIVOT. Common when: loading Excel data transforming reports to transactional format. Essential for: data transformation ETL processes. Makes horizontal data vertical.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127739-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Transforms columns into rows normalizing wide data into tall format","OptionFeedback":""},{"Weight":0,"Text":"Creates database indexes","OptionFeedback":""},{"Weight":0,"Text":"Encrypts column data","OptionFeedback":""},{"Weight":0,"Text":"UNPIVOT doesn\u0027t exist in SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What does CROSS APPLY do in SQL Server?","Hint":null,"Feedback":"CROSS APPLY invokes table-valued function for each row like INNER JOIN. Returns only rows where function returns results. Example: SELECT * FROM Orders CROSS APPLY dbo.GetOrderItems(Orders.OrderID). Similar to INNER JOIN but: works with functions passes outer row values enables correlated logic. Use for: splitting strings complex per-row logic calling functions. OUTER APPLY like LEFT JOIN includes rows even when function returns nothing.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127743-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Applies encryption to columns","OptionFeedback":""},{"Weight":100,"Text":"Invokes a table-valued function for each row returning only rows that produce results","OptionFeedback":""},{"Weight":0,"Text":"Creates cross-database queries","OptionFeedback":""},{"Weight":0,"Text":"Performs cross joins","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"How does OUTER APPLY differ from CROSS APPLY?","Hint":null,"Feedback":"OUTER APPLY like LEFT JOIN keeps all left table rows. CROSS APPLY like INNER JOIN only keeps matching rows. Example: SELECT * FROM Customers OUTER APPLY dbo.GetRecentOrders(CustomerID) returns all customers even those without orders (NULLs for order columns). Use when: need all outer rows want to call function but preserve rows with no results. CROSS APPLY: has results only. OUTER APPLY: all rows with NULLs when no results.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127745-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"OUTER APPLY includes left table rows even when the function returns no results like LEFT JOIN","OptionFeedback":""},{"Weight":0,"Text":"OUTER APPLY is faster than CROSS APPLY","OptionFeedback":""},{"Weight":0,"Text":"They are identical","OptionFeedback":""},{"Weight":0,"Text":"OUTER APPLY only works with outer tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What does STRING_AGG() do in SQL Server?","Hint":null,"Feedback":"STRING_AGG concatenates values from multiple rows. Example: SELECT CustomerID, STRING_AGG(ProductName, \u0027, \u0027) AS Products FROM Orders GROUP BY CustomerID. Introduced SQL Server 2017. Parameters: column separator optional ORDER BY. Replaces: complex FOR XML PATH workarounds. Use for: comma-separated lists aggregating tags concatenating names. MySQL: GROUP_CONCAT. PostgreSQL: STRING_AGG. Modern elegant solution for string aggregation.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127747-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Calculates string length","OptionFeedback":""},{"Weight":100,"Text":"Concatenates string values with a specified separator into a single string","OptionFeedback":""},{"Weight":0,"Text":"Splits strings into arrays","OptionFeedback":""},{"Weight":0,"Text":"Converts strings to uppercase","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What is the purpose of the OVER clause in SQL?","Hint":null,"Feedback":"OVER clause defines window for window functions. Components: PARTITION BY (divide into groups) ORDER BY (sequence within partition) ROWS/RANGE (frame specification). Example: SUM(Amount) OVER (PARTITION BY Customer ORDER BY Date ROWS UNBOUNDED PRECEDING) running total per customer. Required for: ROW_NUMBER RANK LAG LEAD all window functions. Empty OVER() operates on entire result set. Understanding OVER essential for: analytics ranking running calculations.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.612775-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Defines the window of rows for window functions to operate on","OptionFeedback":""},{"Weight":0,"Text":"Overrides default table settings","OptionFeedback":""},{"Weight":0,"Text":"Creates table overrides","OptionFeedback":""},{"Weight":0,"Text":"OVER is not a SQL clause","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"Which window function approach calculates a running total?","Hint":null,"Feedback":"Running total: SUM(Amount) OVER (ORDER BY Date ROWS UNBOUNDED PRECEDING). ROWS UNBOUNDED PRECEDING includes all rows from start to current. Without frame specification default is RANGE which can give incorrect results with ties. Example: shows cumulative sales from year start. Use for: year-to-date totals cumulative metrics progressive totals. Alternative without frame: SUM(Amount) OVER (ORDER BY Date) but frame explicit and clearer. Essential pattern for financial reporting.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127753-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"ROW_NUMBER() OVER (ORDER BY Date)","OptionFeedback":""},{"Weight":100,"Text":"SUM(Amount) OVER (ORDER BY Date ROWS UNBOUNDED PRECEDING)","OptionFeedback":""},{"Weight":0,"Text":"COUNT(*) OVER (PARTITION BY Date)","OptionFeedback":""},{"Weight":0,"Text":"RANK() OVER (ORDER BY Amount)","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"What does PERCENT_RANK() return?","Hint":null,"Feedback":"PERCENT_RANK() returns relative position: 0 for first row 1 for last. Formula: (rank - 1) / (total rows - 1). Example: PERCENT_RANK() OVER (ORDER BY Score) shows where student ranks as decimal. 0.75 means top 75%. Use for: percentile ranking relative comparisons understanding distribution. Similar to: CUME_DIST but different calculation. Multiply by 100 for percentage. Useful for: standardized scoring performance analysis statistical analysis.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127756-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"The relative rank of a row as a percentage from 0 to 1","OptionFeedback":""},{"Weight":0,"Text":"The actual percentage value in a column","OptionFeedback":""},{"Weight":0,"Text":"The count of rows","OptionFeedback":""},{"Weight":0,"Text":"The average of all values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What does CUME_DIST() calculate?","Hint":null,"Feedback":"CUME_DIST() returns cumulative distribution: percentage of values \u003C= current value. Formula: (number of rows \u003C= current) / (total rows). Example: CUME_DIST() OVER (ORDER BY Salary) shows what percent of salaries are at or below current. Returns 0 to 1. Use for: percentile analysis understanding data distribution comparing relative position. Different from PERCENT_RANK: CUME_DIST counts rows PERCENT_RANK shows rank position. Useful for statistical analysis.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127758-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The distance between values","OptionFeedback":""},{"Weight":100,"Text":"The cumulative distribution of values as a percentage of total rows","OptionFeedback":""},{"Weight":0,"Text":"The sum of all values","OptionFeedback":""},{"Weight":0,"Text":"The distribution of NULL values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What does the IIF() function do?","Hint":null,"Feedback":"IIF(condition, true_value, false_value) simplified conditional. Example: IIF(Quantity \u003E 100, \u0027High\u0027, \u0027Low\u0027). Equivalent to: CASE WHEN Quantity \u003E 100 THEN \u0027High\u0027 ELSE \u0027Low\u0027 END. Introduced SQL Server 2012. Benefits: concise readable for simple conditions. Limitations: only two outcomes nested IIF harder to read than CASE. Use for: simple binary decisions flags transformations. For complex logic: use CASE. IIF syntactic sugar for common pattern.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127761-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Returns one of two values based on a Boolean expression compact alternative to CASE","OptionFeedback":""},{"Weight":0,"Text":"Checks if values are identical","OptionFeedback":""},{"Weight":0,"Text":"Performs integer division","OptionFeedback":""},{"Weight":0,"Text":"IIF is not a SQL function","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"What does the CHOOSE() function do?","Hint":null,"Feedback":"CHOOSE(index, value1, value2, ...) returns value at index position (1-based). Example: CHOOSE(Month, \u0027Jan\u0027, \u0027Feb\u0027, \u0027Mar\u0027) returns \u0027Jan\u0027 if Month=1. Returns NULL if index out of range. Use for: month names day names simple lookups. Alternative to: CASE statement lookup tables. Limitations: static values evaluated always. Better for small fixed lists. For dynamic or large sets: lookup table better. Convenient for simple mappings.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127763-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Selects random rows from a table","OptionFeedback":""},{"Weight":100,"Text":"Returns the item at the specified index from a list of values","OptionFeedback":""},{"Weight":0,"Text":"Chooses the maximum value","OptionFeedback":""},{"Weight":0,"Text":"Selects columns to display","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is the FORMAT() function used for?","Hint":null,"Feedback":"FORMAT(value, format_string, culture) formats values. Examples: FORMAT(GETDATE(), \u0027yyyy-MM-dd\u0027) date formatting FORMAT(1234.56, \u0027C\u0027, \u0027en-US\u0027) currency $1,234.56 FORMAT(0.123, \u0027P\u0027) percentage 12.30%. Uses .NET format strings. Introduced SQL Server 2012. Warning: slower than CONVERT/CAST use for display only not in WHERE/JOIN. Benefits: flexible culture-aware rich formatting. Use in: SELECT for display reports. Avoid in: WHERE clauses large datasets.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127766-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Formatting dates numbers and values using .NET format strings","OptionFeedback":""},{"Weight":0,"Text":"Formatting table structure","OptionFeedback":""},{"Weight":0,"Text":"Creating formatted reports","OptionFeedback":""},{"Weight":0,"Text":"FORMAT is not available in SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"How does TRY_CONVERT differ from CONVERT?","Hint":null,"Feedback":"TRY_CONVERT returns NULL instead of error on failure. Example: TRY_CONVERT(INT, \u0027abc\u0027) returns NULL not error. CONVERT(\u0027abc\u0027) raises error. Family of TRY functions: TRY_CAST TRY_PARSE TRY_CONVERT. Use when: data quality uncertain conversion may fail want to continue processing. Example: TRY_CONVERT(DATE, DateColumn) finds invalid dates (NULLs). Better than: CASE with ISDATE complex error handling. Introduced SQL Server 2012. Cleaner safer conversions.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127768-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"TRY_CONVERT returns NULL on conversion failure instead of raising an error","OptionFeedback":""},{"Weight":0,"Text":"TRY_CONVERT is faster than CONVERT","OptionFeedback":""},{"Weight":0,"Text":"They are identical functions","OptionFeedback":""},{"Weight":0,"Text":"TRY_CONVERT only works with integers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What are OFFSET and FETCH used for?","Hint":null,"Feedback":"OFFSET-FETCH enables pagination. Example: ORDER BY CustomerID OFFSET 20 ROWS FETCH NEXT 10 ROWS ONLY skips 20 rows returns next 10 (page 3 of 10 per page). Requires ORDER BY. Standard SQL syntax (vs TOP). Use for: web page pagination API results large result sets. Calculate: OFFSET = (PageNumber - 1) * PageSize FETCH = PageSize. Better than: TOP/ROW_NUMBER for pagination. SQL Server 2012\u002B. Standard clean pagination.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.612777-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Adjusting date calculations","OptionFeedback":""},{"Weight":100,"Text":"Implementing pagination by skipping rows and returning a limited result set","OptionFeedback":""},{"Weight":0,"Text":"Fetching data from remote servers","OptionFeedback":""},{"Weight":0,"Text":"Offsetting time zones","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What does GROUPING SETS allow you to do?","Hint":null,"Feedback":"GROUPING SETS defines multiple groupings in one query. Example: GROUP BY GROUPING SETS ((Year, Quarter), (Year), ()) produces: Year\u002BQuarter subtotals Year totals Grand total. Alternative to: UNION of multiple GROUP BY queries. More efficient: single scan vs multiple. Related: ROLLUP (hierarchical) CUBE (all combinations) GROUPING SETS (specific combinations). Use for: custom subtotals flexible reporting. Benefits: performance clarity. Essential for complex aggregation reporting.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127772-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Specify multiple grouping combinations in one query without UNION","OptionFeedback":""},{"Weight":0,"Text":"Create database schemas","OptionFeedback":""},{"Weight":0,"Text":"Group only numeric data","OptionFeedback":""},{"Weight":0,"Text":"GROUPING SETS is not valid SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What does GROUP BY ROLLUP generate?","Hint":null,"Feedback":"ROLLUP generates hierarchical subtotals. Example: GROUP BY ROLLUP(Year, Quarter, Month) produces: Year\u002BQuarter\u002BMonth Year\u002BQuarter Year Grand total. Hierarchy right-to-left. Use for: financial reports hierarchical totals drill-down reporting. NULLs indicate subtotal rows use GROUPING() to detect. Alternative: manual UNION queries. Benefits: cleaner code single scan. Excel-like subtotals. Essential for hierarchical reporting.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127774-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Random groupings","OptionFeedback":""},{"Weight":100,"Text":"Hierarchical subtotals and grand total from right to left","OptionFeedback":""},{"Weight":0,"Text":"Detailed row-level data","OptionFeedback":""},{"Weight":0,"Text":"ROLLUP removes grouping","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"How does GROUP BY CUBE differ from ROLLUP?","Hint":null,"Feedback":"CUBE generates all grouping combinations. Example: GROUP BY CUBE(Region, Product) produces: Region\u002BProduct Region only Product only Grand total (4 groupings). ROLLUP: hierarchical only. CUBE: all combinations. With 3 columns: CUBE=8 groupings ROLLUP=4. Use CUBE: multidimensional analysis cross-tabulation. Use ROLLUP: hierarchical reports. CUBE expensive with many columns (2^n groupings). GROUPING SETS: custom middle ground.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127777-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"CUBE generates all possible combinations of groupings while ROLLUP creates hierarchical totals","OptionFeedback":""},{"Weight":0,"Text":"CUBE is faster than ROLLUP","OptionFeedback":""},{"Weight":0,"Text":"They are identical","OptionFeedback":""},{"Weight":0,"Text":"CUBE only works with three columns","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is the GROUPING() function used for?","Hint":null,"Feedback":"GROUPING(column) returns 1 if column aggregated (subtotal) 0 if regular group. Example: SELECT Year, GROUPING(Year) AS IsYearTotal, SUM(Sales) FROM Sales GROUP BY ROLLUP(Year). Use to: distinguish real NULLs from aggregation NULLs customize subtotal labels create hierarchy indicators. Essential with ROLLUP/CUBE. Example: CASE WHEN GROUPING(Year)=1 THEN \u0027All Years\u0027 ELSE Year END. Makes subtotal rows identifiable and customizable.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127778-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Identifying whether a column is aggregated in ROLLUP CUBE or GROUPING SETS returning 1 for subtotal rows","OptionFeedback":""},{"Weight":0,"Text":"Creating new groups","OptionFeedback":""},{"Weight":0,"Text":"Counting groups","OptionFeedback":""},{"Weight":0,"Text":"Grouping is not a SQL function","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"When is a CROSS JOIN useful?","Hint":null,"Feedback":"CROSS JOIN produces Cartesian product: every row from first table with every row from second. Example: Colors CROSS JOIN Sizes generates all color-size combinations. Use for: generating combinations calendar/date tables test data product variants. Warning: large results 1000x1000=1000000 rows. Usually unintentional in production queries. Intentional uses: dimension tables combinations sequences. No ON clause needed. Powerful for generating reference data.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127781-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"CROSS JOIN should always be avoided","OptionFeedback":""},{"Weight":100,"Text":"Generating Cartesian products for combinations like calendar tables or test data","OptionFeedback":""},{"Weight":0,"Text":"Joining tables with foreign keys","OptionFeedback":""},{"Weight":0,"Text":"CROSS JOIN is faster than INNER JOIN","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What are SEQUENCE objects in SQL Server?","Hint":null,"Feedback":"SEQUENCE generates sequential numbers. Example: CREATE SEQUENCE OrderNumber START WITH 1000 INCREMENT BY 1. Use: NEXT VALUE FOR OrderNumber. Benefits over IDENTITY: shared across tables controllable restart/increment can get value before INSERT. Use for: order numbers invoice numbers custom IDs multi-table sequences. ALTER SEQUENCE to restart. More flexible than IDENTITY but requires management. SQL Server 2012\u002B. Essential for complex numbering requirements.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127783-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Sequences of steps in procedures","OptionFeedback":""},{"Weight":100,"Text":"Database objects that generate sequential numeric values independent of tables","OptionFeedback":""},{"Weight":0,"Text":"Ordered lists of queries","OptionFeedback":""},{"Weight":0,"Text":"SEQUENCE is not available in SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"What does the EXCEPT operator do?","Hint":null,"Feedback":"EXCEPT returns rows in first query not in second (set difference). Example: SELECT ProductID FROM Products EXCEPT SELECT ProductID FROM Orders returns products never ordered. Removes duplicates automatically. Similar to: LEFT JOIN WHERE NULL. Use for: finding missing data comparing datasets. INTERSECT: rows in both. UNION: rows from both. EXCEPT: rows in first not second. Standard SQL. Cleaner than NOT EXISTS for set operations.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127786-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Returns distinct rows from the first query that do not appear in the second query","OptionFeedback":""},{"Weight":0,"Text":"Handles exceptions in queries","OptionFeedback":""},{"Weight":0,"Text":"Excludes NULL values","OptionFeedback":""},{"Weight":0,"Text":"EXCEPT is not valid SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"What does the INTERSECT operator return?","Hint":null,"Feedback":"INTERSECT returns rows common to both queries. Example: SELECT CustomerID FROM OrdersTable INTERSECT SELECT CustomerID FROM ReturnsTable finds customers with both orders and returns. Removes duplicates. Equivalent to: INNER JOIN with DISTINCT or EXISTS. Use for: finding commonalities comparing lists. Set operators: UNION (all) EXCEPT (difference) INTERSECT (common). Columns must match in count and type. Cleaner than JOIN for set logic.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127788-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The average of intersecting values","OptionFeedback":""},{"Weight":100,"Text":"Distinct rows that appear in both queries","OptionFeedback":""},{"Weight":0,"Text":"All rows from both queries","OptionFeedback":""},{"Weight":0,"Text":"NULL values only","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"What does JSON_VALUE() do in SQL Server?","Hint":null,"Feedback":"JSON_VALUE extracts scalar value from JSON. Example: JSON_VALUE(@json, \u0027$.customer.name\u0027) extracts name from nested JSON. Returns single scalar value (string number null). For objects/arrays: use JSON_QUERY. Use with: JSON columns REST API data semi-structured data. Related: JSON_QUERY (objects/arrays) OPENJSON (rowset). SQL Server 2016\u002B. Enables querying JSON data relationally. Essential for modern data integration.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127792-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Validates JSON syntax","OptionFeedback":""},{"Weight":100,"Text":"Extracts a scalar value from a JSON string using a path expression","OptionFeedback":""},{"Weight":0,"Text":"Converts tables to JSON","OptionFeedback":""},{"Weight":0,"Text":"JSON_VALUE is not available","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What does OPENJSON() do?","Hint":null,"Feedback":"OPENJSON transforms JSON into rows. Example: SELECT * FROM OPENJSON(@json) WITH (ID INT \u0027$.id\u0027, Name VARCHAR(50) \u0027$.name\u0027). Converts JSON arrays to table format. Use for: importing JSON API responses shredding JSON NoSQL data. WITH clause: defines schema types paths. Without WITH: key-value pairs. Enables: joining JSON with relational data WHERE on JSON. SQL Server 2016\u002B. Critical for JSON integration.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127795-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Parses JSON text and returns objects and arrays as a rowset","OptionFeedback":""},{"Weight":0,"Text":"Opens JSON files","OptionFeedback":""},{"Weight":0,"Text":"Validates JSON structure","OptionFeedback":""},{"Weight":0,"Text":"Encrypts JSON data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"What does the FOR JSON clause do?","Hint":null,"Feedback":"FOR JSON converts SQL results to JSON. Modes: FOR JSON AUTO (automatic structure) FOR JSON PATH (explicit structure). Example: SELECT CustomerID, Name FROM Customers FOR JSON AUTO produces JSON array. PATH mode: custom structure nested objects. Use for: REST APIs data export web services. Options: ROOT (\u0027rootname\u0027) INCLUDE_NULL_VALUES. Opposite of OPENJSON. SQL Server 2016\u002B. Essential for API development JSON integration.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127797-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Formats tables for printing","OptionFeedback":""},{"Weight":100,"Text":"Converts query results to JSON format","OptionFeedback":""},{"Weight":0,"Text":"Creates JSON files","OptionFeedback":""},{"Weight":0,"Text":"FOR JSON validates data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"What does CONCAT_WS() do differently than CONCAT()?","Hint":null,"Feedback":"CONCAT_WS(separator, value1, value2, ...) concatenates with separator between non-NULL values. Example: CONCAT_WS(\u0027, \u0027, FirstName, MiddleName, LastName) handles missing middle names gracefully. Benefits: automatic separator placement skips NULLs cleaner than CONCAT. Use for: full names addresses paths. SQL Server 2017\u002B. Cleaner than: CONCAT with CASE for NULLs manual separators. Common for data formatting.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127799-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"CONCAT_WS adds a separator between values and skips NULL values","OptionFeedback":""},{"Weight":0,"Text":"CONCAT_WS is slower than CONCAT","OptionFeedback":""},{"Weight":0,"Text":"They are identical functions","OptionFeedback":""},{"Weight":0,"Text":"CONCAT_WS only works with strings","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"What does STRING_SPLIT() do?","Hint":null,"Feedback":"STRING_SPLIT(string, separator) converts delimited string to rows. Example: STRING_SPLIT(\u0027apple,banana,cherry\u0027, \u0027,\u0027) returns 3 rows. Returns table: value column. Use for: parsing CSV splitting tags processing delimited input. Limitations: doesn\u0027t preserve order (until 2022 with ordinal parameter). Use with: JOIN to match split values WHERE to filter. SQL Server 2016\u002B. Essential for processing delimited data. Replaces complex string parsing logic.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127802-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Splits strings randomly","OptionFeedback":""},{"Weight":100,"Text":"Splits a delimited string into rows based on a separator character","OptionFeedback":""},{"Weight":0,"Text":"Divides string length by number","OptionFeedback":""},{"Weight":0,"Text":"STRING_SPLIT is not valid SQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"What does GENERATE_SERIES() do in SQL?","Hint":null,"Feedback":"GENERATE_SERIES(start, stop, step) generates number sequence. Example: SELECT value FROM GENERATE_SERIES(1, 10, 2) returns 1,3,5,7,9. Use for: generating dates (add to start date) filling gaps creating test data number sequences. SQL Server 2022\u002B. PostgreSQL has this long-term. Eliminates: recursive CTEs for sequences number tables. Simple elegant way to generate sequences. Useful for date ranges and numeric series.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127804-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Creates database backup series","OptionFeedback":""},{"Weight":100,"Text":"Generates a sequence of values from start to stop with optional step (SQL Server 2022\u002B)","OptionFeedback":""},{"Weight":0,"Text":"Generates random numbers","OptionFeedback":""},{"Weight":0,"Text":"Creates time series data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"What can the enhanced TRIM function remove in modern SQL?","Hint":null,"Feedback":"TRIM([characters FROM] string) with optional LEADING/TRAILING/BOTH. Example: TRIM(\u0027,\u0027 FROM \u0027,apple,\u0027) removes commas. TRIM(BOTH \u0027 \u0027 FROM string) removes spaces. Legacy: LTRIM RTRIM. Modern TRIM: single function specify characters specify side. SQL Server 2017\u002B. Benefits: cleaner syntax one function flexibility. Use for: data cleaning removing unwanted characters standardizing strings. Replaces nested LTRIM/RTRIM.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127806-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Tex AD third parameter: default value when no prior/next row. Example: LAG(Sales, 1, 0) OVER (ORDER BY Date) returns 0 for first row instead of NULL. Benefits: avoid NULL handling calculations work correctly meaningful defaults. Use 0 for calculations \u0027N/A\u0027 for display previous value for filling. Essential for: first/last rows calculations avoiding NULL propagation user-friendly output. Makes window functions more practical.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127811-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Default values are not supported","OptionFeedback":""},{"Weight":100,"Text":"Specifies what to return when there is no previous or next row avoiding NULL","OptionFeedback":""},{"Weight":0,"Text":"Default values improve performance","OptionFeedback":""},{"Weight":0,"Text":"Default values are required parameters","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q043","Type":"MC","Title":"Question 43","QuestionText":"How do you calculate a moving average using window functions?","Hint":null,"Feedback":"Moving average: AVG(Value) OVER (ORDER BY Date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) creates 3-day average. Frame: ROWS BETWEEN n PRECEDING AND m FOLLOWING defines window. Example: 7-day average: ROWS BETWEEN 6 PRECEDING AND CURRENT ROW. Use for: smoothing data trend analysis time series. Can center: BETWEEN 1 PRECEDING AND 1 FOLLOWING. Critical: ORDER BY for sequence. Window frames essential for moving calculations.","TopicTitle":"Quiz 12 - Advanced SQL","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.6127814-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null
