  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_4_(Week_4)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.0214789-05:00","NextQuestionNumber":35,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a database view?","Hint":null,"Feedback":"A view is a virtual table defined by a SELECT statement. It does not store data but presents data from underlying tables. Views simplify complex queries provide security by restricting column/row access and present data in different formats. Example: CREATE VIEW ActiveCustomers AS SELECT * FROM Customers WHERE Active = 1.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214633-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A physical table that stores duplicate data for faster queries","OptionFeedback":""},{"Weight":0,"Text":"A backup copy of table data","OptionFeedback":""},{"Weight":100,"Text":"A virtual table based on a SQL query that does not store data itself","OptionFeedback":""},{"Weight":0,"Text":"A temporary table that exists only during a session","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What is a database trigger?","Hint":null,"Feedback":"Triggers are special stored procedures that fire automatically when specific DML events (INSERT UPDATE DELETE) occur on a table. Example: CREATE TRIGGER AuditTrigger ON Customers AFTER UPDATE AS INSERT INTO AuditLog SELECT * FROM inserted. Triggers enforce business rules maintain audit trails and cascade changes.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214644-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Special stored procedure that automatically executes in response to INSERT UPDATE or DELETE events","OptionFeedback":""},{"Weight":0,"Text":"A scheduled job that runs at specific time intervals","OptionFeedback":""},{"Weight":0,"Text":"A constraint that validates data before insertion","OptionFeedback":""},{"Weight":0,"Text":"A view that updates automatically when data changes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What is a key difference between a scalar function and a stored procedure?","Hint":null,"Feedback":"Scalar functions must return a single value and can be used in SELECT WHERE and other clauses: SELECT dbo.GetTax(Amount) FROM Orders. Stored procedures optionally return values and cannot be used in queries. Functions have restrictions: no OUTPUT parameters limited DML operations and no TRY-CATCH in older SQL versions.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214647-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Functions are faster than stored procedures","OptionFeedback":""},{"Weight":0,"Text":"Stored procedures cannot accept parameters","OptionFeedback":""},{"Weight":100,"Text":"Functions must return a value and can be used in SELECT statements while procedures are optional returns","OptionFeedback":""},{"Weight":0,"Text":"Functions can modify data but procedures cannot","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"Which scenario is most appropriate for using a view?","Hint":null,"Feedback":"Views are best for: simplifying complex queries providing security by exposing only specific columns/rows presenting data in different formats and maintaining backward compatibility after schema changes. Example: CREATE VIEW CustomerOrders AS SELECT C.Name O.OrderDate O.Total FROM Customers C JOIN Orders O ON C.ID = O.CustomerID.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214649-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Simplifying complex joins that are frequently queried and restricting user access to specific columns","OptionFeedback":""},{"Weight":0,"Text":"Automatically updating data when changes occur in source tables","OptionFeedback":""},{"Weight":0,"Text":"Performing complex calculations that modify database tables","OptionFeedback":""},{"Weight":0,"Text":"Executing scheduled batch processing operations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"When should you use a table-valued function instead of a view?","Hint":null,"Feedback":"Table-valued functions are ideal when you need parameterized views. Example: CREATE FUNCTION GetCustomersByState(@State VARCHAR(2)) RETURNS TABLE AS RETURN SELECT * FROM Customers WHERE State = @State. Unlike views TVFs accept parameters enabling dynamic filtering while returning result sets like views.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214652-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"When you need to store data permanently","OptionFeedback":""},{"Weight":100,"Text":"When you need to pass parameters to filter the returned dataset","OptionFeedback":""},{"Weight":0,"Text":"When you want automatic execution on data changes","OptionFeedback":""},{"Weight":0,"Text":"When you need to perform INSERT UPDATE or DELETE operations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"What distinguishes a DML trigger from a DDL trigger?","Hint":null,"Feedback":"DML triggers fire on INSERT UPDATE DELETE events affecting data rows. DDL triggers fire on CREATE ALTER DROP events affecting database schema. Example: CREATE TRIGGER PreventTableDrop ON DATABASE FOR DROP_TABLE AS RAISERROR(\u0027Tables cannot be dropped\u0027 16 1) ROLLBACK. DDL triggers are used for auditing and preventing schema changes.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214666-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"DML triggers are faster than DDL triggers","OptionFeedback":""},{"Weight":100,"Text":"DML triggers respond to data changes while DDL triggers respond to schema changes","OptionFeedback":""},{"Weight":0,"Text":"DDL triggers can modify data but DML triggers cannot","OptionFeedback":""},{"Weight":0,"Text":"DML triggers work on views while DDL triggers work on tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"Which operation is NOT allowed in a user-defined function?","Hint":null,"Feedback":"Functions cannot use non-deterministic functions (GETDATE RAND NEWID) cannot modify database state (INSERT UPDATE DELETE on permanent tables) cannot use TRY-CATCH (in SQL 2005-2008) and cannot have OUTPUT parameters. These restrictions ensure functions are deterministic and have no side effects enabling optimization.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214669-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SELECT statements to query data","OptionFeedback":""},{"Weight":0,"Text":"Declaring and using variables","OptionFeedback":""},{"Weight":100,"Text":"Using non-deterministic functions like GETDATE() or NEWID()","OptionFeedback":""},{"Weight":100,"Text":"Calling other user-defined functions","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is the purpose of an INSTEAD OF trigger?","Hint":null,"Feedback":"INSTEAD OF triggers replace the original DML operation. Example: CREATE TRIGGER InsteadOfDelete ON Customers INSTEAD OF DELETE AS UPDATE Customers SET Active = 0 WHERE ID IN (SELECT ID FROM deleted). Useful for implementing soft deletes updating views and enforcing complex business rules.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214672-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To replace the original INSERT UPDATE or DELETE operation with custom logic","OptionFeedback":""},{"Weight":0,"Text":"To execute after the original operation completes","OptionFeedback":""},{"Weight":0,"Text":"To prevent any modifications to the table","OptionFeedback":""},{"Weight":0,"Text":"To automatically backup data before changes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What is the main benefit of creating an indexed view?","Hint":null,"Feedback":"Indexed views (materialized views) physically store the result set with a clustered index: CREATE VIEW SalesSummary WITH SCHEMABINDING AS SELECT...CREATE UNIQUE CLUSTERED INDEX idx ON SalesSummary... This dramatically improves performance for complex aggregations and joins but requires maintenance overhead when base tables change.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214675-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Indexed views automatically update when base tables change","OptionFeedback":""},{"Weight":100,"Text":"Indexed views physically store result sets improving query performance for complex aggregations","OptionFeedback":""},{"Weight":0,"Text":"Indexed views require less storage than regular views","OptionFeedback":""},{"Weight":0,"Text":"Indexed views can perform INSERT UPDATE and DELETE operations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"When should you use a trigger instead of a CHECK constraint?","Hint":null,"Feedback":"Use constraints for simple column-level or table-level validation. Use triggers when: validation requires data from other tables complex business rules span multiple tables you need to enforce rules on views or you need to perform additional actions. Constraints are faster and declarative; triggers are more flexible.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214678-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use triggers because they are faster","OptionFeedback":""},{"Weight":100,"Text":"When validation requires checking data in other tables or complex multi-table logic","OptionFeedback":""},{"Weight":0,"Text":"When you need simple single-column validation","OptionFeedback":""},{"Weight":0,"Text":"Constraints should always be preferred over triggers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"When should you choose a stored procedure over a function?","Hint":null,"Feedback":"Choose stored procedures when you need: data modification operations TRY-CATCH error handling OUTPUT parameters transaction management or no return value requirement. Choose functions when: you need to use results in queries must return values or need inline table-valued results. Procedures are more flexible; functions are more restricted.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214681-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When you need to perform INSERT UPDATE or DELETE operations or use TRY-CATCH error handling","OptionFeedback":""},{"Weight":0,"Text":"When you need to return a single value","OptionFeedback":""},{"Weight":0,"Text":"When you want to use the result in a SELECT statement","OptionFeedback":""},{"Weight":0,"Text":"When you need to accept parameters","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"When does an AFTER trigger execute?","Hint":null,"Feedback":"AFTER triggers execute after the DML operation completes and all constraints are satisfied. Example: CREATE TRIGGER AfterInsert ON Orders AFTER INSERT AS... The operation can still be rolled back in the trigger. If constraints fail the trigger does not fire. Use for auditing cascading changes and maintaining derived data.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214683-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Before the DML operation and constraint checking","OptionFeedback":""},{"Weight":100,"Text":"After the DML operation and all constraints have been verified successfully","OptionFeedback":""},{"Weight":0,"Text":"Instead of the DML operation","OptionFeedback":""},{"Weight":0,"Text":"Before constraints are checked but after the operation","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What characterizes an inline table-valued function?","Hint":null,"Feedback":"Inline table-valued functions contain only a RETURN SELECT statement: CREATE FUNCTION GetOrders(@CustID INT) RETURNS TABLE AS RETURN SELECT * FROM Orders WHERE CustomerID = @CustID. They perform better than multi-statement TVFs because SQL Server can optimize them like views with parameters. Use for parameterized queries.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214685-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The view must be indexed","OptionFeedback":""},{"Weight":100,"Text":"The view must reference a single base table and include all required columns with no aggregations","OptionFeedback":""},{"Weight":0,"Text":"The view must use INSTEAD OF triggers","OptionFeedback":""},{"Weight":0,"Text":"All views automatically support modification operations","OptionFeedback":""},{"Weight":100,"Text":"Contains a single SELECT statement and performs like a parameterized view","OptionFeedback":""},{"Weight":0,"Text":"Uses BEGIN...END block with multiple statements","OptionFeedback":""},{"Weight":0,"Text":"Returns a scalar value instead of a table","OptionFeedback":""},{"Weight":0,"Text":"Can modify data in database tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What are the INSERTED and DELETED pseudo-tables in triggers?","Hint":null,"Feedback":"INSERTED holds new row values (for INSERT and UPDATE). DELETED holds old row values (for DELETE and UPDATE). Example: CREATE TRIGGER LogChanges ON Orders AFTER UPDATE AS INSERT INTO AuditLog SELECT \u0027Old\u0027 * FROM deleted UNION SELECT \u0027New\u0027 * FROM inserted. These tables have the same structure as the trigger table.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214688-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Permanent tables that store audit information","OptionFeedback":""},{"Weight":100,"Text":"Special temporary tables that hold new and old row values during trigger execution","OptionFeedback":""},{"Weight":0,"Text":"System tables that track all database changes","OptionFeedback":""},{"Weight":0,"Text":"Views that show data before and after trigger execution","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What does the WITH CHECK OPTION clause do when creating a view?","Hint":null,"Feedback":"WITH CHECK OPTION ensures modifications through the view satisfy the WHERE clause: CREATE VIEW ExpensiveOrders AS SELECT * FROM Orders WHERE Total \u003E 1000 WITH CHECK OPTION. This prevents inserting orders with Total \u003C= 1000 through the view enforcing data integrity and view consistency.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.021469-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It validates data types of all columns","OptionFeedback":""},{"Weight":0,"Text":"It improves query performance by creating an index","OptionFeedback":""},{"Weight":100,"Text":"It prevents INSERT or UPDATE operations that would create rows not visible through the view","OptionFeedback":""},{"Weight":0,"Text":"It enforces foreign key constraints on the view","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"When should you use a multi-statement table-valued function?","Hint":null,"Feedback":"Multi-statement TVFs use BEGIN...END with procedural logic: CREATE FUNCTION GetComplexData() RETURNS @Result TABLE(ID INT) AS BEGIN...INSERT @Result...RETURN END. Use when you need loops conditions or multiple queries. However they perform worse than inline TVFs because SQL Server cannot optimize them as effectively.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214692-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When you need complex procedural logic to build and populate the result table","OptionFeedback":""},{"Weight":0,"Text":"When you need the best possible query performance","OptionFeedback":""},{"Weight":0,"Text":"When you only need a simple SELECT statement with parameters","OptionFeedback":""},{"Weight":0,"Text":"When you need to modify database tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"Why might you temporarily disable a trigger?","Hint":null,"Feedback":"Disable triggers with: DISABLE TRIGGER TriggerName ON TableName during bulk loads data migrations or maintenance to improve performance and avoid side effects. Always re-enable: ENABLE TRIGGER TriggerName ON TableName. Alternative: ALTER TABLE tablename DISABLE TRIGGER ALL. This is temporary and should be used carefully.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214694-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To improve performance of normal operations","OptionFeedback":""},{"Weight":100,"Text":"During bulk data loads or maintenance operations to avoid unnecessary trigger execution","OptionFeedback":""},{"Weight":0,"Text":"Triggers should never be disabled","OptionFeedback":""},{"Weight":0,"Text":"To test if the trigger contains errors","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"When should you use a view instead of a stored procedure?","Hint":null,"Feedback":"Use views when you need: query simplification security/abstraction layer ability to join with other tables or use in WHERE clauses backward compatibility or no parameter requirements. Use stored procedures when you need: parameters complex logic data modifications transaction control or OUTPUT parameters. Views are query-focused; procedures are operation-focused.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214726-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"When you need to perform data modifications","OptionFeedback":""},{"Weight":100,"Text":"When you need to simplify queries and allow the result to be joined with other tables","OptionFeedback":""},{"Weight":0,"Text":"When you need complex procedural logic","OptionFeedback":""},{"Weight":0,"Text":"When you need to accept parameters","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"How can you control the execution order of multiple triggers on the same table?","Hint":null,"Feedback":"Use sp_settriggerorder to set first or last: EXEC sp_settriggerorder @triggername=\u0027TriggerName\u0027 @order=\u0027First\u0027 @stmttype=\u0027UPDATE\u0027. Only first and last can be specified; middle triggers execute in undefined order. Consider redesigning to use one trigger if order is critical or use trigger chaining.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214729-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use sp_settriggerorder to specify first and last triggers","OptionFeedback":""},{"Weight":0,"Text":"Triggers execute in alphabetical order by name","OptionFeedback":""},{"Weight":0,"Text":"Triggers execute in the order they were created","OptionFeedback":""},{"Weight":0,"Text":"Trigger execution order cannot be controlled","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"Why must user-defined functions be deterministic?","Hint":null,"Feedback":"Deterministic functions always return the same result for the same inputs enabling: indexed views computed columns query optimization and result caching. Non-deterministic functions like GETDATE() are prohibited because they produce different results even with identical inputs preventing these optimizations.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214731-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Deterministic functions execute faster","OptionFeedback":""},{"Weight":100,"Text":"Determinism enables query optimization indexing and consistent results for the same inputs","OptionFeedback":""},{"Weight":0,"Text":"Non-deterministic functions are not supported in SQL Server","OptionFeedback":""},{"Weight":0,"Text":"Deterministic functions use less memory","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is trigger recursion and how is it controlled?","Hint":null,"Feedback":"Trigger recursion occurs when a trigger modifies a table causing itself to fire again. Control with: ALTER DATABASE dbname SET RECURSIVE_TRIGGERS OFF (default is OFF). Example: UPDATE trigger that updates the same table. Be cautious as recursion can cause infinite loops. Use UPDATE(column) to check if specific columns changed.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214733-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Recursion is when a trigger calls itself and cannot be prevented","OptionFeedback":""},{"Weight":100,"Text":"Recursion occurs when a trigger\u0027s action causes the same trigger to fire again controlled by database options","OptionFeedback":""},{"Weight":0,"Text":"Recursion is when multiple triggers fire simultaneously","OptionFeedback":""},{"Weight":0,"Text":"Trigger recursion is always disabled by default","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"What does the SCHEMABINDING option do when creating a view?","Hint":null,"Feedback":"SCHEMABINDING prevents dropping or altering columns used by the view: CREATE VIEW OrderSummary WITH SCHEMABINDING AS SELECT OrderID Total FROM dbo.Orders. Tables cannot be modified in ways that break the view. Required for indexed views and computed columns. Use fully qualified names (schema.table) with SCHEMABINDING.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214736-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Prevents changes to underlying table schemas that would affect the view","OptionFeedback":""},{"Weight":0,"Text":"Improves query performance by caching the view results","OptionFeedback":""},{"Weight":0,"Text":"Allows the view to be updated directly","OptionFeedback":""},{"Weight":0,"Text":"Enables the view to reference tables in other databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is a common performance issue with scalar functions in WHERE clauses?","Hint":null,"Feedback":"Scalar functions in WHERE clauses cause row-by-row execution: SELECT * FROM Orders WHERE dbo.GetTax(Amount) \u003E 100 executes GetTax for every row preventing index seeks. Solutions: inline the logic use computed columns or table-valued functions or refactor to set-based operations. Functions can severely impact performance on large tables.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214738-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Scalar functions always improve performance","OptionFeedback":""},{"Weight":100,"Text":"Scalar functions execute once per row preventing efficient index usage and set-based operations","OptionFeedback":""},{"Weight":0,"Text":"Scalar functions use too much memory","OptionFeedback":""},{"Weight":0,"Text":"Scalar functions cannot access indexes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"When should you use a trigger instead of a foreign key constraint?","Hint":null,"Feedback":"Use foreign keys for standard referential integrity (they are faster declarative and better optimized). Use triggers when you need: custom cascade logic (beyond CASCADE UPDATE/DELETE) cross-database references conditional referential integrity or complex multi-table relationships. Foreign keys are preferred for simplicity and performance.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.021474-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When you need custom cascading logic or cross-database referential integrity","OptionFeedback":""},{"Weight":0,"Text":"Always use triggers because they are more flexible","OptionFeedback":""},{"Weight":0,"Text":"When you need simple parent-child relationship enforcement","OptionFeedback":""},{"Weight":0,"Text":"Foreign keys should never be used","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What is a partitioned view?","Hint":null,"Feedback":"Partitioned views combine horizontally partitioned tables: CREATE VIEW AllOrders AS SELECT * FROM Orders2023 UNION ALL SELECT * FROM Orders2024. Used before table partitioning features existed or for cross-server scenarios. CHECK constraints guide query optimization to access only relevant tables improving performance for time-based or range-based partitioning.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214743-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A view that uses indexed columns for faster queries","OptionFeedback":""},{"Weight":100,"Text":"A view that combines data from multiple tables with identical structures using UNION ALL","OptionFeedback":""},{"Weight":0,"Text":"A view that divides results into separate result sets","OptionFeedback":""},{"Weight":0,"Text":"A view that can only show a portion of table rows","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What is a potential alternative to using triggers for audit logging?","Hint":null,"Feedback":"Alternatives to audit triggers include: temporal tables (system-versioned tables) automatically track all changes Change Data Capture reads transaction logs SQL Server Audit tracks security events or application-level logging. These alternatives often perform better and require less maintenance than custom audit triggers.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214745-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use triggers as there are no alternatives","OptionFeedback":""},{"Weight":100,"Text":"Use temporal tables or Change Data Capture for automatic history tracking","OptionFeedback":""},{"Weight":0,"Text":"Use views to track changes","OptionFeedback":""},{"Weight":0,"Text":"Use stored procedures exclusively","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What requirements must a function meet to be used in a computed column?","Hint":null,"Feedback":"Functions in computed columns must be: deterministic (same inputs = same outputs) schema-bound precise (no floating point) and access no external data. Example: CREATE FUNCTION dbo.GetFullName(@First VARCHAR(50) @Last VARCHAR(50)) RETURNS VARCHAR(100) WITH SCHEMABINDING AS BEGIN RETURN @First \u002B \u0027 \u0027 \u002B @Last END. Then: ALTER TABLE ADD FullName AS dbo.GetFullName(FirstName LastName).","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214748-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Must be deterministic and schema-bound","OptionFeedback":""},{"Weight":0,"Text":"Must return an integer value","OptionFeedback":""},{"Weight":0,"Text":"Must not accept any parameters","OptionFeedback":""},{"Weight":0,"Text":"Must be a system function","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"How can triggers negatively impact database performance?","Hint":null,"Feedback":"Triggers add overhead because they: execute on every DML operation extend transaction duration (increasing lock hold time) can cause blocking if complex may have nested effects and are hidden from application logic making troubleshooting difficult. Minimize trigger logic keep transactions short and consider alternatives for complex processing.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214751-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Triggers always improve performance","OptionFeedback":""},{"Weight":0,"Text":"Triggers use too much disk space","OptionFeedback":""},{"Weight":100,"Text":"Triggers add overhead to every DML operation and can cause blocking if poorly designed","OptionFeedback":""},{"Weight":0,"Text":"Triggers prevent index usage","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What does encrypting a view accomplish?","Hint":null,"Feedback":"View encryption hides the SQL definition: CREATE VIEW SalesData WITH ENCRYPTION AS SELECT... Users cannot view the definition via sp_helptext or sys.sql_modules but can still query the view. Encryption protects intellectual property but makes maintenance harder. Keep unencrypted source code separately for maintenance.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214753-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Obfuscates the view definition preventing users from seeing the underlying SQL","OptionFeedback":""},{"Weight":0,"Text":"Encrypts the data returned by the view","OptionFeedback":""},{"Weight":0,"Text":"Improves query performance","OptionFeedback":""},{"Weight":0,"Text":"Prevents unauthorized access to the view","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"When should you use CLR functions instead of T-SQL functions?","Hint":null,"Feedback":"Use CLR functions for: complex mathematical computations regular expressions advanced string manipulation external resource access (files web services) or CPU-intensive operations. T-SQL is better for: set-based data access simple calculations or standard database operations. CLR has overhead for data access but excels at computational tasks.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214755-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use CLR functions for better performance","OptionFeedback":""},{"Weight":100,"Text":"When you need complex computations string manipulation or external resource access not available in T-SQL","OptionFeedback":""},{"Weight":0,"Text":"When you need simple arithmetic calculations","OptionFeedback":""},{"Weight":0,"Text":"CLR functions should never be used","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What is the best practice for testing triggers during development?","Hint":null,"Feedback":"Test triggers with: single-row and multi-row operations NULL values edge cases concurrent transactions intentional failures (to test rollback) INSERTED/DELETED table contents and performance under load. Remember triggers fire per statement not per row. Test in non-production first and document trigger behavior.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214758-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Test in production first","OptionFeedback":""},{"Weight":100,"Text":"Test with various DML scenarios including edge cases multi-row operations and rollback conditions","OptionFeedback":""},{"Weight":0,"Text":"Triggers do not need testing","OptionFeedback":""},{"Weight":0,"Text":"Only test single-row INSERT operations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"Which database object should you use for implementing business logic that calculates sales tax based on customer location?","Hint":null,"Feedback":"A scalar function is ideal: CREATE FUNCTION dbo.CalculateTax(@Amount MONEY @State CHAR(2)) RETURNS MONEY AS BEGIN...RETURN @Tax END. Use in queries: SELECT OrderID Total dbo.CalculateTax(Total State) AS Tax FROM Orders. Functions enable reuse in multiple contexts. Avoid scalar functions in WHERE clauses for performance.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214762-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A scalar function that can be called in SELECT statements and computed columns","OptionFeedback":""},{"Weight":0,"Text":"A trigger that fires on every SELECT statement","OptionFeedback":""},{"Weight":0,"Text":"A view that pre-calculates all possible tax values","OptionFeedback":""},{"Weight":0,"Text":"A stored procedure that must be called separately","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"Which scenario is appropriate for a DDL trigger?","Hint":null,"Feedback":"DDL triggers prevent or audit schema changes: CREATE TRIGGER PreventDrop ON DATABASE FOR DROP_TABLE AS PRINT \u0027Cannot drop tables\u0027 ROLLBACK. Use for: preventing accidental schema changes auditing CREATE/ALTER/DROP operations enforcing naming conventions or notifying administrators of schema modifications. They protect database structure not data.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214765-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Logging every SELECT query executed by users","OptionFeedback":""},{"Weight":100,"Text":"Preventing developers from dropping tables in production or auditing schema changes","OptionFeedback":""},{"Weight":0,"Text":"Validating data during INSERT operations","OptionFeedback":""},{"Weight":0,"Text":"Improving query performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"When should you create an indexed view (materialized view)?","Hint":null,"Feedback":"Create indexed views when: complex aggregations or joins are frequently queried base tables change infrequently read operations far outnumber writes and you can afford maintenance overhead. Requirements include: SCHEMABINDING deterministic functions no outer joins specific SET options. Trade-off: faster reads but slower writes due to index maintenance.","TopicTitle":"Quiz 4 - Procedures and Functions","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.0214768-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"For every view in the database","OptionFeedback":""},{"Weight":100,"Text":"When you have expensive aggregate queries that are frequently executed and base tables change infrequently","OptionFeedback":""},{"Weight":0,"Text":"When base tables are updated very frequently","OptionFeedback":""},{"Weight":0,"Text":"When you need to save disk space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
