  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_14_(Week_14)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.5920196-05:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What does NoSQL primarily stand for in database terminology?","Hint":null,"Feedback":"NoSQL means \u0027Not Only SQL\u0027 referring to databases that use alternative data models beyond relational tables. Includes document stores key-value stores column-family stores and graph databases. Designed for: flexible schemas horizontal scalability high performance specific use cases. Not a replacement for all relational databases but complementary technology for different requirements.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920097-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"No Structured Query Language allowed","OptionFeedback":""},{"Weight":100,"Text":"Not Only SQL indicating databases that supplement or replace traditional relational models","OptionFeedback":""},{"Weight":0,"Text":"Never use SQL for queries","OptionFeedback":""},{"Weight":0,"Text":"New Operating System Query Language","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What characterizes document-oriented databases like MongoDB?","Hint":null,"Feedback":"Document databases store data as documents (JSON BSON XML) each containing all related data. Features: flexible schema nested structures embedded documents and no joins needed. Examples: MongoDB CouchDB. Benefits: natural data representation easy scaling schema evolution. Use cases: content management catalogs user profiles. Documents can vary in structure within same collection.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920107-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Store data as self-contained documents typically in JSON or BSON format with flexible schemas","OptionFeedback":""},{"Weight":0,"Text":"Store data only as plain text files","OptionFeedback":""},{"Weight":0,"Text":"Require rigid predefined schemas like relational databases","OptionFeedback":""},{"Weight":0,"Text":"Can only store small amounts of data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What are key-value stores like Redis best suited for?","Hint":null,"Feedback":"Key-value stores provide fast O(1) lookups using unique keys. Ideal for: caching (Redis Memcached) session storage shopping carts real-time analytics and leaderboards. Benefits: extreme performance simple model horizontal scaling. Limitations: no complex queries no relationships basic data model. Redis supports: strings lists sets sorted sets hashes. Choose when speed matters more than query complexity.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920109-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Complex multi-table joins and transactions","OptionFeedback":""},{"Weight":0,"Text":"Storing only small text strings","OptionFeedback":""},{"Weight":100,"Text":"Fast simple lookups caching session management and real-time data","OptionFeedback":""},{"Weight":0,"Text":"Long-term archival storage only","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What does the CAP theorem state about distributed databases?","Hint":null,"Feedback":"CAP Theorem: distributed systems can provide only two of Consistency (all nodes see same data) Availability (system responds to requests) Partition Tolerance (works despite network failures). Partitions will occur so choose: CP (consistent but may be unavailable) or AP (available but may be inconsistent). Examples: MongoDB (CP) Cassandra (AP). NoSQL databases make different CAP trade-offs than traditional ACID databases.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920111-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All three properties can always be achieved simultaneously","OptionFeedback":""},{"Weight":100,"Text":"You can only guarantee two of three: Consistency Availability and Partition Tolerance","OptionFeedback":""},{"Weight":0,"Text":"Consistency is impossible in distributed systems","OptionFeedback":""},{"Weight":0,"Text":"CAP only applies to relational databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What is eventual consistency in NoSQL databases?","Hint":null,"Feedback":"Eventual consistency: updates propagate to all nodes over time but reads might return stale data temporarily. Trade-off: high availability and performance for temporary inconsistency. Acceptable for: social media feeds product catalogs view counts. Not acceptable for: financial transactions inventory management. Contrast with strong consistency (immediate) used in traditional RDBMS. Most NoSQL databases offer tunable consistency levels.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920113-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Data will become consistent across all nodes eventually but may be temporarily inconsistent","OptionFeedback":""},{"Weight":0,"Text":"Data is always immediately consistent everywhere","OptionFeedback":""},{"Weight":0,"Text":"Data never becomes consistent","OptionFeedback":""},{"Weight":0,"Text":"Consistency only matters for relational databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"How do MongoDB collections differ from relational database tables?","Hint":null,"Feedback":"MongoDB collections are schema-less: documents in same collection can have different fields no predefined structure dynamic field addition. Benefits: agile development evolving requirements polymorphic data. Example: user documents with different fields based on user type. Can add validation rules if desired. Contrast with SQL tables requiring defined schema. Flexibility vs structure trade-off.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920119-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Collections and tables are identical","OptionFeedback":""},{"Weight":100,"Text":"Collections do not enforce a schema and documents can have different structures","OptionFeedback":""},{"Weight":0,"Text":"Collections can only store one document type","OptionFeedback":""},{"Weight":0,"Text":"Collections require foreign keys for relationships","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What distinguishes column-family databases like Cassandra and HBase?","Hint":null,"Feedback":"Column-family stores organize data by columns not rows. Features: wide rows (millions of columns) sparse data column groups write optimization. Examples: Cassandra HBase. Benefits: massive scale write performance time-series data. Use cases: IoT data event logging sensor data. Cassandra: peer-to-peer architecture no single point of failure tunable consistency. Different from columnar databases like Vertica.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920121-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They store data in traditional rows and columns","OptionFeedback":""},{"Weight":0,"Text":"They cannot scale horizontally","OptionFeedback":""},{"Weight":100,"Text":"They store data by columns rather than rows optimized for write-heavy workloads and wide rows","OptionFeedback":""},{"Weight":0,"Text":"They only work with small datasets","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What are graph databases like Neo4j optimized for?","Hint":null,"Feedback":"Graph databases model data as nodes and relationships. Ideal for: social networks (friends followers) recommendation engines fraud detection knowledge graphs network topology. Benefits: natural relationship modeling traversal performance pattern matching. Query language: Cypher (Neo4j) Gremlin. Example: find friends-of-friends 3 levels deep - fast in graph database complex in SQL. Choose when relationships are as important as data itself.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920123-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Storing and querying highly connected data with complex relationships","OptionFeedback":""},{"Weight":0,"Text":"Storing simple key-value pairs","OptionFeedback":""},{"Weight":0,"Text":"Processing financial transactions","OptionFeedback":""},{"Weight":0,"Text":"Replacing all relational databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"Why is JSON widely used in NoSQL databases and APIs?","Hint":null,"Feedback":"JSON (JavaScript Object Notation) advantages: human-readable language-independent self-describing nested objects/arrays and native JavaScript integration. Used in: MongoDB (BSON variant) CouchDB REST APIs web applications. Drawbacks: verbose no binary data support no date type (strings). Alternatives: BSON (binary JSON) MessagePack Avro. JSON dominates web APIs and document databases due to simplicity and ubiquity.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920124-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"JSON is the fastest data format","OptionFeedback":""},{"Weight":100,"Text":"JSON is human-readable self-describing works natively with JavaScript and supports nested structures","OptionFeedback":""},{"Weight":0,"Text":"JSON is the only format NoSQL databases support","OptionFeedback":""},{"Weight":0,"Text":"JSON requires less storage than all other formats","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"How does horizontal scaling in NoSQL differ from vertical scaling in traditional databases?","Hint":null,"Feedback":"Vertical scaling (scale up): add CPU/RAM/storage to existing server. Limits: hardware maximums cost escalation single point of failure. Horizontal scaling (scale out): add more servers distribute data/load. NoSQL designed for horizontal: sharding partition tolerance commodity hardware. Benefits: unlimited scaling fault tolerance cost-effective. Relational databases traditionally scale vertically. NoSQL architectural advantage: linear scalability.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920128-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Horizontal scaling adds more servers while vertical scaling adds more resources to existing servers","OptionFeedback":""},{"Weight":0,"Text":"Horizontal scaling is always slower than vertical scaling","OptionFeedback":""},{"Weight":0,"Text":"They are the same thing with different names","OptionFeedback":""},{"Weight":0,"Text":"Only NoSQL can scale vertically","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What is sharding in NoSQL databases?","Hint":null,"Feedback":"Sharding distributes data across multiple servers (shards) using a shard key. Example: user_id mod 10 distributes users across 10 shards. Benefits: horizontal scaling load distribution larger datasets. Challenges: choosing shard key rebalancing cross-shard queries. MongoDB: automatic sharding. Cassandra: hash-based partitioning. Poor shard key causes hotspots. Critical for NoSQL scalability but adds complexity.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.592013-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Backing up data to multiple locations","OptionFeedback":""},{"Weight":0,"Text":"Encrypting sensitive data","OptionFeedback":""},{"Weight":100,"Text":"Partitioning data across multiple servers based on a shard key","OptionFeedback":""},{"Weight":0,"Text":"Compressing data to save space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What does schema-on-read mean in NoSQL contexts?","Hint":null,"Feedback":"Schema-on-read: store data without enforcing structure apply schema during retrieval. NoSQL approach. Benefits: flexibility rapid development evolving schemas. Schema-on-write: enforce structure during write (traditional SQL). Benefits: data quality consistency validation. Trade-off: flexibility vs integrity. NoSQL allows storing heterogeneous data interpreting at query time. Application responsible for handling structure variations.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920131-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Schema is applied when reading data rather than when writing allowing flexible storage","OptionFeedback":""},{"Weight":0,"Text":"All data must follow a strict schema when written","OptionFeedback":""},{"Weight":0,"Text":"Schema is never used in NoSQL","OptionFeedback":""},{"Weight":0,"Text":"Reading data is faster than writing","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is BSON and why does MongoDB use it?","Hint":null,"Feedback":"BSON (Binary JSON): binary-encoded serialization of JSON-like documents. Benefits: efficient traversal additional types (Date Binary ObjectId) compact for numbers and maintains JSON readability in tools. Used internally by MongoDB. Supports: embedded documents arrays nested structures. Faster than JSON for parsing/traversal larger than JSON for strings. Trade-off: efficiency vs pure text format.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920133-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"BSON is exactly the same as JSON","OptionFeedback":""},{"Weight":100,"Text":"BSON is Binary JSON providing efficient storage traversal and additional data types","OptionFeedback":""},{"Weight":0,"Text":"BSON is a query language","OptionFeedback":""},{"Weight":0,"Text":"BSON is slower than JSON","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What advanced data structures does Redis support beyond simple key-value pairs?","Hint":null,"Feedback":"Redis data structures: Strings (basic key-value) Lists (ordered collections) Sets (unique unordered) Sorted Sets (ordered by score) Hashes (field-value pairs) Bitmaps HyperLogLogs (cardinality estimation) Streams. Operations: LPUSH RPOP SADD ZADD HINCRBY. Use cases: leaderboards (sorted sets) shopping carts (hashes) queues (lists) unique visitors (HyperLogLog). Rich functionality beyond simple caching.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920135-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Lists sets sorted sets hashes bitmaps and hyperloglogs","OptionFeedback":""},{"Weight":0,"Text":"Only strings are supported","OptionFeedback":""},{"Weight":0,"Text":"Only integers and floats","OptionFeedback":""},{"Weight":0,"Text":"Redis doesn\u0027t support any data structures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"What makes time-series databases like InfluxDB specialized?","Hint":null,"Feedback":"Time-series databases optimize for: timestamped measurements high write throughput time-range queries downsampling/rollups compression retention policies. Examples: InfluxDB TimescaleDB OpenTSDB. Use cases: IoT sensors application metrics system monitoring financial data. Features: continuous queries automatic retention built-in aggregations. Superior to general NoSQL for time-series workloads. Purpose-built beats general-purpose for specific requirements.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920136-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They can only store timestamps","OptionFeedback":""},{"Weight":100,"Text":"Optimized for time-stamped data with efficient compression retention policies and time-based queries","OptionFeedback":""},{"Weight":0,"Text":"They are slower than other databases","OptionFeedback":""},{"Weight":0,"Text":"They cannot handle large volumes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What is the MongoDB aggregation framework used for?","Hint":null,"Feedback":"MongoDB aggregation pipeline: process documents through stages like $match (filter) $group (aggregate) $project (reshape) $sort $lookup (join) $unwind (arrays). Example: db.orders.aggregate([{$match: {status: \u0027shipped\u0027}}, {$group: {_id: \u0027$customer\u0027, total: {$sum: \u0027$amount\u0027}}}]). Powerful for: analytics reporting transformations. Alternative to MapReduce. Comparable to SQL GROUP BY but more flexible. Essential for complex queries.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920138-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Aggregation is not possible in MongoDB","OptionFeedback":""},{"Weight":0,"Text":"Only simple sums are supported","OptionFeedback":""},{"Weight":100,"Text":"Processing data through a pipeline of stages for complex analytics and transformations","OptionFeedback":""},{"Weight":0,"Text":"Aggregation only works with small datasets","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What do tunable consistency levels in Cassandra allow?","Hint":null,"Feedback":"Cassandra consistency levels: ONE (fast low consistency) QUORUM (balanced) ALL (slow high consistency) LOCAL_QUORUM (datacenter). Specify per read/write: write with QUORUM read with ONE or both QUORUM. Trade-offs: consistency vs latency vs availability. Formula: R \u002B W \u003E N for strong consistency (R=read W=write N=replicas). Example: session data use ONE financial data use QUORUM. Tunable consistency key Cassandra feature.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920139-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Balancing consistency requirements against performance and availability per operation","OptionFeedback":""},{"Weight":0,"Text":"Consistency is always the same for all operations","OptionFeedback":""},{"Weight":0,"Text":"Cassandra does not support consistency","OptionFeedback":""},{"Weight":0,"Text":"Only ACID transactions are possible","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is MapReduce in NoSQL contexts?","Hint":null,"Feedback":"MapReduce: Map function processes and emits key-value pairs Reduce function aggregates values by key distributed across cluster. Example: count word occurrences map each word to (word 1) reduce sum counts per word. Used in: MongoDB (legacy) Hadoop CouchDB. Now often replaced by: aggregation frameworks Spark SQL. Concept: divide work process in parallel combine results. Foundation of big data processing.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920142-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A way to create database indexes","OptionFeedback":""},{"Weight":100,"Text":"A programming model for processing large datasets by mapping and reducing operations across distributed nodes","OptionFeedback":""},{"Weight":0,"Text":"A backup and restore technique","OptionFeedback":""},{"Weight":0,"Text":"A security encryption method","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Which scenario best justifies choosing NoSQL over relational databases?","Hint":null,"Feedback":"Choose NoSQL when: massive scale needed (billions of records) schema frequently changes horizontal scaling required specific models (graph document) high write throughput or rapid development. Stay with SQL when: complex transactions needed multi-record ACID guarantees complex joins common mature ecosystems required. Not either/or: many systems use both (polyglot persistence). Choose based on specific requirements not trends.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920143-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All applications should always use NoSQL","OptionFeedback":""},{"Weight":100,"Text":"Massive scale flexible schema rapid development or specific data models like graphs","OptionFeedback":""},{"Weight":0,"Text":"Small applications with simple requirements","OptionFeedback":""},{"Weight":0,"Text":"When ACID guarantees are critical","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What makes Cypher different from SQL?","Hint":null,"Feedback":"Cypher syntax: nodes in parentheses (person) relationships in brackets -[:KNOWS]-\u003E patterns: (a)-[:KNOWS]-\u003E(b)-[:LIKES]-\u003E(c). Example: MATCH (p:Person)-[:FRIEND*2]-(friend) WHERE p.name=\u0027Alice\u0027 RETURN friend finds friends-of-friends. More intuitive for graph queries than SQL recursive CTEs. Declarative like SQL but graph-optimized. Expressive for: pattern matching traversal shortest paths. Natural fit for relationship-centric queries.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920145-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Cypher uses ASCII art patterns to express graph traversals and relationships","OptionFeedback":""},{"Weight":0,"Text":"Cypher and SQL are identical","OptionFeedback":""},{"Weight":0,"Text":"Cypher cannot query relationships","OptionFeedback":""},{"Weight":0,"Text":"Cypher only works with numbers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is polyglot persistence?","Hint":null,"Feedback":"Polyglot persistence: use different databases for different requirements. Example application: PostgreSQL (transactions orders) MongoDB (product catalog) Redis (caching sessions) Neo4j (recommendations). Benefits: optimal tool per use case leverage strengths avoid one-size-fits-all. Challenges: complexity multiple technologies operational overhead. Modern microservices often use polyglot approach. Choose database based on data characteristics access patterns not single standard.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920146-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Using only one database type for everything","OptionFeedback":""},{"Weight":100,"Text":"Using different database technologies for different parts of an application based on specific needs","OptionFeedback":""},{"Weight":0,"Text":"Writing database queries in multiple programming languages","OptionFeedback":""},{"Weight":0,"Text":"Translating data between different human languages","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"Why is denormalization common in NoSQL databases?","Hint":null,"Feedback":"NoSQL denormalization: embed related data in documents duplicate data across collections trade storage for performance. Example: embed order items in order document instead of separate collection. Benefits: single-document reads no joins better performance. Trade-offs: data duplication update complexity potential inconsistency. NoSQL optimizes reads over writes. Design for access patterns. Contrast with relational normalization (avoid redundancy). Different priorities: NoSQL favors speed relational favors consistency.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920148-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To optimize read performance by embedding related data avoiding expensive joins","OptionFeedback":""},{"Weight":0,"Text":"Denormalization makes data inconsistent","OptionFeedback":""},{"Weight":0,"Text":"NoSQL cannot normalize data","OptionFeedback":""},{"Weight":0,"Text":"Denormalization is always bad practice","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is unique about Cassandra\u0027s peer-to-peer architecture?","Hint":null,"Feedback":"Cassandra architecture: peer-to-peer ring all nodes identical no master/slave no single point of failure. Features: gossip protocol for node communication token-based partitioning tunable replication automatic failover. Benefits: continuous availability no bottleneck linear scalability. Contrast: MongoDB has primary/secondary HBase has master. Cassandra choice for: high availability write-heavy always-on systems. Trade-off: eventual consistency complexity.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920149-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Cassandra requires a master node","OptionFeedback":""},{"Weight":100,"Text":"All nodes are equal with no master or single point of failure","OptionFeedback":""},{"Weight":0,"Text":"Only one node can be active at a time","OptionFeedback":""},{"Weight":0,"Text":"Cassandra cannot replicate data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"Why has JSON largely replaced XML in modern NoSQL and web APIs?","Hint":null,"Feedback":"JSON advantages: more concise (less markup) easier parsing native JavaScript support simpler syntax. XML advantages: richer validation (XSD) namespaces attributes XSLT transformations. JSON won for: REST APIs NoSQL databases web applications. XML remains for: legacy systems complex documents enterprise integration (SOAP). Example: {\u0027name\u0027:\u0027John\u0027} vs \u003Cperson\u003E\u003Cname\u003EJohn\u003C/name\u003E\u003C/person\u003E. Industry shift reflects simplicity preference.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920151-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"JSON is more concise less verbose easier to parse and works naturally with JavaScript","OptionFeedback":""},{"Weight":0,"Text":"XML is no longer supported by any systems","OptionFeedback":""},{"Weight":0,"Text":"JSON is always faster than XML","OptionFeedback":""},{"Weight":0,"Text":"XML and JSON are identical in all aspects","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"How do secondary indexes in NoSQL differ from relational database indexes?","Hint":null,"Feedback":"NoSQL secondary indexes: may be eventually consistent require scatter-gather queries across shards limited in some databases (Cassandra restrictive). MongoDB: supports multiple secondary indexes but performance varies. Cassandra: avoid secondary indexes use materialized views instead. Challenge: maintaining consistency across distributed nodes. Design: choose shard key carefully minimize secondary indexes. Different from SQL: indexes are straightforward and consistent.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920152-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Secondary indexes work exactly the same way","OptionFeedback":""},{"Weight":100,"Text":"NoSQL secondary indexes may be eventually consistent and distributed across shards","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases cannot have secondary indexes","OptionFeedback":""},{"Weight":0,"Text":"Secondary indexes are always faster in NoSQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What advantages does Apache Avro provide for data serialization?","Hint":null,"Feedback":"Avro features: compact binary encoding schema stored with data schema evolution (add/remove fields) dynamic typing code generation for static languages. Used in: Hadoop Kafka data pipelines. Benefits: smaller than JSON schema versioning language-agnostic. Comparison: Protocol Buffers (requires compilation) JSON (human-readable but verbose) MessagePack (no schema). Avro choice for: large-scale data processing streaming systems where schema evolution matters.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920154-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Avro is human-readable like JSON","OptionFeedback":""},{"Weight":100,"Text":"Avro provides compact binary format with schema evolution and language independence","OptionFeedback":""},{"Weight":0,"Text":"Avro only works with Java","OptionFeedback":""},{"Weight":0,"Text":"Avro is slower than all other formats","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What is the purpose of MongoDB replica sets?","Hint":null,"Feedback":"Replica set: primary node (writes) secondary nodes (replication) automatic failover if primary fails. Benefits: high availability read scaling data redundancy disaster recovery. Configuration: typically 3 nodes minimum automatic election heartbeat monitoring. Reads: default primary can configure secondary reads. Compared to: master-slave (manual failover) sharding (horizontal scale). Essential for production MongoDB deployments. Provides fault tolerance without application changes.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920155-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Provide high availability and data redundancy through automatic failover","OptionFeedback":""},{"Weight":0,"Text":"Replica sets are only for backup purposes","OptionFeedback":""},{"Weight":0,"Text":"Replica sets reduce performance","OptionFeedback":""},{"Weight":0,"Text":"MongoDB cannot replicate data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"How does Redis differ from Memcached?","Hint":null,"Feedback":"Redis: rich data types (lists sets sorted sets) persistence (RDB AOF) atomic operations pub/sub transactions. Memcached: simple key-value only in-memory multi-threaded simpler. Use Redis for: complex caching pub/sub session storage when persistence needed. Use Memcached for: pure caching simple needs multi-core utilization. Redis more versatile Memcached more focused. Both excellent for caching different feature sets.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920157-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are identical systems","OptionFeedback":""},{"Weight":100,"Text":"Redis supports rich data structures persistence and atomic operations while Memcached is simpler cache-only","OptionFeedback":""},{"Weight":0,"Text":"Memcached is always faster than Redis","OptionFeedback":""},{"Weight":0,"Text":"Redis cannot be used for caching","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is Multi-Version Concurrency Control MVCC in CouchDB?","Hint":null,"Feedback":"MVCC in CouchDB: documents have revision IDs (_rev) updates create new versions conflicts detected automatically no locks needed for reads. Benefits: optimistic concurrency read performance conflict detection. Example: two users update same document both succeed CouchDB detects conflict application resolves. Append-only storage model. Different from locking (pessimistic). Eventual consistency with conflict resolution. Unique CouchDB feature for distributed scenarios.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920158-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Each document update creates new version allowing non-locking reads and conflict detection","OptionFeedback":""},{"Weight":0,"Text":"MVCC prevents any concurrent access","OptionFeedback":""},{"Weight":0,"Text":"MVCC is a backup mechanism","OptionFeedback":""},{"Weight":0,"Text":"CouchDB does not support concurrency","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"Why is Apache Parquet popular for big data analytics?","Hint":null,"Feedback":"Parquet advantages: columnar storage (read only needed columns) excellent compression encoding by column type predicate pushdown schema evolution. Used in: Hadoop Spark data lakes AWS Athena. Benefits: 10-100x smaller than CSV fast aggregations type-specific encoding. Use for: analytical workloads data warehousing archival storage. Not for: row-by-row processing transactional systems frequent updates. Columnar format optimizes analytical query patterns.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.592016-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Parquet is human-readable like CSV","OptionFeedback":""},{"Weight":100,"Text":"Parquet is columnar format with excellent compression and efficient for analytical queries","OptionFeedback":""},{"Weight":0,"Text":"Parquet only works with small files","OptionFeedback":""},{"Weight":0,"Text":"Parquet is slower than all other formats","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What do BASE properties represent in NoSQL systems?","Hint":null,"Feedback":"BASE: Basically Available (system responds even if not consistent) Soft state (state may change without input) Eventually consistent (will reach consistency eventually). Contrast ACID: immediate consistency. NoSQL trade-off: availability and partition tolerance over consistency. Acceptable for: social media feeds product catalogs analytics. Not for: financial transactions inventory. Design choice: ACID (strong guarantees limited scale) vs BASE (high scale eventual consistency).","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920161-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"BASE is the same as ACID","OptionFeedback":""},{"Weight":100,"Text":"Basically Available Soft state Eventually consistent - alternative to ACID","OptionFeedback":""},{"Weight":0,"Text":"BASE means data is always consistent","OptionFeedback":""},{"Weight":0,"Text":"BASE is a programming language","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"Why is choosing the right partition key critical in DynamoDB?","Hint":null,"Feedback":"DynamoDB partition key: determines shard placement affects query patterns must be in every query high cardinality needed. Good keys: user_id (many users) order_id (unique). Bad keys: status (few values creates hotspots) date (time-based hotspots). Add sort key for range queries within partition. Poor key causes: uneven distribution throttling poor performance. Cannot change after table creation. Design tables around access patterns. Critical upfront decision.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920163-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Partition key determines data distribution affecting performance and avoiding hotspots","OptionFeedback":""},{"Weight":0,"Text":"Partition key is only for encryption","OptionFeedback":""},{"Weight":0,"Text":"DynamoDB doesn\u0027t use partition keys","OptionFeedback":""},{"Weight":0,"Text":"Any partition key works equally well","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"How do MongoDB transactions differ from traditional SQL transactions?","Hint":null,"Feedback":"MongoDB transactions: single-document always atomic (v1.0\u002B) multi-document ACID transactions (v4.0\u002B) replica sets (v4.0) sharded clusters (v4.2). Design philosophy: embed related data in documents reducing multi-document transaction needs. Performance: single-document faster. When needed: use multi-document transactions for complex operations. Different approach: document-oriented reduces transaction requirements vs relational normalized model requiring transactions. Design for document atomicity when possible.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920164-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"MongoDB added multi-document ACID transactions later but performs best with single-document atomicity","OptionFeedback":""},{"Weight":0,"Text":"MongoDB has always had full ACID transactions","OptionFeedback":""},{"Weight":0,"Text":"MongoDB cannot guarantee any consistency","OptionFeedback":""},{"Weight":0,"Text":"Transactions work identically in both","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"What is ElasticSearch primarily designed for?","Hint":null,"Feedback":"ElasticSearch: distributed search engine based on Lucene full-text search fuzzy matching faceted search analytics aggregations. Use cases: application search log analytics website search metrics analysis. Features: RESTful API JSON documents near real-time indexing horizontal scaling. ELK Stack: ElasticSearch Logstash Kibana. Not for: primary data store transactional data. For: search-centric applications observability. Different from: MongoDB (general document store) Solr (similar search focus).","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920166-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"ElasticSearch is a relational database","OptionFeedback":""},{"Weight":100,"Text":"Full-text search and analytics on large volumes of data with near real-time indexing","OptionFeedback":""},{"Weight":0,"Text":"Only log file storage","OptionFeedback":""},{"Weight":0,"Text":"ElasticSearch cannot handle JSON","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"Why are joins generally discouraged in NoSQL databases?","Hint":null,"Feedback":"NoSQL join challenges: data across different shards network overhead no SQL join optimization distributed coordination. Approaches: denormalize and embed data application-level joins (N\u002B1 queries) limited database joins (MongoDB $lookup). MongoDB $lookup: works but slower than SQL joins single-server only. Design principle: model data for access patterns avoid joins through embedding/duplication. Trade-off: storage/consistency for performance. When joins frequent consider if SQL better fit.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920168-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Joins are expensive across distributed shards and contradict NoSQL denormalization philosophy","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases cannot perform any joins","OptionFeedback":""},{"Weight":0,"Text":"Joins are always faster in NoSQL than SQL","OptionFeedback":""},{"Weight":0,"Text":"Joins have no performance implications","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"What are change streams in MongoDB?","Hint":null,"Feedback":"Change streams: watch for insert/update/delete/replace operations receive notifications in real-time build reactive applications trigger events. Use cases: data synchronization real-time dashboards event-driven architecture cache invalidation. Example: db.collection.watch() returns cursor with changes. Built on: oplog (operation log) replication infrastructure. Benefits: no polling efficient scalable. Similar to: database triggers CDC (Change Data Capture). Enables event-driven NoSQL applications.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920169-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Change streams are backup mechanisms","OptionFeedback":""},{"Weight":100,"Text":"Real-time notification system that watches for changes to collections or databases","OptionFeedback":""},{"Weight":0,"Text":"Change streams compress data","OptionFeedback":""},{"Weight":0,"Text":"MongoDB doesn\u0027t support change tracking","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"What are NewSQL databases attempting to achieve?","Hint":null,"Feedback":"NewSQL: SQL interface ACID transactions horizontal scalability modern architecture. Examples: CockroachDB Google Spanner VoltDB. Goals: maintain SQL semantics scale like NoSQL strong consistency distributed ACID. Approaches: new architectures (Spanner) distributed SQL (CockroachDB) in-memory (VoltDB). Use when: need SQL and scale need consistency and distribution. Trade-offs: complexity cost maturity vs traditional SQL or NoSQL. Emerging category addressing SQL scalability limitations.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920171-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Combine SQL ACID guarantees with NoSQL scalability and performance","OptionFeedback":""},{"Weight":0,"Text":"Replace all existing databases","OptionFeedback":""},{"Weight":0,"Text":"Remove SQL support entirely","OptionFeedback":""},{"Weight":0,"Text":"NewSQL is just a marketing term with no real differences","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"How does object storage like Amazon S3 differ from NoSQL databases?","Hint":null,"Feedback":"Object storage (S3 Azure Blob): large files/objects flat namespace HTTP/REST access metadata tags eventual consistency. NoSQL databases: structured/semi-structured data query capabilities indexes transactions. Use object storage for: images videos backups archives large files. Use NoSQL for: application data searchable data structured/document data relationships. Complementary: store metadata in NoSQL files in object storage. Different purposes: bulk storage vs data management.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920172-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are identical technologies","OptionFeedback":""},{"Weight":100,"Text":"Object storage is for large binary objects with HTTP access while NoSQL databases structure and query data","OptionFeedback":""},{"Weight":0,"Text":"Object storage is always faster","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases cannot store files","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"What is the primary principle for NoSQL data modeling?","Hint":null,"Feedback":"NoSQL modeling: access pattern-driven (not entity-driven) denormalize for read performance embed related data duplicate data when beneficial query-focused design. Process: identify queries design for common patterns optimize reads accept duplication. Contrast SQL: normalize entities minimize redundancy. Example: e-commerce embed product in order document even though duplicated. NoSQL inverts relational thinking: queries drive model not entities. Critical mindset shift.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920174-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always normalize to third normal form","OptionFeedback":""},{"Weight":100,"Text":"Model data based on application access patterns and query requirements","OptionFeedback":""},{"Weight":0,"Text":"Use the same model as relational databases","OptionFeedback":""},{"Weight":0,"Text":"Data modeling doesn\u0027t matter in NoSQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"What is Time-To-Live TTL in NoSQL databases?","Hint":null,"Feedback":"TTL (Time-To-Live): automatically delete documents after expiration set per document or collection background process cleanup. Use cases: sessions (expire after 30 minutes) temporary data cache entries logs/events with retention. MongoDB: createIndex({createdAt: 1}, {expireAfterSeconds: 3600}). Redis: EXPIRE key seconds. Benefits: automatic cleanup no manual deletion prevent unbounded growth. Essential for: time-bound data compliance requirements storage management. Built-in lifecycle management.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920175-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"TTL measures query response time","OptionFeedback":""},{"Weight":100,"Text":"Automatic expiration and deletion of documents after a specified time period","OptionFeedback":""},{"Weight":0,"Text":"TTL is a performance metric","OptionFeedback":""},{"Weight":0,"Text":"NoSQL doesn\u0027t support TTL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q041","Type":"MC","Title":"Question 41","QuestionText":"How does database federation differ from sharding?","Hint":null,"Feedback":"Federation: split by function (users DB orders DB products DB) vertical partitioning each database complete for its domain. Sharding: split same data type horizontally (users across 10 shards) horizontal partitioning. Federation benefits: domain isolation independent scaling technology diversity. Sharding benefits: unlimited scale for single entity load distribution. Can combine both. Federation simpler to implement sharding needed for massive single-domain scale. Choose based on requirements.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920177-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Federation splits by function across databases while sharding splits same data type across servers","OptionFeedback":""},{"Weight":0,"Text":"Federation and sharding are identical","OptionFeedback":""},{"Weight":0,"Text":"Only sharding provides scalability","OptionFeedback":""},{"Weight":0,"Text":"Federation is faster than sharding","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q042","Type":"MC","Title":"Question 42","QuestionText":"Which NoSQL databases excel at geospatial queries?","Hint":null,"Feedback":"MongoDB geospatial: 2d indexes 2dsphere indexes $near $geoWithin $geoIntersects. Redis: GEOADD GEORADIUS GEODIST. Use cases: store locator nearby search delivery zones location tracking. Example: find stores within 5km of coordinates. Benefits: built-in indexing efficient queries real-time results. ElasticSearch also strong for geo queries. Essential for: ride-sharing food delivery local search. Geospatial first-class feature in modern NoSQL.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920178-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"NoSQL databases cannot handle geospatial data","OptionFeedback":""},{"Weight":100,"Text":"MongoDB and Redis support geospatial indexes and queries for location-based features","OptionFeedback":""},{"Weight":0,"Text":"Only relational databases support geospatial queries","OptionFeedback":""},{"Weight":0,"Text":"Geospatial queries are impossible in all databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q043","Type":"MC","Title":"Question 43","QuestionText":"What are unique challenges for NoSQL backup and recovery?","Hint":null,"Feedback":"NoSQL backup challenges: distributed across nodes eventual consistency large data volumes continuous writes no single backup point. Strategies: replica snapshots (MongoDB) incremental backups streaming backups (Cassandra) point-in-time recovery. Tools: mongodump nodetool snapshot cloud-native backups. Considerations: consistency points impact on performance restore testing. More complex than single-server SQL backups. Requires planning for: data volume replication cluster coordination. Test restores regularly.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.592018-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Distributed nature eventual consistency and large scale complicate consistent backups","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases don\u0027t need backups","OptionFeedback":""},{"Weight":0,"Text":"NoSQL backups are identical to SQL backups","OptionFeedback":""},{"Weight":0,"Text":"Backups are impossible in NoSQL","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q044","Type":"MC","Title":"Question 44","QuestionText":"How do stream processing systems like Apache Kafka differ from traditional databases?","Hint":null,"Feedback":"Kafka: distributed streaming platform publish-subscribe model ordered immutable log temporary retention. Traditional DB: store and query persistent data random access CRUD operations. Kafka use cases: event streaming real-time pipelines log aggregation microservices messaging. Not a database: no queries no indexes time-based retention. Complementary: Kafka streams events database stores state. Often used together: Kafka for transport database for persistence. Different paradigm: streaming vs storage.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920181-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They are identical to NoSQL databases","OptionFeedback":""},{"Weight":100,"Text":"Process continuous data streams in real-time rather than storing and querying static data","OptionFeedback":""},{"Weight":0,"Text":"Kafka cannot store any data","OptionFeedback":""},{"Weight":0,"Text":"Stream processing is slower than databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q045","Type":"MC","Title":"Question 45","QuestionText":"What are multi-model databases?","Hint":null,"Feedback":"Multi-model databases: support multiple data models (document graph key-value columnar) in single system unified query language shared infrastructure. Examples: ArangoDB (document/graph/key-value) CosmosDB (multiple APIs) OrientDB. Benefits: reduce technology sprawl unified operations learn one system data model flexibility. Trade-offs: master of none complexity. Use when: application needs multiple models operational simplicity valued avoid polyglot persistence complexity. Growing category addressing polyglot challenges.","TopicTitle":"Quiz 11 - NoSQL and Others","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.5920182-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Databases supporting multiple data models like document key-value and graph in one system","OptionFeedback":""},{"Weight":0
