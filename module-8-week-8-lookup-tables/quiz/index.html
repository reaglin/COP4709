  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_8_(Week_8)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.2738734-05:00","NextQuestionNumber":30,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a lookup table in database design?","Hint":null,"Feedback":"A lookup table (reference table or code table) stores valid values for coded fields along with their descriptions. Example: StatusCode table with ID 1=\u0027Active\u0027 2=\u0027Inactive\u0027 3=\u0027Pending\u0027. Instead of storing \u0027Active\u0027 repeatedly in transactions you store the code 1 and join to the lookup table for descriptions. Ensures consistency and simplifies updates.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738614-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A reference table that stores coded values and their descriptive meanings used to maintain data consistency","OptionFeedback":""},{"Weight":0,"Text":"A temporary table used during query execution","OptionFeedback":""},{"Weight":0,"Text":"A table that stores user login information","OptionFeedback":""},{"Weight":0,"Text":"An index table that improves query performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What is a primary advantage of using coded data with lookup tables?","Hint":null,"Feedback":"Coded data benefits: stores compact codes (integers) vs long descriptions ensures consistency (one source of truth) simplifies updates (change description once not in millions of rows) enables data validation and reduces storage requirements. Example: storing state code \u0027CA\u0027 instead of \u0027California\u0027 repeatedly. Trade-off: requires joins for readable output.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738622-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Coded data makes queries execute slower","OptionFeedback":""},{"Weight":0,"Text":"Coded data requires more storage space","OptionFeedback":""},{"Weight":100,"Text":"Coded data ensures consistency reduces storage and simplifies updates to descriptions","OptionFeedback":""},{"Weight":0,"Text":"Coded data eliminates the need for foreign keys","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What columns should a basic lookup table typically include?","Hint":null,"Feedback":"Standard lookup table structure: Code/ID (primary key) Description (readable text) DisplayOrder (for dropdown display sequence) IsActive (soft delete/hide obsolete values) and optionally Category EffectiveDate or other metadata. Example: CREATE TABLE OrderStatus (StatusID INT PRIMARY KEY StatusName VARCHAR(50) DisplayOrder INT IsActive BIT).","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738625-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Code or ID Description and optionally DisplayOrder SortSequence or IsActive status","OptionFeedback":""},{"Weight":0,"Text":"Only the description field is needed","OptionFeedback":""},{"Weight":0,"Text":"At minimum five columns are required","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables should only contain foreign keys","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"When should you use a natural key versus a surrogate key in lookup tables?","Hint":null,"Feedback":"Natural keys (meaningful codes): state codes \u0027CA\u0027 \u0027NY\u0027 currency codes \u0027USD\u0027 \u0027EUR\u0027 when stable and universally recognized. Surrogate keys (auto-increment IDs): arbitrary status codes product types customer categories when codes are internal or may change. Natural keys improve readability but limit flexibility. Many designs use surrogate keys with unique constraints on natural codes.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738627-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use surrogate keys for all lookup tables","OptionFeedback":""},{"Weight":100,"Text":"Use natural keys when codes are meaningful and stable use surrogate keys when codes may change or are arbitrary","OptionFeedback":""},{"Weight":0,"Text":"Natural keys should never be used","OptionFeedback":""},{"Weight":0,"Text":"The choice does not matter","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"How should lookup tables be joined in queries for reporting?","Hint":null,"Feedback":"Use INNER JOIN when codes are required and must exist: SELECT O.* S.StatusName FROM Orders O INNER JOIN OrderStatus S ON O.StatusID = S.StatusID. Use LEFT JOIN when codes may be null or missing: LEFT JOIN OrderStatus S ON O.StatusID = S.StatusID. LEFT JOIN shows all orders even without status; INNER JOIN excludes orders with invalid/missing status codes.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738629-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use LEFT JOIN to preserve all main table rows or INNER JOIN when codes must exist","OptionFeedback":""},{"Weight":0,"Text":"Always use CROSS JOIN for lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables should never be joined","OptionFeedback":""},{"Weight":0,"Text":"Use FULL OUTER JOIN for all lookups","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"Which scenario is most appropriate for using a lookup table?","Hint":null,"Feedback":"Use lookup tables for: enumerated types (status types categories) finite value lists values shared across many records relatively stable sets values requiring descriptions. Do NOT use for: unique values per record highly volatile data values requiring complex attributes or free-form text. Example: OrderStatus CustomerType ProductCategory are good candidates.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738655-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Storing customer addresses that change frequently","OptionFeedback":""},{"Weight":100,"Text":"Storing a fixed list of order status values like Pending Shipped Delivered Cancelled","OptionFeedback":""},{"Weight":0,"Text":"Storing product descriptions that vary by customer","OptionFeedback":""},{"Weight":0,"Text":"Storing transaction timestamps","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What is a common naming convention for lookup tables?","Hint":null,"Feedback":"Common conventions: prefix (lkp_Status lkp_Category) suffix (Status_Lookup Category_Lookup) or descriptive endings (OrderStatus CustomerType ProductCategory). Consistency is key. Choose one convention and apply throughout database. Clear naming helps developers identify lookup tables and understand their purpose. Avoid generic names like \u0027Codes\u0027 or \u0027Reference\u0027.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738657-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Prefix or suffix indicating lookup nature like lkp_ prefix or _Lookup suffix or descriptive names ending in Type Status or Category","OptionFeedback":""},{"Weight":0,"Text":"All lookup tables must be named Table1 Table2 etc","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables should have random names","OptionFeedback":""},{"Weight":0,"Text":"Naming conventions are not important","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is the best practice for modifying lookup table values?","Hint":null,"Feedback":"Best practices: add new codes rather than modifying existing use IsActive/IsDeleted flags for soft deletes never physically delete codes referenced by historical data update descriptions carefully (may affect reporting) and consider EffectiveDate/EndDate for time-based changes. Example: set IsActive=0 instead of DELETE to hide obsolete codes while preserving history.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738659-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Delete old values and insert new ones whenever changes are needed","OptionFeedback":""},{"Weight":100,"Text":"Add new values and soft-delete old ones using IsActive flag to preserve historical data integrity","OptionFeedback":""},{"Weight":0,"Text":"Update descriptions directly for all changes","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables should never be modified after creation","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"Should you combine multiple code types into one generic lookup table or use separate tables?","Hint":null,"Feedback":"Separate tables preferred: OrderStatus CustomerType PaymentMethod each as own table. Benefits: clear purpose type-safe foreign keys better performance simpler queries and independent maintenance. Generic table (CodeType\u002BCode\u002BDescription) creates ambiguity weak typing complex queries and maintenance challenges. Exception: truly generic application configuration values may share one table.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738662-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Generally use separate tables for each code type for better clarity referential integrity and performance","OptionFeedback":""},{"Weight":0,"Text":"Always combine all codes into one table","OptionFeedback":""},{"Weight":0,"Text":"It makes no difference either way","OptionFeedback":""},{"Weight":0,"Text":"Use separate tables only for large code sets","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"How can you minimize performance impact of multiple lookup table joins?","Hint":null,"Feedback":"Optimization strategies: index foreign key columns in main tables (CREATE INDEX idx_StatusID ON Orders(StatusID)) keep lookup tables small and cached use views encapsulating common joins consider indexed views for complex lookups limit number of lookup joins per query. Well-indexed small lookup tables have minimal performance impact. Joins to tiny cached tables are very fast.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738665-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Avoid using lookup tables entirely","OptionFeedback":""},{"Weight":0,"Text":"Denormalize all lookup values into main tables","OptionFeedback":""},{"Weight":100,"Text":"Ensure foreign keys are indexed and consider views or indexed views for frequently joined lookups","OptionFeedback":""},{"Weight":0,"Text":"Use CROSS JOIN instead of INNER JOIN","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What are cascading or hierarchical lookup tables?","Hint":null,"Feedback":"Cascading lookups have parent-child relationships. Example: Country \u2192 State \u2192 City where states depend on country. Implementation: StateTable has CountryID foreign key. Used in UIs for dependent dropdowns. Query: SELECT * FROM States WHERE CountryID = @SelectedCountry. Enables contextual value lists ensuring data integrity across hierarchical choices.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738667-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Lookup tables where valid values in one depend on the selection in another creating parent-child relationships","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables that automatically delete related records","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables stored in multiple databases","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables that update automatically","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"How should lookup tables be designed to support multiple languages?","Hint":null,"Feedback":"Internationalization approaches: 1) Translation table: StatusID LanguageCode Description allowing multiple rows per status. 2) Multiple description columns: DescriptionEN DescriptionFR (limited scalability). Query: SELECT S.StatusID T.Description FROM Status S JOIN StatusTranslation T ON S.StatusID=T.StatusID WHERE T.LanguageCode=\u0027FR\u0027. First approach more maintainable and scalable.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738669-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Create separate databases for each language","OptionFeedback":""},{"Weight":100,"Text":"Use a related translation table linking codes to descriptions in multiple languages","OptionFeedback":""},{"Weight":0,"Text":"Store all languages in one description column separated by delimiters","OptionFeedback":""},{"Weight":0,"Text":"Internationalization is not possible with lookup tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What is lookup table seeding and when should it occur?","Hint":null,"Feedback":"Seeding inserts initial lookup values during database setup. Include in: migration scripts deployment procedures or database initialization. Example: INSERT INTO OrderStatus VALUES (1 \u0027Pending\u0027 1) (2 \u0027Shipped\u0027 2). Ensures consistency across environments required values exist before application use and provides version control for reference data. Use database migration tools like Flyway or Liquibase.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738671-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Pre-populating lookup tables with initial valid values typically during database deployment or migration scripts","OptionFeedback":""},{"Weight":0,"Text":"Allowing users to add values through the application","OptionFeedback":""},{"Weight":0,"Text":"Importing values from production to development","OptionFeedback":""},{"Weight":0,"Text":"Automatically generating codes at runtime","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"How should coded data be handled in reports and user interfaces?","Hint":null,"Feedback":"Best practices: always display descriptions in UI/reports include codes only when needed for technical reference use views encapsulating lookup joins for consistency and handle null/invalid codes gracefully. Example: SELECT O.OrderID S.StatusName AS Status FROM Orders O LEFT JOIN OrderStatus S ON O.StatusID=S.StatusID. Users see \u0027Shipped\u0027 not \u00272\u0027.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738674-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Display only the numeric codes","OptionFeedback":""},{"Weight":100,"Text":"Join to lookup tables to display descriptive text while optionally showing codes for reference","OptionFeedback":""},{"Weight":0,"Text":"Use computed columns to hardcode descriptions","OptionFeedback":""},{"Weight":0,"Text":"Require users to memorize code meanings","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"When should you use application enums versus database lookup tables?","Hint":null,"Feedback":"Use enums when: values are truly fixed (days of week) defined at compile time never change and simple true/false/pending states. Use lookup tables when: business users may add values descriptions may change values need display order or users need control without deployments. Hybrid: enum in code matching lookup table IDs combining type safety with database flexibility.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738677-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Use enums for truly fixed values that never change and lookup tables for values that may be added or modified","OptionFeedback":""},{"Weight":0,"Text":"Always use enums never use lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Always use lookup tables never use enums","OptionFeedback":""},{"Weight":0,"Text":"Use enums only for boolean values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"Should foreign keys to lookup tables always enforce referential integrity?","Hint":null,"Feedback":"Foreign keys to lookup tables: prevent invalid codes ensure codes exist before use support cascading rules and validate data integrity. Example: ALTER TABLE Orders ADD CONSTRAINT FK_Orders_Status FOREIGN KEY (StatusID) REFERENCES OrderStatus(StatusID). Challenge: prevents deleting lookup values with historical references. Solution: use IsActive flags instead of physical deletes.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738679-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Generally yes to ensure data integrity but consider impacts on archival and historical data scenarios","OptionFeedback":""},{"Weight":0,"Text":"Never use foreign key constraints on lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Foreign keys are optional and provide no benefit","OptionFeedback":""},{"Weight":0,"Text":"Use foreign keys only in production environments","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"When should you use bitwise flags instead of lookup tables?","Hint":null,"Feedback":"Use bitwise flags for: multiple simultaneous states (permissions: Read=1 Write=2 Delete=4) boolean attributes that coexist and bitmask operations. Use lookup tables for: mutually exclusive values (status can only be one value) descriptive text needed or business-user maintenance. Example: User can have Read\u002BWrite permissions (flags) but Order has only one status (lookup).","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738681-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always use bitwise flags instead of lookup tables","OptionFeedback":""},{"Weight":100,"Text":"Use bitwise flags for multiple simultaneous boolean attributes and lookup tables for mutually exclusive values","OptionFeedback":""},{"Weight":0,"Text":"Bitwise flags and lookup tables serve the same purpose","OptionFeedback":""},{"Weight":0,"Text":"Never use bitwise flags","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"How should default values be handled for lookup table foreign keys?","Hint":null,"Feedback":"Default strategies: database DEFAULT constraint (StatusID INT DEFAULT 1) application-level defaults or triggers for complex logic. Document default meanings clearly. Example: DEFAULT 1 for \u0027Pending\u0027 status on Orders. Ensure default codes exist in lookup table. Alternative: allow NULL when no default is appropriate then require user selection.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738688-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Define defaults at application or database level using DEFAULT constraint or trigger with clearly documented default code","OptionFeedback":""},{"Weight":0,"Text":"Never use defaults for lookup codes","OptionFeedback":""},{"Weight":0,"Text":"Always default to NULL","OptionFeedback":""},{"Weight":0,"Text":"Generate random default codes","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Why is auditing lookup table changes important?","Hint":null,"Feedback":"Audit lookup changes because: description changes affect report interpretation code additions/deletions impact queries timing of changes matters for historical accuracy and compliance may require change tracking. Implement: audit triggers temporal tables or change tracking. Example: if \u0027Pending\u0027 description changes to \u0027Awaiting Review\u0027 historical reports change meaning.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.273869-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Auditing lookup tables is unnecessary","OptionFeedback":""},{"Weight":0,"Text":"Only transactional tables need auditing","OptionFeedback":""},{"Weight":100,"Text":"Changes to lookup values affect historical data interpretation and reporting accuracy","OptionFeedback":""},{"Weight":0,"Text":"Auditing slows performance too much","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What is the benefit of caching lookup tables in application memory?","Hint":null,"Feedback":"Cache lookup tables because: data changes infrequently small data size fits memory frequent access in queries and reduces database load. Implementation: load at application start refresh periodically or on updates and consider distributed caching for multiple servers. Example: cache all status/type lookups load once use thousands of times. Balance freshness needs with performance gains.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738693-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Reduces database queries for frequently accessed stable reference data improving application performance","OptionFeedback":""},{"Weight":0,"Text":"Caching eliminates the need for the database","OptionFeedback":""},{"Weight":0,"Text":"Caching makes data less accurate","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables cannot be cached","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What is the best approach for handling deprecated or obsolete lookup values?","Hint":null,"Feedback":"Handle deprecated values with: IsActive=0 flag (hide in dropdowns) EndDate field (track when deprecated) keep in table (preserve references) and display with indicators in reports (\u0027Discontinued\u0027). Never DELETE codes with historical references. Query: WHERE IsActive=1 for current lists WHERE IsActive=0 AND OrderDate \u003C EndDate for historical. Maintains data integrity.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738695-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Immediately delete deprecated values from the lookup table","OptionFeedback":""},{"Weight":100,"Text":"Mark as inactive with IsActive flag and EndDate while keeping for historical data integrity","OptionFeedback":""},{"Weight":0,"Text":"Update all historical records to use new values","OptionFeedback":""},{"Weight":0,"Text":"Create new lookup tables for new values","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"When should lookup tables use composite keys?","Hint":null,"Feedback":"Use composite keys when: natural key spans multiple columns (State: CountryCode \u002B StateCode) hierarchy inherent in identification or avoiding meaningless surrogate keys. Example: PRIMARY KEY (CountryCode StateCode) for States table. Referencing tables need both columns. Trade-off: more complex foreign keys but more meaningful relationships. Often combine with surrogate key for simplicity.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738697-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"When lookup values are naturally identified by multiple attributes like CountryCode and StateCode","OptionFeedback":""},{"Weight":0,"Text":"Always use composite keys for all lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Never use composite keys","OptionFeedback":""},{"Weight":0,"Text":"Only when tables have more than 100 rows","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What query pattern optimizes repeated lookup joins?","Hint":null,"Feedback":"Create views with embedded lookups: CREATE VIEW vw_OrdersWithDescriptions AS SELECT O.* S.StatusName T.TypeName FROM Orders O JOIN OrderStatus S ON O.StatusID=S.StatusID JOIN OrderType T ON O.TypeID=T.TypeID. Benefits: consistent join logic simplified queries centralized maintenance and easier for report users. Applications query views instead of writing complex joins repeatedly.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738701-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Repeat JOIN clauses in every query","OptionFeedback":""},{"Weight":0,"Text":"Avoid using lookups in queries","OptionFeedback":""},{"Weight":100,"Text":"Create views that encapsulate common lookup joins for consistency and simplicity","OptionFeedback":""},{"Weight":0,"Text":"Use subqueries instead of joins","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What are dynamic or user-configurable lookup tables?","Hint":null,"Feedback":"Dynamic lookups allow business users to: add new codes through UI modify descriptions deactivate obsolete values and manage reference data. Requires: admin interface validation rules audit logging and appropriate permissions. Example: product categories customizable by client. More flexible than hardcoded enums but requires governance to prevent proliferation.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738703-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Lookup tables that change randomly","OptionFeedback":""},{"Weight":100,"Text":"Lookup tables where business users can add modify or deactivate values through application interfaces","OptionFeedback":""},{"Weight":0,"Text":"Lookup tables that generate values automatically","OptionFeedback":""},{"Weight":0,"Text":"Temporary tables used during processing","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"What validation should be implemented for lookup table data?","Hint":null,"Feedback":"Implement validation: UNIQUE on code/description prevent duplicates NOT NULL on required fields CHECK constraints for valid ranges (DisplayOrder \u003E 0) and foreign keys for hierarchical lookups. Example: ALTER TABLE Status ADD CONSTRAINT UK_StatusCode UNIQUE(StatusCode) ADD CONSTRAINT CK_DisplayOrder CHECK(DisplayOrder \u003E= 0). Database-level validation ensures integrity regardless of access method.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738705-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Unique constraints on codes CHECK constraints for valid values and NOT NULL on required fields","OptionFeedback":""},{"Weight":0,"Text":"No validation is needed for lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Only foreign key validation is sufficient","OptionFeedback":""},{"Weight":0,"Text":"Validation should only occur in application code","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"How should lookup tables be handled during data migration?","Hint":null,"Feedback":"Migration steps: 1) Analyze source lookup values 2) Create/seed target lookup tables 3) Create mapping table (SourceCode -\u003E TargetCode) 4) Migrate transactional data using mappings 5) Validate foreign key integrity. Example: map legacy status codes to new standardized codes. Document mappings. Handle unmapped codes with defaults or errors. Test thoroughly.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738707-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Migrate and map lookup codes first then migrate transactional data using mapped codes","OptionFeedback":""},{"Weight":0,"Text":"Migrate transactional data first then add lookups","OptionFeedback":""},{"Weight":0,"Text":"Ignore lookup tables during migration","OptionFeedback":""},{"Weight":0,"Text":"Recreate all lookup relationships after migration","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"When might you denormalize and embed lookup descriptions directly in transaction tables?","Hint":null,"Feedback":"Consider denormalization for: data warehouses (snapshot descriptions at transaction time) high-read scenarios with prohibitive join costs archival/historical records or reporting-only databases. Maintain normalized OLTP system. Example: store StatusDescription in Orders for data warehouse preserving description as it existed when order was placed. Trade-off: more storage redundancy but simpler queries.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738709-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Always denormalize for better performance","OptionFeedback":""},{"Weight":100,"Text":"Only for static historical snapshots reporting databases or when join overhead is prohibitive","OptionFeedback":""},{"Weight":0,"Text":"Never denormalize lookup data","OptionFeedback":""},{"Weight":0,"Text":"Denormalize randomly without reason","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"Should CHECK constraints reference lookup table values?","Hint":null,"Feedback":"Cannot use: CHECK (StatusID IN (SELECT StatusID FROM Status)) - not supported in SQL Server. Use foreign keys instead: FOREIGN KEY (StatusID) REFERENCES Status(StatusID). Foreign keys provide proper referential integrity enforce valid codes and cascade options. CHECK constraints limited to same-table validation. Example: CHECK(StatusID BETWEEN 1 AND 10) too rigid vs foreign key to Status table.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738712-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Yes always use CHECK constraints for lookup validation","OptionFeedback":""},{"Weight":100,"Text":"No use foreign keys instead as CHECK constraints cannot reference other tables","OptionFeedback":""},{"Weight":0,"Text":"CHECK constraints are superior to foreign keys","OptionFeedback":""},{"Weight":0,"Text":"Neither CHECK constraints nor foreign keys are needed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"Should lookup tables be partitioned?","Hint":null,"Feedback":"Lookup tables typically too small for partitioning benefits (usually \u003C 1000 rows). Partitioning adds: maintenance complexity query complexity and minimal benefit for small tables. Focus partitioning on: large transaction tables fact tables or historical archives. Lookup tables benefit more from proper indexing and caching. Exception: massive multi-tenant systems with thousands of codes per tenant.","TopicTitle":"Quiz 7 - Coded Data","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.2738714-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Generally no - lookup tables are small and partitioning adds unnecessary complexity","OptionFeedback":""},{"Weight":0,"Text":"Always partition all lookup tables","OptionFeedback":""},{"Weight":0,"Text":"Partition only tables with more than 10 rows","OptionFeedback":""},{"Weight":0,"Text":"Partitioning is required for foreign key relationships","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
