  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_1_(Week_1)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:08.7908172-05:00","NextQuestionNumber":36,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is a Database Management System (DBMS)?","Hint":null,"Feedback":"A DBMS is software that provides an interface between the database and users/applications. It handles data definition storage retrieval and management while ensuring data integrity security and concurrent access.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7906797-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A programming language used exclusively for web development","OptionFeedback":""},{"Weight":100,"Text":"Software that enables users to define create maintain and control access to databases","OptionFeedback":""},{"Weight":0,"Text":"A hardware component that stores data on physical disks","OptionFeedback":""},{"Weight":0,"Text":"A network protocol for transferring files between computers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"In a relational database what is the primary organizational structure for storing data?","Hint":null,"Feedback":"Relational databases organize data into tables consisting of rows (records) and columns (fields). Each table represents an entity and relationships between tables are established through keys.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907111-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Documents with nested fields","OptionFeedback":""},{"Weight":0,"Text":"Key-value pairs stored in memory","OptionFeedback":""},{"Weight":100,"Text":"Tables with rows and columns","OptionFeedback":""},{"Weight":0,"Text":"Graph nodes connected by edges","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"What is the primary purpose of SQL (Structured Query Language)?","Hint":null,"Feedback":"SQL is a standardized language for interacting with relational databases. It allows users to query data (SELECT) insert records (INSERT) update existing data (UPDATE) delete records (DELETE) and define database structures (CREATE ALTER DROP).","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907115-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To query manipulate and manage data in relational databases","OptionFeedback":""},{"Weight":0,"Text":"To create graphical user interfaces for applications","OptionFeedback":""},{"Weight":0,"Text":"To compile high-level programming code into machine language","OptionFeedback":""},{"Weight":0,"Text":"To encrypt sensitive data during network transmission","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What distinguishes NoSQL databases from traditional relational databases?","Hint":null,"Feedback":"NoSQL databases offer schema flexibility allowing different records to have different structures. They are designed to scale horizontally across multiple servers and often sacrifice some ACID properties for better performance and scalability.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907119-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"NoSQL databases can only store numerical data","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases require more storage space than relational databases","OptionFeedback":""},{"Weight":0,"Text":"NoSQL databases must use SQL for all queries","OptionFeedback":""},{"Weight":100,"Text":"NoSQL databases use flexible schemas and are designed for horizontal scalability","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What is the function of a primary key in a database table?","Hint":null,"Feedback":"A primary key is a column or set of columns that uniquely identifies each row in a table. It must contain unique values and cannot contain NULL values. Primary keys are essential for establishing relationships between tables and ensuring data integrity.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.790713-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To encrypt all data in the table for security purposes","OptionFeedback":""},{"Weight":100,"Text":"To uniquely identify each record in the table","OptionFeedback":""},{"Weight":0,"Text":"To establish the order in which records are displayed","OptionFeedback":""},{"Weight":0,"Text":"To determine which users can access the table","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"How do document-oriented databases like MongoDB store data?","Hint":null,"Feedback":"Document databases store data as JSON-like documents (BSON in MongoDB\u0027s case) which can contain nested arrays and subdocuments. This flexible structure allows each document to have different fields making it ideal for evolving data models.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907138-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"As fixed-width rows in tables with predefined columns","OptionFeedback":""},{"Weight":0,"Text":"As simple key-value pairs with no structure","OptionFeedback":""},{"Weight":100,"Text":"As JSON-like documents with flexible nested structures","OptionFeedback":""},{"Weight":0,"Text":"As interconnected nodes in a graph structure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"What do the ACID properties in database transactions ensure?","Hint":null,"Feedback":"ACID properties guarantee reliable transaction processing: Atomicity ensures all-or-nothing execution Consistency maintains data integrity rules Isolation prevents interference between concurrent transactions and Durability ensures committed changes persist even after system failures.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907141-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Atomicity Consistency Isolation and Durability for reliable transactions","OptionFeedback":""},{"Weight":0,"Text":"Automatic Creation of Indexes and Data compression","OptionFeedback":""},{"Weight":0,"Text":"Advanced Caching for Improved Database performance","OptionFeedback":""},{"Weight":0,"Text":"Automated Cleanup of Invalid Data entries","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What type of database is MySQL?","Hint":null,"Feedback":"MySQL is one of the most popular open-source relational database management systems. It uses SQL for queries stores data in tables with defined schemas and supports ACID transactions. It is widely used in web applications and is part of the LAMP stack.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907144-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A document-oriented NoSQL database","OptionFeedback":""},{"Weight":0,"Text":"A graph database for network data","OptionFeedback":""},{"Weight":0,"Text":"A key-value store for caching","OptionFeedback":""},{"Weight":100,"Text":"An open-source relational database management system","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What is the purpose of a foreign key in a relational database?","Hint":null,"Feedback":"A foreign key is a column that references the primary key of another table establishing a relationship between the two tables. It enforces referential integrity by ensuring that values in the foreign key column exist in the referenced table\u0027s primary key.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907147-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To encrypt data when transferring between tables","OptionFeedback":""},{"Weight":100,"Text":"To establish and enforce relationships between tables","OptionFeedback":""},{"Weight":0,"Text":"To automatically generate unique identifiers for new records","OptionFeedback":""},{"Weight":0,"Text":"To improve query performance through indexing","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What type of database is Redis primarily designed as?","Hint":null,"Feedback":"Redis is an in-memory key-value data store known for extremely fast read and write operations. It is commonly used for caching session management real-time analytics and message queuing. Data is stored in RAM for speed but can be persisted to disk.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907151-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"An in-memory key-value store for fast data access","OptionFeedback":""},{"Weight":0,"Text":"A relational database with full SQL support","OptionFeedback":""},{"Weight":0,"Text":"A document database for storing JSON files","OptionFeedback":""},{"Weight":0,"Text":"A columnar database for analytics workloads","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"What is the primary goal of database normalization?","Hint":null,"Feedback":"Normalization is the process of organizing database tables to minimize redundancy and dependency. By dividing large tables into smaller related tables and defining relationships between them normalization reduces data duplication and improves data integrity.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907154-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To increase data redundancy for backup purposes","OptionFeedback":""},{"Weight":0,"Text":"To combine all data into a single large table","OptionFeedback":""},{"Weight":100,"Text":"To reduce data redundancy and improve data integrity","OptionFeedback":""},{"Weight":0,"Text":"To encrypt sensitive information in the database","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"Which scenario is best suited for a graph database?","Hint":null,"Feedback":"Graph databases like Neo4j are ideal for data with complex relationships such as social networks recommendation engines fraud detection and knowledge graphs. They store data as nodes and relationships allowing efficient traversal of connections.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907157-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Storing simple configuration settings as key-value pairs","OptionFeedback":""},{"Weight":100,"Text":"Modeling social network relationships and friend connections","OptionFeedback":""},{"Weight":0,"Text":"Managing financial transactions with strict ACID requirements","OptionFeedback":""},{"Weight":0,"Text":"Storing large volumes of time-series sensor data","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"What distinguishes PostgreSQL from other relational databases?","Hint":null,"Feedback":"PostgreSQL is an advanced open-source relational database known for its robustness extensibility and standards compliance. It supports complex data types (JSON arrays custom types) advanced indexing full-text search and custom extensions making it suitable for complex applications.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907177-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It only supports basic SQL queries without advanced features","OptionFeedback":""},{"Weight":0,"Text":"It is a proprietary database requiring expensive licensing","OptionFeedback":""},{"Weight":100,"Text":"It is an advanced open-source database with support for complex data types and extensions","OptionFeedback":""},{"Weight":0,"Text":"It is designed exclusively for small-scale applications","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What is the primary purpose of creating an index on a database column?","Hint":null,"Feedback":"Database indexes are data structures that improve the speed of data retrieval operations. Like a book\u0027s index they allow the database to find rows without scanning the entire table. However indexes consume additional storage space and can slow down write operations.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.790718-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To speed up data retrieval operations on that column","OptionFeedback":""},{"Weight":0,"Text":"To prevent duplicate values from being entered","OptionFeedback":""},{"Weight":0,"Text":"To automatically sort the data alphabetically","OptionFeedback":""},{"Weight":0,"Text":"To compress the data to save storage space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"In MongoDB what is a collection?","Hint":null,"Feedback":"In MongoDB a collection is a group of documents similar to a table in relational databases. However unlike tables collections do not enforce a schema allowing documents within the same collection to have different structures.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907182-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A single JSON document stored in the database","OptionFeedback":""},{"Weight":100,"Text":"A group of related documents similar to a table in relational databases","OptionFeedback":""},{"Weight":0,"Text":"A backup copy of the entire database","OptionFeedback":""},{"Weight":0,"Text":"A set of indexes that improve query performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"What is the primary purpose of a data warehouse?","Hint":null,"Feedback":"A data warehouse is a centralized repository designed for storing and analyzing large volumes of historical data from multiple sources. It is optimized for complex queries and reporting supporting business intelligence decision-making and data mining activities.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907186-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To process real-time transactions for e-commerce applications","OptionFeedback":""},{"Weight":0,"Text":"To cache frequently accessed data in memory","OptionFeedback":""},{"Weight":100,"Text":"To store and analyze large volumes of historical data for business intelligence","OptionFeedback":""},{"Weight":0,"Text":"To manage user authentication and access control","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"What is a key advantage of columnar databases for analytics?","Hint":null,"Feedback":"Columnar databases store data by columns rather than rows making them highly efficient for analytical queries that aggregate specific columns. This storage format enables better compression (similar values stored together) and reduces I/O by reading only needed columns.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907188-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"They require less storage space than any other database type","OptionFeedback":""},{"Weight":0,"Text":"They provide better support for transactional workloads","OptionFeedback":""},{"Weight":100,"Text":"They enable efficient compression and faster aggregation of specific columns","OptionFeedback":""},{"Weight":0,"Text":"They eliminate the need for indexes on any columns","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is a database transaction?","Hint":null,"Feedback":"A transaction is a logical unit of work consisting of one or more operations that must be executed completely or not at all. Transactions ensure data consistency through ACID properties allowing rollback if any operation fails.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907191-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"A sequence of one or more database operations treated as a single unit of work","OptionFeedback":""},{"Weight":0,"Text":"A backup copy of the database created at a specific point in time","OptionFeedback":""},{"Weight":0,"Text":"A report generated from database queries for business analysis","OptionFeedback":""},{"Weight":0,"Text":"A connection between a client application and the database server","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"What makes SQLite particularly suitable for mobile and embedded applications?","Hint":null,"Feedback":"SQLite is a self-contained serverless database engine that requires no separate server process. It reads and writes directly to disk files making it ideal for mobile apps embedded systems and applications where simplicity and minimal configuration are important.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907194-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It requires a separate server process to run","OptionFeedback":""},{"Weight":100,"Text":"It is a lightweight serverless database embedded directly into applications","OptionFeedback":""},{"Weight":0,"Text":"It only works with specific mobile operating systems","OptionFeedback":""},{"Weight":0,"Text":"It requires constant internet connectivity to function","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What is a database schema?","Hint":null,"Feedback":"A database schema is the logical structure that defines how data is organized in a database. It includes table definitions column data types constraints relationships and other structural elements. The schema acts as a blueprint for the database.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907202-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The physical hardware configuration of the database server","OptionFeedback":""},{"Weight":0,"Text":"A backup strategy for protecting database contents","OptionFeedback":""},{"Weight":100,"Text":"The logical structure and organization of the database including tables columns and relationships","OptionFeedback":""},{"Weight":0,"Text":"A security protocol for encrypting database connections","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"What type of NoSQL database is Apache Cassandra?","Hint":null,"Feedback":"Apache Cassandra is a wide-column store NoSQL database designed for handling large amounts of data across distributed commodity servers. It provides high availability with no single point of failure and offers excellent write performance and linear scalability.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907204-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A document-oriented database for JSON storage","OptionFeedback":""},{"Weight":100,"Text":"A wide-column store designed for distributed scalability","OptionFeedback":""},{"Weight":0,"Text":"A graph database for relationship modeling","OptionFeedback":""},{"Weight":0,"Text":"An in-memory key-value store for caching","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"Why are regular database backups critical?","Hint":null,"Feedback":"Regular backups are essential for data protection and business continuity. They enable recovery from hardware failures data corruption security breaches accidental deletions or natural disasters. A comprehensive backup strategy includes full incremental and differential backups stored securely offsite.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907206-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To recover data in case of hardware failure corruption or accidental deletion","OptionFeedback":""},{"Weight":0,"Text":"To improve query performance and speed up data retrieval","OptionFeedback":""},{"Weight":0,"Text":"To reduce the storage space required by the database","OptionFeedback":""},{"Weight":0,"Text":"To automatically update the database schema structure","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"What is the purpose of a JOIN operation in SQL?","Hint":null,"Feedback":"JOIN operations combine rows from two or more tables based on related columns. Common types include INNER JOIN (matching rows only) LEFT/RIGHT JOIN (all rows from one table) and FULL OUTER JOIN (all rows from both tables). JOINs are fundamental for retrieving related data in normalized databases.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907208-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To create a new empty table in the database","OptionFeedback":""},{"Weight":0,"Text":"To delete duplicate records from a table","OptionFeedback":""},{"Weight":100,"Text":"To combine rows from multiple tables based on related columns","OptionFeedback":""},{"Weight":0,"Text":"To split a large table into smaller tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"What type of data is a time-series database optimized for?","Hint":null,"Feedback":"Time-series databases like InfluxDB and TimescaleDB are optimized for storing and querying data indexed by time. They excel at handling IoT sensor data application metrics financial tick data and monitoring data providing efficient storage and fast time-based queries.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.790721-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Complex hierarchical organizational structures","OptionFeedback":""},{"Weight":100,"Text":"Data points indexed by timestamp such as sensor readings or metrics","OptionFeedback":""},{"Weight":0,"Text":"Unstructured text documents and binary files","OptionFeedback":""},{"Weight":0,"Text":"Many-to-many relationships between entities","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"Which of the following is NOT a common type of database constraint?","Hint":null,"Feedback":"Common constraints include NOT NULL (requires a value) UNIQUE (ensures distinct values) PRIMARY KEY (unique identifier) FOREIGN KEY (referential integrity) and CHECK (validates values). There is no standard COMPRESS constraint - compression is typically a storage option not a data integrity constraint.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907212-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"NOT NULL constraint preventing null values","OptionFeedback":""},{"Weight":0,"Text":"UNIQUE constraint ensuring distinct values","OptionFeedback":""},{"Weight":0,"Text":"FOREIGN KEY constraint enforcing referential integrity","OptionFeedback":""},{"Weight":100,"Text":"COMPRESS constraint automatically reducing data size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What is the purpose of an Object-Relational Mapping (ORM) tool?","Hint":null,"Feedback":"ORM tools like Hibernate Entity Framework and SQLAlchemy map object-oriented programming objects to database tables. They automatically generate SQL queries handle relationships and allow developers to work with databases using their programming language\u0027s objects rather than writing SQL directly.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907218-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To map object-oriented programming objects to database tables automatically","OptionFeedback":""},{"Weight":0,"Text":"To optimize database queries for faster performance","OptionFeedback":""},{"Weight":0,"Text":"To create graphical representations of database schemas","OptionFeedback":""},{"Weight":0,"Text":"To compress database files for efficient storage","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"What is the primary benefit of database replication?","Hint":null,"Feedback":"Database replication maintains copies of data across multiple servers providing high availability fault tolerance and the ability to distribute read operations. If one server fails others can continue serving requests. Replication also enables geographic distribution for better performance.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.790722-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"It automatically fixes corrupted data in the database","OptionFeedback":""},{"Weight":0,"Text":"It reduces the storage space required for the database","OptionFeedback":""},{"Weight":100,"Text":"It improves availability and enables load distribution across multiple servers","OptionFeedback":""},{"Weight":0,"Text":"It eliminates the need for database backups","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"What type of database is Elasticsearch primarily designed as?","Hint":null,"Feedback":"Elasticsearch is a distributed search and analytics engine built on Apache Lucene. It uses inverted indexes to enable fast full-text search and is commonly used for log analysis application search monitoring and real-time analytics. It stores documents in JSON format.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907221-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A traditional relational database for transactional data","OptionFeedback":""},{"Weight":100,"Text":"A distributed search and analytics engine built on inverted indexes","OptionFeedback":""},{"Weight":0,"Text":"A key-value store for simple data caching","OptionFeedback":""},{"Weight":0,"Text":"A graph database for social network analysis","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What is a database view?","Hint":null,"Feedback":"A view is a virtual table defined by a SQL query. It does not store data itself but presents data from underlying tables. Views can simplify complex queries provide security by restricting access to specific columns/rows and present data in different formats without duplicating storage.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907223-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A graphical interface for managing database tables","OptionFeedback":""},{"Weight":0,"Text":"A backup snapshot of the database at a specific time","OptionFeedback":""},{"Weight":100,"Text":"A virtual table based on a SQL query that can simplify complex queries","OptionFeedback":""},{"Weight":0,"Text":"A monitoring tool that displays database performance metrics","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"According to the CAP theorem what three properties cannot all be simultaneously guaranteed in a distributed database?","Hint":null,"Feedback":"The CAP theorem states that distributed databases can only guarantee two of three properties: Consistency (all nodes see the same data) Availability (system responds to requests) and Partition Tolerance (system functions despite network failures). Different databases make different trade-offs.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907225-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Consistency Availability and Partition Tolerance","OptionFeedback":""},{"Weight":0,"Text":"Compression Atomicity and Performance","OptionFeedback":""},{"Weight":0,"Text":"Caching Authentication and Privacy","OptionFeedback":""},{"Weight":0,"Text":"Capacity Accessibility and Processing Speed","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"What is database sharding?","Hint":null,"Feedback":"Sharding is a horizontal partitioning technique that distributes data across multiple database servers (shards). Each shard contains a subset of the data based on a sharding key. This approach enables scaling beyond single-server limitations and improves performance for large datasets.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907226-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Creating backup copies of the database on separate servers","OptionFeedback":""},{"Weight":100,"Text":"Horizontally partitioning data across multiple database instances","OptionFeedback":""},{"Weight":0,"Text":"Encrypting sensitive data before storing it in the database","OptionFeedback":""},{"Weight":0,"Text":"Removing old or unused data to free up storage space","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"What distinguishes OLTP (Online Transaction Processing) from OLAP (Online Analytical Processing) databases?","Hint":null,"Feedback":"OLTP systems are optimized for fast frequent transactions (inserts updates deletes) supporting day-to-day operations. OLAP systems are optimized for complex queries and analysis of large historical datasets supporting business intelligence and decision-making. They have different design priorities and indexing strategies.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907229-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"OLTP databases are always NoSQL while OLAP databases are always relational","OptionFeedback":""},{"Weight":0,"Text":"OLTP databases store more data than OLAP databases","OptionFeedback":""},{"Weight":100,"Text":"OLTP focuses on fast transaction processing while OLAP focuses on complex analytical queries","OptionFeedback":""},{"Weight":0,"Text":"OLTP databases require more expensive hardware than OLAP databases","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"What is a stored procedure in a database?","Hint":null,"Feedback":"A stored procedure is a precompiled collection of SQL statements and procedural logic stored in the database. It can accept parameters perform complex operations and return results. Stored procedures improve performance through reuse reduce network traffic and centralize business logic.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907231-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"A temporary table that stores intermediate query results","OptionFeedback":""},{"Weight":0,"Text":"A log file that records all database transactions","OptionFeedback":""},{"Weight":100,"Text":"A precompiled set of SQL statements stored in the database and executed as a unit","OptionFeedback":""},{"Weight":0,"Text":"A backup mechanism that automatically saves data at regular intervals","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"What is a database trigger?","Hint":null,"Feedback":"A trigger is procedural code that automatically executes when specific events occur in the database such as INSERT UPDATE or DELETE operations. Triggers are used to enforce complex business rules maintain audit trails automatically update related data or prevent invalid modifications.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907234-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Automated code that executes in response to specific database events like INSERT UPDATE or DELETE","OptionFeedback":""},{"Weight":0,"Text":"A scheduled job that runs database maintenance tasks at set times","OptionFeedback":""},{"Weight":0,"Text":"A button in the database management interface that starts a backup","OptionFeedback":""},{"Weight":0,"Text":"A performance monitoring tool that alerts administrators to problems","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What is the purpose of database connection pooling?","Hint":null,"Feedback":"Connection pooling maintains a cache of reusable database connections. Instead of creating a new connection for each request applications borrow from the pool and return connections when done. This reduces overhead improves performance and manages resource usage efficiently since creating connections is expensive.","TopicTitle":"Quiz 1 - General Databases","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:08.7907241-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"To store multiple copies of data across different servers","OptionFeedback":""},{"Weight":0,"Text":"To combine multiple small databases into one large database","OptionFeedback":""},{"Weight":100,"Text":"To reuse database connections efficiently and reduce the overhead of creating new connections","OptionFeedback":""},{"Weight":0,"Text":"To automatically balance query load across multiple database servers","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"}]};
