  <script>
  var QUIZ_DATA = {"ModuleFolderName":"Module_11_(Week_11)","CourseName":"COP4709 \u2014 Applied Database II","LastModified":"2026-11-17T04:50:09.4305019-05:00","NextQuestionNumber":46,"Questions":[{"Id":"Q001","Type":"MC","Title":"Question 1","QuestionText":"What is database performance primarily measured by?","Hint":null,"Feedback":"Database performance is measured by response time (how fast queries complete) throughput (transactions per second) resource utilization (CPU memory disk I/O) and concurrency (simultaneous users). Good performance means fast query response acceptable throughput efficient resource use and minimal blocking. Performance monitoring tracks these metrics to identify issues.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304839-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"The size of the database in gigabytes","OptionFeedback":""},{"Weight":100,"Text":"Response time throughput and resource utilization for queries and transactions","OptionFeedback":""},{"Weight":0,"Text":"The number of tables in the database","OptionFeedback":""},{"Weight":0,"Text":"The age of the database server","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q002","Type":"MC","Title":"Question 2","QuestionText":"What is the purpose of a query execution plan?","Hint":null,"Feedback":"Execution plans show how SQL Server processes a query: operations performed (scans seeks joins) operation order estimated costs row counts and resource usage. View in SSMS with Ctrl\u002BL (estimated) or Ctrl\u002BM (actual). Identify problems: table scans missing indexes expensive operations. Essential tool for query optimization.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304848-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"To show how SQL Server will execute a query including operations order and resource estimates","OptionFeedback":""},{"Weight":0,"Text":"To automatically optimize all queries","OptionFeedback":""},{"Weight":0,"Text":"To backup query results","OptionFeedback":""},{"Weight":0,"Text":"To schedule query execution times","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q003","Type":"MC","Title":"Question 3","QuestionText":"Why is an index seek generally better than a table scan?","Hint":null,"Feedback":"Index seek uses an index to jump directly to needed rows reading minimal data. Table scan reads every row in the table even if only few are needed. Example: finding one customer by ID with index seek reads 1 page; table scan reads all pages. Index seeks are efficient for selective queries. Table scans may be acceptable for small tables or when returning most rows.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304851-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Index seeks are always slower but more accurate","OptionFeedback":""},{"Weight":100,"Text":"Index seeks read only necessary rows while table scans read every row in the table","OptionFeedback":""},{"Weight":0,"Text":"Table scans use indexes but seeks do not","OptionFeedback":""},{"Weight":0,"Text":"There is no difference between them","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q004","Type":"MC","Title":"Question 4","QuestionText":"What do Dynamic Management Views (DMVs) like sys.dm_db_missing_index_details provide?","Hint":null,"Feedback":"sys.dm_db_missing_index_details and related DMVs track queries that would benefit from indexes SQL Server hasn\u0027t created. Query: SELECT * FROM sys.dm_db_missing_index_details WHERE database_id = DB_ID(). Shows table columns equality/inequality columns included columns and impact estimate. Review suggestions carefully - not all are beneficial. Reset on restart.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304853-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Lists of tables that need to be deleted","OptionFeedback":""},{"Weight":100,"Text":"Suggestions for indexes that could improve query performance based on actual query patterns","OptionFeedback":""},{"Weight":0,"Text":"Automatic index creation commands","OptionFeedback":""},{"Weight":0,"Text":"Lists of unused tables","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q005","Type":"MC","Title":"Question 5","QuestionText":"What do wait statistics reveal about database performance?","Hint":null,"Feedback":"Wait statistics show why queries wait: PAGEIOLATCH (disk I/O) CXPACKET (parallelism) LCK_M (locks) SOS_SCHEDULER_YIELD (CPU) RESOURCE_SEMAPHORE (memory). Query sys.dm_os_wait_stats. Identify bottlenecks: high PAGEIOLATCH suggests disk issues high LCK suggests blocking. Focus on top waits by percentage. Use to guide optimization efforts where they matter most.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430486-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"What resources queries are waiting for such as CPU disk I/O locks or memory","OptionFeedback":""},{"Weight":0,"Text":"How long queries have been running","OptionFeedback":""},{"Weight":0,"Text":"The number of users connected","OptionFeedback":""},{"Weight":0,"Text":"Database backup status","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q006","Type":"MC","Title":"Question 6","QuestionText":"How does index fragmentation affect performance?","Hint":null,"Feedback":"Index fragmentation occurs when logical page order doesn\u0027t match physical order or pages aren\u0027t full. Causes: extra I/O to read scattered pages slower range scans and wasted storage. Check: sys.dm_db_index_physical_stats. Rebuild (\u003E 30% fragmentation) or reorganize (5-30%). Regular maintenance prevents performance degradation. Critical for frequently scanned indexes.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304868-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Fragmentation improves query speed","OptionFeedback":""},{"Weight":0,"Text":"Fragmentation has no impact on performance","OptionFeedback":""},{"Weight":100,"Text":"Fragmentation causes more disk I/O and slower queries due to scattered data pages","OptionFeedback":""},{"Weight":0,"Text":"Fragmentation only affects INSERT operations","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q007","Type":"MC","Title":"Question 7","QuestionText":"Why are database statistics critical for performance?","Hint":null,"Feedback":"Statistics contain data distribution information (row counts distinct values density) used by the query optimizer to estimate cardinality and choose optimal execution plans. Outdated statistics cause poor plans: wrong join orders bad index choices inefficient operations. Update regularly: UPDATE STATISTICS or enable AUTO_UPDATE_STATISTICS. Critical after large data changes.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430487-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Statistics help the query optimizer make accurate decisions about execution plans and join orders","OptionFeedback":""},{"Weight":0,"Text":"Statistics are only used for reporting","OptionFeedback":""},{"Weight":0,"Text":"Statistics slow down queries","OptionFeedback":""},{"Weight":0,"Text":"Statistics are optional and provide no benefit","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q008","Type":"MC","Title":"Question 8","QuestionText":"What is parameter sniffing and when does it cause problems?","Hint":null,"Feedback":"Parameter sniffing: SQL Server optimizes plans based on first parameter values. Problem: if first execution uses atypical value (e.g. common customer) plan may be wrong for typical values (rare customers). Symptoms: sometimes fast sometimes slow. Solutions: OPTION (RECOMPILE) OPTION (OPTIMIZE FOR) local variables or plan guides. Balance plan reuse benefits against parameter sensitivity.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304873-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Parameter sniffing is always beneficial","OptionFeedback":""},{"Weight":100,"Text":"Parameter sniffing reuses plans optimized for initial parameters causing poor performance for different parameter values","OptionFeedback":""},{"Weight":0,"Text":"Parameter sniffing prevents query execution","OptionFeedback":""},{"Weight":0,"Text":"Parameter sniffing only affects stored procedures","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q009","Type":"MC","Title":"Question 9","QuestionText":"What is the difference between blocking and deadlocks?","Hint":null,"Feedback":"Blocking: Transaction A holds lock Transaction B waits. Resolves when A commits/rolls back. Expected in concurrent systems but excessive blocking hurts performance. Deadlock: A waits for B B waits for A - circular. SQL Server detects and kills one (deadlock victim). Monitor blocking: sys.dm_exec_requests. Reduce: shorter transactions appropriate isolation consistent access order.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304876-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Blocking is temporary waiting for locks while deadlocks are circular dependencies requiring intervention","OptionFeedback":""},{"Weight":0,"Text":"Blocking and deadlocks are the same thing","OptionFeedback":""},{"Weight":0,"Text":"Deadlocks are less severe than blocking","OptionFeedback":""},{"Weight":0,"Text":"Neither affects performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q010","Type":"MC","Title":"Question 10","QuestionText":"What indicates a CPU performance bottleneck?","Hint":null,"Feedback":"CPU bottleneck indicators: sustained \u003E 80% CPU usage SOS_SCHEDULER_YIELD top wait type slow queries despite good I/O and query queue buildup. Causes: missing indexes inefficient queries excessive parallelism or insufficient CPU. Solutions: optimize queries add indexes tune parallelism add CPU capacity or offload work. Monitor with Performance Monitor and DMVs.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430488-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Low CPU usage with slow queries","OptionFeedback":""},{"Weight":100,"Text":"Consistently high CPU utilization with SOS_SCHEDULER_YIELD waits and slow query response","OptionFeedback":""},{"Weight":0,"Text":"High disk I/O with low CPU","OptionFeedback":""},{"Weight":0,"Text":"CPU bottlenecks cannot be detected","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q011","Type":"MC","Title":"Question 11","QuestionText":"How can you detect memory pressure in SQL Server?","Hint":null,"Feedback":"Memory pressure signs: RESOURCE_SEMAPHORE waits (queries waiting for memory grants) low Page Life Expectancy (\u003C 300 seconds = frequent cache eviction) PAGEIOLATCH waits (compensatory I/O) high lazy writes. Query sys.dm_os_memory_clerks and perfmon counters. Solutions: add memory reduce memory grants optimize queries or limit max server memory appropriately.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304883-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Memory pressure is always beneficial","OptionFeedback":""},{"Weight":100,"Text":"RESOURCE_SEMAPHORE waits low page life expectancy and frequent paging indicate memory pressure","OptionFeedback":""},{"Weight":0,"Text":"Memory issues cannot be detected","OptionFeedback":""},{"Weight":0,"Text":"High CPU always means memory problems","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q012","Type":"MC","Title":"Question 12","QuestionText":"What indicates a disk I/O performance bottleneck?","Hint":null,"Feedback":"I/O bottleneck indicators: PAGEIOLATCH_* top waits high average disk sec/read or sec/write (\u003E 15ms poor) high disk queue length slow queries with many reads. Causes: slow storage missing indexes table scans. Solutions: faster storage (SSD) better indexes query optimization separate tempdb/logs or enable read-ahead. Monitor with perfmon and sys.dm_io_virtual_file_stats.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304885-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"High PAGEIOLATCH waits slow query response and high average disk queue length","OptionFeedback":""},{"Weight":0,"Text":"Low disk usage with fast queries","OptionFeedback":""},{"Weight":0,"Text":"High CPU with low disk activity","OptionFeedback":""},{"Weight":0,"Text":"I/O bottlenecks show no symptoms","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q013","Type":"MC","Title":"Question 13","QuestionText":"How does Query Store help with performance troubleshooting?","Hint":null,"Feedback":"Query Store (SQL Server 2016\u002B) captures: query text execution plans runtime statistics and resource usage over time. Benefits: identify regressed queries compare plan performance force good plans and trend analysis. Enable: ALTER DATABASE SET QUERY_STORE = ON. Essential for troubleshooting \u0027it was fast yesterday\u0027 problems. Minimal overhead with proper configuration.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304887-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Query Store automatically fixes all performance issues","OptionFeedback":""},{"Weight":100,"Text":"Query Store captures query performance history enabling comparison over time and plan regression detection","OptionFeedback":""},{"Weight":0,"Text":"Query Store only works with stored procedures","OptionFeedback":""},{"Weight":0,"Text":"Query Store slows down the database","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q014","Type":"MC","Title":"Question 14","QuestionText":"What is the performance trade-off of having too many indexes?","Hint":null,"Feedback":"Index trade-offs: faster SELECT queries but slower writes (INSERT UPDATE DELETE maintain all indexes) more storage space and maintenance overhead (fragmentation updates statistics). Each index added helps some queries hurts write performance. Balance: index frequently queried columns remove unused indexes. Find unused: sys.dm_db_index_usage_stats. More isn\u0027t always better.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430489-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"More indexes always improve performance","OptionFeedback":""},{"Weight":100,"Text":"Indexes speed up reads but slow down INSERT UPDATE and DELETE operations and use storage","OptionFeedback":""},{"Weight":0,"Text":"Indexes have no negative effects","OptionFeedback":""},{"Weight":0,"Text":"The number of indexes doesn\u0027t matter","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q015","Type":"MC","Title":"Question 15","QuestionText":"Why does SELECT * hurt query performance?","Hint":null,"Feedback":"SELECT * problems: retrieves unneeded columns prevents covering indexes (index with all needed columns) wastes network bandwidth wastes memory breaks with schema changes. Example: SELECT CustomerID Name faster than SELECT * from 50-column table if you only need 2 columns. Always specify needed columns. Covering indexes work only with explicit column lists.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304892-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SELECT * is the fastest way to query data","OptionFeedback":""},{"Weight":100,"Text":"SELECT * retrieves unnecessary columns preventing covering indexes and wasting network bandwidth","OptionFeedback":""},{"Weight":0,"Text":"SELECT * uses special optimizations","OptionFeedback":""},{"Weight":0,"Text":"There is no performance difference","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q016","Type":"MC","Title":"Question 16","QuestionText":"How do implicit data type conversions affect performance?","Hint":null,"Feedback":"Implicit conversion example: WHERE VarcharColumn = 123 converts every row\u0027s varchar to int preventing index use. Shows CONVERT_IMPLICIT in execution plan causes scans not seeks. Solution: match data types WHERE VarcharColumn = \u0027123\u0027 or fix schema. Common with varchar/nvarchar int/varchar mismatches. Always use correct types in predicates and joins.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304894-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Implicit conversions improve performance","OptionFeedback":""},{"Weight":100,"Text":"Implicit conversions prevent index usage and cause table scans reducing performance","OptionFeedback":""},{"Weight":0,"Text":"SQL Server has no implicit conversions","OptionFeedback":""},{"Weight":0,"Text":"Conversions only affect storage size","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q017","Type":"MC","Title":"Question 17","QuestionText":"When does excessive query recompilation hurt performance?","Hint":null,"Feedback":"Recompilation causes: CPU overhead for plan generation loss of plan reuse benefits and compilation waits. Triggers: schema changes statistics updates WITH RECOMPILE hint temp table usage or plan cache pressure. Balance: some recompilation good (parameter sensitivity) excessive recompilation bad. Monitor: SQL Server Profiler or Extended Events. Reduce: avoid dynamic SQL fix temp table issues.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304897-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Frequent recompilation wastes CPU generating plans instead of reusing cached plans","OptionFeedback":""},{"Weight":0,"Text":"Recompilation always improves performance","OptionFeedback":""},{"Weight":0,"Text":"Recompilation has no performance impact","OptionFeedback":""},{"Weight":0,"Text":"Queries never recompile","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q018","Type":"MC","Title":"Question 18","QuestionText":"What is a covering index and why does it improve performance?","Hint":null,"Feedback":"Covering index contains all columns in SELECT WHERE JOIN ORDER BY. Query satisfied entirely from index no table access needed. Example: for SELECT CustomerID Name WHERE City=\u0027NYC\u0027 index on City including CustomerID Name is covering. Execution plan shows Index Seek no key lookups. Major performance gain especially for large tables. Trade-off: wider indexes more storage.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.43049-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"An index that covers the entire table","OptionFeedback":""},{"Weight":100,"Text":"An index containing all columns needed by a query eliminating table lookups","OptionFeedback":""},{"Weight":0,"Text":"An index that prevents all writes","OptionFeedback":""},{"Weight":0,"Text":"The clustered index only","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q019","Type":"MC","Title":"Question 19","QuestionText":"Why are cursors generally bad for performance?","Hint":null,"Feedback":"Cursor problems: row-by-row processing (RBAR - Row By Agonizing Row) vs efficient set operations overhead for OPEN FETCH CLOSE hold locks longer and network round trips. Set-based alternative often 10-100x faster. Example: UPDATE with JOIN vs cursor with UPDATE per row. Use cursors only when truly necessary (calling external procedures per row). Default to set-based thinking.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304902-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Cursors are the fastest way to process data","OptionFeedback":""},{"Weight":100,"Text":"Cursors process data row-by-row instead of set-based causing overhead and slowness","OptionFeedback":""},{"Weight":0,"Text":"Cursors use special optimizations","OptionFeedback":""},{"Weight":0,"Text":"Cursors have no performance impact","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q020","Type":"MC","Title":"Question 20","QuestionText":"What causes tempdb performance problems?","Hint":null,"Feedback":"TempDB contention causes: allocation page contention (PFS GAM SGAM) excessive temp table/variable use insufficient files sort/hash spills or slow storage. Symptoms: PAGELATCH_* waits on 2:1:1 2:1:3 pages slow queries using temp objects. Solutions: multiple data files (one per CPU up to 8) fast storage reduce temp object use or enable trace flags 1117/1118 (pre-2016).","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304905-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Excessive temp table use poor configuration and allocation contention on system pages","OptionFeedback":""},{"Weight":0,"Text":"TempDB problems cannot occur","OptionFeedback":""},{"Weight":0,"Text":"TempDB is always the fastest database","OptionFeedback":""},{"Weight":0,"Text":"Only user databases have performance issues","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q021","Type":"MC","Title":"Question 21","QuestionText":"How do you identify long-running queries?","Hint":null,"Feedback":"Find long-running queries: sys.dm_exec_requests (currently executing) sys.dm_exec_query_stats (historical aggregates) Query Store (detailed history) or Extended Events (session tracking). Example: SELECT * FROM sys.dm_exec_requests WHERE total_elapsed_time \u003E 60000 ORDER BY total_elapsed_time DESC. Identify: slow queries blocking queries resource hogs. Optimize or terminate as needed.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304908-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Long-running queries cannot be detected","OptionFeedback":""},{"Weight":100,"Text":"Query sys.dm_exec_requests use Extended Events or check Query Store for duration statistics","OptionFeedback":""},{"Weight":0,"Text":"All queries run for the same duration","OptionFeedback":""},{"Weight":0,"Text":"Only stored procedures can be long-running","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q022","Type":"MC","Title":"Question 22","QuestionText":"How does connection pooling improve application performance?","Hint":null,"Feedback":"Connection pooling maintains a pool of open connections that applications reuse. Benefits: eliminates connection creation overhead (authentication network setup) reduces server load supports more concurrent users with fewer connections. Application-side feature (ADO.NET connection strings). Without pooling: every request creates/destroys connection huge overhead. Properly configured pooling essential for scalability.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430491-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Reuses database connections avoiding expensive connection creation overhead","OptionFeedback":""},{"Weight":0,"Text":"Pooling makes queries run faster","OptionFeedback":""},{"Weight":0,"Text":"Pooling is only for web applications","OptionFeedback":""},{"Weight":0,"Text":"Pooling has no performance benefit","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q023","Type":"MC","Title":"Question 23","QuestionText":"How does query complexity affect performance?","Hint":null,"Feedback":"Complex queries cause: longer compilation time more operations to execute higher resource usage and difficult optimization. Examples: 10-table joins nested subqueries scalar functions in WHERE or complex CASE logic. Simplify: break into steps use temp tables pre-aggregate data or materialize views. Balance: sometimes complex single query better than multiple simple queries. Test and measure.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304913-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Complex queries are always faster","OptionFeedback":""},{"Weight":100,"Text":"More complex queries with multiple joins subqueries and functions generally perform worse","OptionFeedback":""},{"Weight":0,"Text":"Query complexity has no impact","OptionFeedback":""},{"Weight":0,"Text":"Simple queries are always slower","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q024","Type":"MC","Title":"Question 24","QuestionText":"When might UNION ALL perform better than OR in WHERE clause?","Hint":null,"Feedback":"OR clause example: WHERE CategoryID = 1 OR Status = \u0027Active\u0027 may scan if no single index covers both. UNION ALL alternative: SELECT * FROM Products WHERE CategoryID = 1 UNION ALL SELECT * FROM Products WHERE Status = \u0027Active\u0027 AND CategoryID \u003C\u003E 1 uses indexes separately. Trade-off: UNION adds overhead. Test both. OR works well with same column (CategoryID = 1 OR CategoryID = 2).","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304917-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"OR is always faster than UNION","OptionFeedback":""},{"Weight":100,"Text":"UNION ALL can use separate indexes for each condition while OR may cause scans","OptionFeedback":""},{"Weight":0,"Text":"UNION and OR are identical in performance","OptionFeedback":""},{"Weight":0,"Text":"UNION ALL cannot replace OR","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q025","Type":"MC","Title":"Question 25","QuestionText":"Why do scalar user-defined functions in queries hurt performance?","Hint":null,"Feedback":"Scalar UDF problems: execute once per row (RBAR) prevent parallel plans hide costs from execution plan and context switching overhead. Example: SELECT dbo.GetTax(Amount) executes function for every row. Solutions: inline function logic use inline table-valued functions or materialize results. SQL Server 2019\u002B inlines simple scalar functions. Major performance killer in large result sets.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304919-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Scalar functions improve query performance","OptionFeedback":""},{"Weight":100,"Text":"Scalar functions execute once per row prevent parallelism and hide actual execution costs","OptionFeedback":""},{"Weight":0,"Text":"Functions are always faster than inline code","OptionFeedback":""},{"Weight":0,"Text":"Functions have no performance impact","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q026","Type":"MC","Title":"Question 26","QuestionText":"What is a key lookup and why does it hurt performance?","Hint":null,"Feedback":"Key lookup (RID lookup or clustered index seek) happens when nonclustered index doesn\u0027t contain all needed columns requiring additional table access per row. Expensive for many rows. Solution: covering index with INCLUDE columns. Example: index on LastName includes FirstName avoids lookup. Execution plan shows Key Lookup operator. Tipping point: \u003E 30-40% of rows usually cheaper to scan.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304922-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Key lookup occurs when an index seek must access the table for additional columns causing extra I/O","OptionFeedback":""},{"Weight":0,"Text":"Key lookups are the fastest operation","OptionFeedback":""},{"Weight":0,"Text":"Key lookups only occur with no indexes","OptionFeedback":""},{"Weight":0,"Text":"Key lookups improve performance","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q027","Type":"MC","Title":"Question 27","QuestionText":"How can poorly configured auto-growth impact performance?","Hint":null,"Feedback":"Poor auto-growth (1MB or 10%) causes: frequent growth operations pauses during expansion physical file fragmentation and unpredictable performance. Best practice: pre-size databases use fixed increment (not percent) size appropriately for growth rate (e.g. 512MB) and monitor free space. Growth still blocks operations. Instant file initialization helps data files but not log files.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304925-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Auto-growth always improves performance","OptionFeedback":""},{"Weight":100,"Text":"Small growth increments cause frequent pauses for file expansion and fragmentation","OptionFeedback":""},{"Weight":0,"Text":"Auto-growth settings don\u0027t affect performance","OptionFeedback":""},{"Weight":0,"Text":"Larger growth increments are worse","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q028","Type":"MC","Title":"Question 28","QuestionText":"How does transaction log configuration affect performance?","Hint":null,"Feedback":"Transaction log impact: every transaction must write to log fast log storage critical (SSD) log on separate disk from data frequent backups prevent log growth and proper sizing avoids auto-growth pauses. Symptoms: slow writes WRITELOG waits log I/O bottleneck. Sequential I/O so benefits from dedicated disk. Never put on slow/shared storage. Log performance critical for write-heavy workloads.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304927-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Slow log storage or insufficient size causes performance problems as all writes must be logged","OptionFeedback":""},{"Weight":0,"Text":"Transaction logs don\u0027t impact performance","OptionFeedback":""},{"Weight":0,"Text":"Larger logs are always slower","OptionFeedback":""},{"Weight":0,"Text":"Transaction logs are optional","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q029","Type":"MC","Title":"Question 29","QuestionText":"What performance issue occurs with queries joining many tables?","Hint":null,"Feedback":"Problems with many joins (\u003E 10 tables): combinatorial explosion of possible join orders long compilation times higher memory for joins and increased likelihood of poor plan. Solutions: pre-aggregate data use indexed views eliminate unnecessary joins or break into steps with temp tables. Review: are all joins necessary? Can data model be improved? Test performance with representative data.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304929-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"More joins always improve performance","OptionFeedback":""},{"Weight":100,"Text":"Many joins increase complexity compilation time memory requirements and risk of poor join order","OptionFeedback":""},{"Weight":0,"Text":"The number of joins doesn\u0027t affect performance","OptionFeedback":""},{"Weight":0,"Text":"SQL Server has no limit on joins","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q030","Type":"MC","Title":"Question 30","QuestionText":"Why are regular maintenance windows important for performance?","Hint":null,"Feedback":"Maintenance tasks: rebuild/reorganize fragmented indexes update statistics check database integrity backup databases and shrink logs if needed. Benefits: optimal query plans reduced I/O consistent performance. Schedule during low-usage periods. Use maintenance plans or Ola Hallengren scripts. Neglecting maintenance causes gradual performance degradation. Regular maintenance essential for production systems.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304935-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Maintenance always hurts performance","OptionFeedback":""},{"Weight":100,"Text":"Regular maintenance like index rebuilds and statistics updates prevents performance degradation over time","OptionFeedback":""},{"Weight":0,"Text":"Databases don\u0027t need maintenance","OptionFeedback":""},{"Weight":0,"Text":"Maintenance should only happen during peak hours","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q031","Type":"MC","Title":"Question 31","QuestionText":"When reading execution plans what should you look for first?","Hint":null,"Feedback":"Execution plan analysis: identify high-cost operators (\u003E 20% of query) thick arrows (many rows unexpected) warnings (missing index type conversion) scans vs seeks and mismatched estimates vs actual rows. Red warning icons particularly important. Right-to-left execution flow. Use actual execution plans. Compare estimated vs actual row counts - large differences indicate stale statistics. Focus optimization on expensive operations.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304938-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Operators with highest cost thick arrows indicating many rows and warnings","OptionFeedback":""},{"Weight":0,"Text":"The total number of operators","OptionFeedback":""},{"Weight":0,"Text":"The color of the operators","OptionFeedback":""},{"Weight":0,"Text":"Execution plans cannot be interpreted","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q032","Type":"MC","Title":"Question 32","QuestionText":"How does Resource Governor help with performance management?","Hint":null,"Feedback":"Resource Governor creates workload groups with resource limits (CPU memory I/O). Benefits: prevent runaway queries prioritize critical workloads guarantee minimum resources and isolate different applications. Example: limit reporting workload to 30% CPU prevent reports from impacting OLTP. Configure pools groups and classifier function. Enterprise Edition feature. Essential for multi-tenant or mixed workloads.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430494-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Resource Governor improves all query performance","OptionFeedback":""},{"Weight":100,"Text":"Resource Governor limits resource consumption by workload groups preventing resource monopolization","OptionFeedback":""},{"Weight":0,"Text":"Resource Governor is only for backup operations","OptionFeedback":""},{"Weight":0,"Text":"Resource Governor has no performance benefits","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q033","Type":"MC","Title":"Question 33","QuestionText":"What are the risks of using NOLOCK hint for performance?","Hint":null,"Feedback":"NOLOCK risks: dirty reads (uncommitted data) duplicate rows (page splits) missing rows (page movements) wrong aggregates or inconsistent data. Example: read balance during transfer see incorrect state. Use only when: approximate results acceptable non-critical queries or reports where accuracy not critical. Better alternatives: READ COMMITTED SNAPSHOT or snapshots. Don\u0027t use NOLOCK by default.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304943-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"NOLOCK has no risks and should always be used","OptionFeedback":""},{"Weight":100,"Text":"NOLOCK can read uncommitted data duplicates missing rows causing incorrect results","OptionFeedback":""},{"Weight":0,"Text":"NOLOCK is the safest hint available","OptionFeedback":""},{"Weight":0,"Text":"NOLOCK prevents all concurrency issues","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q034","Type":"MC","Title":"Question 34","QuestionText":"How does lock escalation affect performance?","Hint":null,"Feedback":"Lock escalation converts many row/page locks to table lock (default 5000\u002B locks). Benefits: reduced memory overhead faster lock management. Costs: more blocking other users entire table locked. Prevent: ROWLOCK hint DISABLE_LOCK_ESCALATION better indexing or partition tables. Monitor escalations: Extended Events. Balance: some escalation normal excessive escalation problematic. Design queries to minimize locks needed.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304946-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Lock escalation reduces lock overhead but can increase blocking by converting to table locks","OptionFeedback":""},{"Weight":0,"Text":"Lock escalation always improves performance","OptionFeedback":""},{"Weight":0,"Text":"Lock escalation never occurs","OptionFeedback":""},{"Weight":0,"Text":"Escalation only affects reads","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q035","Type":"MC","Title":"Question 35","QuestionText":"What is cardinality estimation and why does it matter?","Hint":null,"Feedback":"Cardinality estimator predicts rows for each operator using statistics. Poor estimates cause: wrong join orders insufficient memory grants or suboptimal index choices. Compare estimated vs actual rows in plans. Large discrepancies indicate: stale statistics multi-column correlation complex predicates. Solutions: update statistics create filtered indexes or use query hints. SQL Server 2014\u002B new cardinality estimator - can enable per database.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304949-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Cardinality estimation predicts row counts for operations affecting join order memory grants and plan quality","OptionFeedback":""},{"Weight":0,"Text":"Cardinality estimation only affects storage","OptionFeedback":""},{"Weight":0,"Text":"Estimation has no impact on performance","OptionFeedback":""},{"Weight":0,"Text":"SQL Server doesn\u0027t estimate cardinality","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q036","Type":"MC","Title":"Question 36","QuestionText":"How do you identify unused indexes that should be removed?","Hint":null,"Feedback":"Find unused indexes: SELECT * FROM sys.dm_db_index_usage_stats WHERE user_seeks = 0 AND user_scans = 0 AND user_lookups = 0 AND user_updates \u003E 0. Shows indexes only maintained never used. Remove to: reduce write overhead save storage speed up modifications. Caution: stats reset on restart consider seasonal patterns monthly reports. Keep primary keys and unique constraints for data integrity.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304951-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"All indexes should be kept","OptionFeedback":""},{"Weight":100,"Text":"Query sys.dm_db_index_usage_stats to find indexes with no or minimal reads but frequent writes","OptionFeedback":""},{"Weight":0,"Text":"Unused indexes cannot be detected","OptionFeedback":""},{"Weight":0,"Text":"Index usage doesn\u0027t matter","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q037","Type":"MC","Title":"Question 37","QuestionText":"When can parallelism hurt rather than help performance?","Hint":null,"Feedback":"Parallelism problems: CXPACKET waits (thread coordination) overhead for small queries excessive MAXDOP (too many threads) or resource contention. Symptoms: parallel plans slower than serial for small queries excessive CXPACKET waits. Solutions: raise cost threshold for parallelism (default 5 too low) set appropriate MAXDOP use OPTION(MAXDOP 1) hint for OLTP. Large analytical queries benefit; small OLTP queries do not.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304953-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Parallelism adds overhead that outweighs benefits for small result sets or with CXPACKET waits","OptionFeedback":""},{"Weight":0,"Text":"Parallelism always improves performance","OptionFeedback":""},{"Weight":0,"Text":"Parallel queries are always slower","OptionFeedback":""},{"Weight":0,"Text":"Parallelism has no overhead","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q038","Type":"MC","Title":"Question 38","QuestionText":"How does poor database design affect performance?","Hint":null,"Feedback":"Poor design impacts: overly normalized requires excessive joins poorly normalized causes redundancy/anomalies wrong data types waste space no appropriate keys slows queries or missing indexes forces scans. Good design: appropriate normalization correct data types proper keys indexed appropriately and logical relationships. Design review critical early in project. Fixing design post-production expensive. Performance starts with good design.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304956-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Poor design causes complex queries redundant data inefficient storage and maintenance problems","OptionFeedback":""},{"Weight":0,"Text":"Database design doesn\u0027t affect performance","OptionFeedback":""},{"Weight":0,"Text":"Denormalized designs are always faster","OptionFeedback":""},{"Weight":0,"Text":"All database designs perform identically","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q039","Type":"MC","Title":"Question 39","QuestionText":"How can SET options affect query performance?","Hint":null,"Feedback":"SET options impact: indexed views require specific ANSI settings different settings prevent plan reuse ARITHABORT affects optimization and NOCOUNT reduces network traffic. Plan cache pollution: different SET combinations create separate plans wasting cache. Best practice: consistent SET options across application use ANSI settings for indexed views and include SET NOCOUNT ON in procedures. Connection pooling helps ensure consistency.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304959-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SET options only affect results not performance","OptionFeedback":""},{"Weight":100,"Text":"SET options like ANSI settings affect plan caching and indexed view usage","OptionFeedback":""},{"Weight":0,"Text":"SET options are purely cosmetic","OptionFeedback":""},{"Weight":0,"Text":"All queries use the same SET options","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q040","Type":"MC","Title":"Question 40","QuestionText":"Why are performance baselines important?","Hint":null,"Feedback":"Baseline captures: normal performance metrics resource usage patterns query response times and throughput during typical load. Benefits: identify degradation quickly establish capacity planning provide before/after comparison and support SLA monitoring. Capture during normal operations. Tools: Performance Monitor Query Store custom logging. Without baseline cannot determine if current performance is problem or normal. Essential for proactive management.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304961-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Baselines provide reference points to identify when performance degrades from normal","OptionFeedback":""},{"Weight":0,"Text":"Baselines slow down the database","OptionFeedback":""},{"Weight":0,"Text":"Performance cannot be measured","OptionFeedback":""},{"Weight":0,"Text":"Baselines are only for troubleshooting","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q041","Type":"MC","Title":"Question 41","QuestionText":"How does database compatibility level affect performance?","Hint":null,"Feedback":"Compatibility level controls: optimizer version cardinality estimator (2014\u002B) query features available and behavior changes. Example: level 130\u002B uses new CE level 110 uses legacy CE. Impact: different execution plans performance changes feature availability. Test thoroughly before changing level. Use Query Store to identify regressions. Don\u0027t assume newer is always better - test with workload.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304963-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Compatibility level only affects syntax","OptionFeedback":""},{"Weight":100,"Text":"Compatibility level determines query optimizer version cardinality estimator and available features","OptionFeedback":""},{"Weight":0,"Text":"Compatibility level has no performance impact","OptionFeedback":""},{"Weight":0,"Text":"All compatibility levels perform identically","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q042","Type":"MC","Title":"Question 42","QuestionText":"How does optimizing for reads vs writes differ?","Hint":null,"Feedback":"Read optimization: many indexes covering indexes indexed views denormalization materialized aggregates. Write optimization: fewer indexes minimal constraints partition tables bulk operations batch writes. OLTP: balance both. Data warehouse: optimize reads accept slower loads. Transactional: optimize writes accept read cost. Identify workload characteristics: read-heavy write-heavy or mixed. Optimize accordingly.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304965-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":100,"Text":"Read optimization adds indexes while write optimization minimizes indexes and constraints","OptionFeedback":""},{"Weight":0,"Text":"Both require identical optimization strategies","OptionFeedback":""},{"Weight":0,"Text":"Optimization doesn\u0027t vary by operation type","OptionFeedback":""},{"Weight":0,"Text":"Writes are always faster than reads","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q043","Type":"MC","Title":"Question 43","QuestionText":"What are the primary tools for monitoring SQL Server performance?","Hint":null,"Feedback":"Monitoring tools: DMVs (real-time queries) Extended Events (lightweight tracing) Performance Monitor (OS metrics) Query Store (query history) Activity Monitor (GUI overview) Execution plans (query analysis) and third-party tools (comprehensive solutions). Use combination: DMVs for point-in-time Extended Events for patterns Query Store for trends. Each tool serves different purpose. Master built-in tools before expensive third-party solutions.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.4304968-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"SQL Server has no built-in monitoring tools","OptionFeedback":""},{"Weight":100,"Text":"DMVs Extended Events Performance Monitor Query Store and Profiler for comprehensive monitoring","OptionFeedback":""},{"Weight":0,"Text":"Only Event Viewer is needed","OptionFeedback":""},{"Weight":0,"Text":"Third-party tools are the only option","OptionFeedback":""}],"TrueWeight":0,"TrueFeedback":null,"FalseWeight":0,"FalseFeedback":null,"MultiselectOptions":null,"Items":null,"TypeDisplayName":"Multiple Choice","TypeBadge":"MC"},{"Id":"Q044","Type":"MC","Title":"Question 44","QuestionText":"How do query timeout settings affect performance troubleshooting?","Hint":null,"Feedback":"Query timeouts: prevent resource monopolization limit user wait time protect system availability. However: mask underlying problems (query needs optimization) may interrupt legitimate long queries and don\u0027t fix root cause. Best practice: set reasonable timeouts investigate timed-out queries optimize root causes and separate OLTP (short timeout) from reporting (longer timeout). Timeout is last resort not solution.","TopicTitle":"Quiz 9 - Performance","ModuleStudentOutcomeIds":[],"TopicIds":[],"GeneratedDate":"2026-11-17T04:50:09.430497-05:00","InitialText":null,"AnswerKey":null,"Answers":null,"Scoring":null,"Choices":null,"Matches":null,"Options":[{"Weight":0,"Text":"Timeouts improve query performance","OptionFeedback":""},{"Weight":100,"Text":"Timeouts prevent runaway queries but may hide underlying performance problems","OptionFeedback":""},{"Weight":0,"Text":"Timeouts have no effect on queries","OptionFeedback":""},{"Weight":0,"Text":"All queries should have timeouts disabled","Option
